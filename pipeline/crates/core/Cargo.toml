[package]
name = "pipeline-core"
version = "0.1.0"
edition = "2021"
description = "Typed, regex-free slug/elo-bucket/map/civ lookups shared across the AOE2 guide's data pipeline"
publish = false

[lib]
name = "pipeline_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
