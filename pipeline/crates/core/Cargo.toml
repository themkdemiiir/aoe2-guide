[package]
name = "pipeline-core"
version.workspace = true
edition.workspace = true
description = "Typed, regex-free slug/elo-bucket/map/civ/patch lookups shared across the AOE2 guide's data pipeline"
license.workspace = true
publish.workspace = true

[lib]
name = "pipeline_core"
path = "src/lib.rs"

[features]
# `refdata` compiles the civ/map/patch lookup tables, which `include_str!` four data files from
# the repo root (`src/data/*.json`, `scripts/.../maps.tsv`) at build time. It is OPT-IN (not default):
# a workspace member's default features are unified ON across the whole workspace, so a default
# `refdata` would force those repo-root files to exist even for a lean `pipeline/`-context Docker
# build of a binary that only needs `redact_secret`. Enable it explicitly where the civ/map
# lookups are actually used (and where the files are present): `--features pipeline-core/refdata`
# or `cargo test --all-features`.
refdata = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
# For `core::cli` — the shared binary bootstrap (`init_tracing`/`database_url`/
# `log_error_and_code`). Always compiled: every pipeline binary wants this. See `cli.rs` for why
# `core` accepts these as a deliberate exception to "functional core, no shell deps".
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# For `core::age::UnknownAge` — a library-edge typed error a caller can match on (playbook
# principle: thiserror at library edges, anyhow at binary edges). Always compiled, like `age`
# itself.
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
