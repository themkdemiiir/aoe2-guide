[package]
name = "pipeline"
version.workspace = true
edition.workspace = true
description = "Composition root: joins replay's ParsedReplay + fetch's DiscoverySeed into ingest's ReplayBatch DTOs"
license.workspace = true
publish.workspace = true

[lib]
name = "pipeline"
path = "src/lib.rs"

[[bin]]
name = "pipeline"
path = "src/main.rs"

[dependencies]
# The ONE place these three adapters compose (see the crate doc + rust-playbook.md's
# "composition root" pattern) — none of `replay`/`fetch`/`ingest` depend on each other or on this
# crate.
pipeline-core = { path = "../core", default-features = false } # ids/Age only; no refdata needed
replay = { path = "../replay" }
fetch = { path = "../fetch" }
ingest = { path = "../ingest" }
thiserror = { workspace = true }
# For the thin `src/main.rs` skeleton's `init_tracing` call only — the library (`to_batch`) itself
# never logs (pure, no IO).
tracing = { workspace = true }

[dev-dependencies]
# Test fixtures build `DiscoverySeed.played_at` (`DateTime<Utc>`) directly.
chrono = { workspace = true }
