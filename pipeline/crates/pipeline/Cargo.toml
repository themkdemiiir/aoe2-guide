[package]
name = "pipeline"
version.workspace = true
edition.workspace = true
description = "Composition root: joins replay's ParsedReplay + fetch's DiscoverySeed into ingest's ReplayBatch DTOs"
license.workspace = true
publish.workspace = true

[lib]
name = "pipeline"
path = "src/lib.rs"

[[bin]]
name = "pipeline"
path = "src/main.rs"

[dependencies]
# The ONE place these three adapters compose (see the crate doc + rust-playbook.md's
# "composition root" pattern) — none of `replay`/`fetch`/`ingest` depend on each other or on this
# crate.
pipeline-core = { path = "../core", default-features = false } # ids/Age only; no refdata needed
replay = { path = "../replay" }
fetch = { path = "../fetch" }
ingest = { path = "../ingest" }
thiserror = { workspace = true }
tracing = { workspace = true }
# `sync` -> the crawl loop's own `Arc<Semaphore>` (bounded concurrency, distinct from `fetch`'s
# internal one); `time` -> the sustained-429 courtesy pause (`tokio::time::sleep`); `signal` ->
# `main.rs`'s Ctrl-C handler. On top of the workspace's `rt-multi-thread`+`macros`.
tokio = { workspace = true, features = ["sync", "time", "signal"] }
# The run loop's one root `CancellationToken` (rust-playbook.md's "Async / pooling" section).
tokio-util = { workspace = true }
tokio-postgres = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
# Binary-edge error handling for `main.rs` only (playbook rule 1) — the library (`to_batch`,
# `crawl`) stays on typed `thiserror` results.
anyhow = { workspace = true }
# `raw`'s raw-replay archive: compresses every downloaded `.aoe2record` (see `raw`'s module doc
# for why zstd over flate2/gzip).
zstd = { workspace = true }
# `raw`'s write-then-verify step hashes both the original bytes and the read-back-decompressed
# copy before trusting a fresh save (see `raw`'s "Integrity" doc section).
sha2 = { workspace = true }
# `import_shards`: the OLD shard corpus (`data-cache/replays/shards/*.ndjson.gz`) is a
# MULTI-MEMBER gzip stream with a corrupt/partial trailing member (an interrupted extraction run)
# — `MultiGzDecoder` decodes every complete member and errors only on that last one, which
# `import_shards::scan_ndjson_gz` treats as "stop, keep the valid prefix" (see its module doc).
flate2 = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
# Both the shard NDJSON rows AND the `duckdb -json` seed-query output are parsed with this —
# `import_shards` never shells out to a CSV parser or hand-rolls JSON.
serde_json = { workspace = true }

[dev-dependencies]
# Test fixtures build `DiscoverySeed.played_at` (`DateTime<Utc>`) directly, and the run-loop
# integration tests (`tests/crawl.rs`) drive `#[tokio::test]`s against FAKE `ReplaySource`/
# `IngestSink`/`ReplayManifest` doubles — never the live Relic API or a real Postgres.
chrono = { workspace = true }
# `raw`'s + `reparse`'s own unit/integration tests write into isolated temp dirs — never the
# repo's real `data-cache/`.
tempfile = "3"
