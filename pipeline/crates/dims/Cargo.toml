[package]
name = "dims"
version.workspace = true
edition.workspace = true
description = "Idempotent loader: reference dimensions (maps/civs/civs_relic/patch_index) from refdata into the AOE2 guide's PostgreSQL pipeline store"
license.workspace = true
publish.workspace = true

[lib]
name = "dims"
path = "src/lib.rs"

[[bin]]
name = "dims"
path = "src/main.rs"

[dependencies]
# `refdata` is required here (unlike migration/ingest): this crate's whole job is loading the
# civ/map/patch reference tables `pipeline_core` parses under that feature.
pipeline-core = { path = "../core", default-features = false, features = ["refdata"] }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
migration = { path = "../migration" }
testcontainers-modules = { workspace = true }
