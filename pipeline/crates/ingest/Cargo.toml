[package]
name = "ingest"
version.workspace = true
edition.workspace = true
description = "Idempotent binary-COPY bulk loader: typed replay row batches -> the AOE2 guide's PostgreSQL pipeline store"
license.workspace = true
publish.workspace = true

[lib]
name = "ingest"
path = "src/lib.rs"

[[bin]]
name = "ingest"
path = "src/main.rs"

[dependencies]
pipeline-core = { path = "../core", default-features = false } # ids/age/secret/cli; no refdata
tokio = { workspace = true }
tokio-postgres = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
migration = { path = "../migration" }
testcontainers-modules = { workspace = true }
