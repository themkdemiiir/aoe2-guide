version: 2

models:
  - name: civ_meta
    description: >
      Per (civ, ladder) overall win/game counts plus a per-elo-bucket breakdown, one flat grain.
      `elo_bucket = 'all'` is the overall rollup row; the nine real buckets fill `byElo`. See the
      model's own SQL doc for the full aggregation.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: ladder
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["1v1", "team"]
      - name: elo_bucket
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "all"
                  - "<1000"
                  - "1000-1199"
                  - "1200-1399"
                  - "1400-1649"
                  - "1650-1799"
                  - "1800-1999"
                  - "2000-2199"
                  - "2200-2499"
                  - "2500+"
      - name: games
        data_tests: [not_null]
      - name: wins
        data_tests: [not_null]

  - name: civ_meta_by_map
    description: Per (civ, ladder, map) games/winrate — feeds civ-meta.json's `byMap`.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: ladder
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["1v1", "team"]
      - name: map_slug
        data_tests: [not_null]
      - name: games
        data_tests: [not_null]

  - name: civ_meta_by_patch
    description: Per (civ, ladder, build) games/winrate — feeds civ-meta.json's `byPatch`.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: build
        data_tests: [not_null]
      - name: games
        data_tests: [not_null]

  - name: civ_meta_openings
    description: >
      Per (civ, ladder, opening) games + rank — feeds civ-meta.json's `openings`. `opening` is the
      closed `opening_kind` enum (final-review finding #1 — see `pipeline_core::opening`'s module
      doc), not the free-text `match_players.opening` column.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: opening
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "scouts"
                  - "archers"
                  - "skirms"
                  - "eagles"
                  - "man_at_arms"
                  - "spears"
                  - "fast_castle"
                  - "drush"
                  - "trash"
                  - "fires"
                  - "galleys"
                  - "towers"
      - name: opening_rank
        data_tests: [not_null]

  - name: civ_meta_ageup
    description: Per (civ, ladder) median seconds-to-age-up — feeds civ-meta.json's `ageUp`.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: ladder
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["1v1", "team"]

  - name: patch_axis
    description: Global, 1v1-ladder-only match counts by build — feeds civ-meta.json's `patches`.
    columns:
      - name: build
        data_tests: [not_null, unique]
      - name: matches
        data_tests: [not_null]

  - name: matchups_1v1
    description: >
      Civ-vs-civ 1v1 overall win rates (mirror matchups excluded) — feeds civ-matchups.json's
      `civs.<slug> = [{opp,games,winRate}]`.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: opp_slug
        data_tests: [not_null]
      - name: games
        data_tests: [not_null]

  - name: matchups_1v1_by_map
    description: Civ-vs-civ 1v1 win rates per map — feeds civ-matchups-by-map.json.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: opp_slug
        data_tests: [not_null]
      - name: map_slug
        data_tests: [not_null]
      - name: games
        data_tests: [not_null]

  - name: matchups_1v1_by_elo
    description: >
      Civ-vs-civ 1v1 win rates per elo bucket, plus an `'all'` rollup row — feeds
      civ-matchups-by-elo.json.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: opp_slug
        data_tests: [not_null]
      - name: elo_bucket
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "all"
                  - "<1000"
                  - "1000-1199"
                  - "1200-1399"
                  - "1400-1649"
                  - "1650-1799"
                  - "1800-1999"
                  - "2000-2199"
                  - "2200-2499"
                  - "2500+"
      - name: games
        data_tests: [not_null]

  - name: matchups_team
    description: >
      Cross-team civ-vs-civ win rates (team ladder, confounded by the other players per side) —
      feeds civ-matchups-team.json.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: opp_slug
        data_tests: [not_null]
      - name: games
        data_tests: [not_null]

  - name: benchmark_ageup
    description: >
      Analyzer benchmark: median age-up completion seconds by civ x map x elo_bucket x mode, with
      `'all'`-keyed rollups (civ is never rolled up) — feeds
      reference-data/benchmark.json's base cells.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: map_slug
        data_tests: [not_null]
      - name: elo_bucket
        data_tests: [not_null]
      - name: mode
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["1v1", "team", "all"]
      - name: n
        data_tests: [not_null]

  - name: benchmark_vils
    description: >
      Analyzer benchmark overlay: median villagers trained through Castle Age among WINNERS, by
      civ x map x elo_bucket x mode — feeds benchmark.json cells' optional `vils_castle`.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: map_slug
        data_tests: [not_null]
      - name: elo_bucket
        data_tests: [not_null]
      - name: mode
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["1v1", "team", "all"]
      - name: n
        data_tests: [not_null]

  - name: civ_cube
    description: >
      Joint civ stats cube (civ x elo_bucket x map x build), unthresholded on the patch axis
      (that filter lives in `pipeline/crates/export/src/civ_cube.rs`, reusing `civ_meta.rs`'s own
      kept-patches computation) but gated at >= 20 games per cell — feeds civ-cube.json's
      dict-indexed `rows` plus civ-cube-dims.json. See the model's own SQL doc for the full
      DuckDB-generator replacement.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: elo_bucket
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "<1000"
                  - "1000-1199"
                  - "1200-1399"
                  - "1400-1649"
                  - "1650-1799"
                  - "1800-1999"
                  - "2000-2199"
                  - "2200-2499"
                  - "2500+"
      - name: map_slug
        data_tests: [not_null]
      - name: build
        data_tests: [not_null]
      - name: games
        data_tests: [not_null]
      - name: wins
        data_tests: [not_null]

  - name: winner_comps
    description: >
      Winner unit-composition benchmark (REPLAY-SOURCE ONLY, whole-match totals — see the model's
      own SQL doc for the scope deviation from the old DuckDB generator): per (civ, elo_bucket),
      the top-6-by-producer-share military units WINNERS of ranked 1v1 RM trained, restricted to
      cells with >=100 winners and units produced by >=15% of them — feeds winner-comps.json.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: elo_bucket
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "<1000"
                  - "1000-1199"
                  - "1200-1399"
                  - "1400-1649"
                  - "1650-1799"
                  - "1800-1999"
                  - "2000-2199"
                  - "2200-2499"
                  - "2500+"
      - name: unit
        data_tests: [not_null]
      - name: winners_n
        data_tests: [not_null]
      - name: producers
        data_tests: [not_null]
      - name: producer_pct
        data_tests: [not_null]
      - name: unit_rank
        data_tests: [not_null]

  - name: winner_refs_openings
    description: >
      Per (civ, elo_bucket, opening) winners' opening share + rank, closed `opening_kind`
      vocabulary, FULL corpus (both aoestats and replay sources) -- feeds winner-refs.json's
      `openings`. Restricted to cells with >=100 winners and an opening's own share >=8% of them;
      see the model's own SQL doc for the scope deviation from the old DuckDB generator (no
      `"unknown"` bucket).
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: elo_bucket
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "<1000"
                  - "1000-1199"
                  - "1200-1399"
                  - "1400-1649"
                  - "1650-1799"
                  - "1800-1999"
                  - "2000-2199"
                  - "2200-2499"
                  - "2500+"
      - name: opening
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "scouts"
                  - "archers"
                  - "skirms"
                  - "eagles"
                  - "man_at_arms"
                  - "spears"
                  - "fast_castle"
                  - "drush"
                  - "trash"
                  - "fires"
                  - "galleys"
                  - "towers"
      - name: winners_n
        data_tests: [not_null]
      - name: share_pct
        data_tests: [not_null]
      - name: opening_rank
        data_tests: [not_null]

  - name: winner_refs_ecotech
    description: >
      Per elo_bucket (no civ/map split): winners who reached Castle Age, plus the share of them
      who researched each of the five watched eco upgrades BEFORE completing Castle Age.
      REPLAY-SOURCE ONLY (`match_player_techs`), with `m.source = 'replay'` also scoping the
      denominator -- see the model's own SQL doc for why that scoping is deliberate, not a copy of
      `winner_comps.sql`'s posture. Feeds winner-refs.json's `ecoTechByCastle`.
    columns:
      - name: elo_bucket
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "<1000"
                  - "1000-1199"
                  - "1200-1399"
                  - "1400-1649"
                  - "1650-1799"
                  - "1800-1999"
                  - "2000-2199"
                  - "2200-2499"
                  - "2500+"
      - name: winners_n
        data_tests: [not_null]
      - name: wheelbarrow_pct
        data_tests: [not_null]
      - name: loom_pct
        data_tests: [not_null]
      - name: dba_pct
        data_tests: [not_null]
      - name: horse_collar_pct
        data_tests: [not_null]
      - name: gold_mining_pct
        data_tests: [not_null]

  - name: winner_refs_meds
    description: >
      Winners' first-military-training + eco-tech-research CLICK-time medians (milliseconds), per
      elo_bucket and per elo_bucket x map (`map_slug = 'all'` on the all-maps rollup grain).
      REPLAY-SOURCE ONLY (`replay_events`) -- the INNER JOIN to that table alone restricts the
      corpus, no separate `source` filter needed (see the model's own SQL doc). Feeds
      winner-refs.json's `medsByBucket`/`medsByMap`.
    columns:
      - name: map_slug
        data_tests: [not_null]
      - name: elo_bucket
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "<1000"
                  - "1000-1199"
                  - "1200-1399"
                  - "1400-1649"
                  - "1650-1799"
                  - "1800-1999"
                  - "2000-2199"
                  - "2200-2499"
                  - "2500+"
      - name: winners_n
        data_tests: [not_null]
