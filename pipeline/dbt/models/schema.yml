version: 2

models:
  - name: civ_meta
    description: >
      Per (civ, ladder) overall win/game counts plus a per-elo-bucket breakdown, one flat grain.
      `elo_bucket = 'all'` is the overall rollup row; the nine real buckets fill `byElo`. See the
      model's own SQL doc for the full aggregation.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: ladder
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["1v1", "team"]
      - name: elo_bucket
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "all"
                  - "<1000"
                  - "1000-1199"
                  - "1200-1399"
                  - "1400-1649"
                  - "1650-1799"
                  - "1800-1999"
                  - "2000-2199"
                  - "2200-2499"
                  - "2500+"
      - name: games
        data_tests: [not_null]
      - name: wins
        data_tests: [not_null]

  - name: civ_meta_by_map
    description: Per (civ, ladder, map) games/winrate — feeds civ-meta.json's `byMap`.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: ladder
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["1v1", "team"]
      - name: map_slug
        data_tests: [not_null]
      - name: games
        data_tests: [not_null]

  - name: civ_meta_by_patch
    description: Per (civ, ladder, build) games/winrate — feeds civ-meta.json's `byPatch`.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: build
        data_tests: [not_null]
      - name: games
        data_tests: [not_null]

  - name: civ_meta_openings
    description: >
      Per (civ, ladder, opening) games + rank — feeds civ-meta.json's `openings`. `opening` is the
      closed `opening_kind` enum (final-review finding #1 — see `pipeline_core::opening`'s module
      doc), not the free-text `match_players.opening` column.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: opening
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "scouts"
                  - "archers"
                  - "skirms"
                  - "eagles"
                  - "man_at_arms"
                  - "spears"
                  - "fast_castle"
                  - "drush"
                  - "trash"
                  - "fires"
                  - "galleys"
                  - "towers"
      - name: opening_rank
        data_tests: [not_null]

  - name: civ_meta_ageup
    description: Per (civ, ladder) median seconds-to-age-up — feeds civ-meta.json's `ageUp`.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: ladder
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["1v1", "team"]

  - name: patch_axis
    description: Global, 1v1-ladder-only match counts by build — feeds civ-meta.json's `patches`.
    columns:
      - name: build
        data_tests: [not_null, unique]
      - name: matches
        data_tests: [not_null]

  - name: matchups_1v1
    description: >
      Civ-vs-civ 1v1 overall win rates (mirror matchups excluded) — feeds civ-matchups.json's
      `civs.<slug> = [{opp,games,winRate}]`.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: opp_slug
        data_tests: [not_null]
      - name: games
        data_tests: [not_null]

  - name: matchups_1v1_by_map
    description: Civ-vs-civ 1v1 win rates per map — feeds civ-matchups-by-map.json.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: opp_slug
        data_tests: [not_null]
      - name: map_slug
        data_tests: [not_null]
      - name: games
        data_tests: [not_null]

  - name: matchups_1v1_by_elo
    description: >
      Civ-vs-civ 1v1 win rates per elo bucket, plus an `'all'` rollup row — feeds
      civ-matchups-by-elo.json.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: opp_slug
        data_tests: [not_null]
      - name: elo_bucket
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "all"
                  - "<1000"
                  - "1000-1199"
                  - "1200-1399"
                  - "1400-1649"
                  - "1650-1799"
                  - "1800-1999"
                  - "2000-2199"
                  - "2200-2499"
                  - "2500+"
      - name: games
        data_tests: [not_null]

  - name: matchups_team
    description: >
      Cross-team civ-vs-civ win rates (team ladder, confounded by the other players per side) —
      feeds civ-matchups-team.json.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: opp_slug
        data_tests: [not_null]
      - name: games
        data_tests: [not_null]

  - name: benchmark_ageup
    description: >
      Analyzer benchmark: median age-up completion seconds by civ x map x elo_bucket x mode, with
      `'all'`-keyed rollups (civ is never rolled up) — feeds
      reference-data/benchmark.json's base cells.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: map_slug
        data_tests: [not_null]
      - name: elo_bucket
        data_tests: [not_null]
      - name: mode
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["1v1", "team", "all"]
      - name: n
        data_tests: [not_null]

  - name: benchmark_vils
    description: >
      Analyzer benchmark overlay: median villagers trained through Castle Age among WINNERS, by
      civ x map x elo_bucket x mode — feeds benchmark.json cells' optional `vils_castle`.
    columns:
      - name: civ_slug
        data_tests: [not_null]
      - name: map_slug
        data_tests: [not_null]
      - name: elo_bucket
        data_tests: [not_null]
      - name: mode
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["1v1", "team", "all"]
      - name: n
        data_tests: [not_null]
