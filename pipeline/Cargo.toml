[workspace]
resolver = "2"
members = ["crates/core", "crates/ingest", "crates/migration", "crates/replay"]
# vendor/aoe2rec sits inside this workspace's directory tree but is third-party, committed
# as-is (never edited) — exclude it so it builds as an ordinary path dependency (no clippy
# lints, no `cargo test`/`clippy --workspace` reaching into it) rather than being implicitly
# absorbed into the workspace by path proximity (analyzer/Cargo.toml hit this same Cargo
# behavior first — see its comment).
exclude = ["vendor/aoe2rec"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Hoisted here so every current AND upcoming crate (replay/fetch/export) pins the same version +
# feature set once, instead of re-declaring it per-crate. A member opts in with
# `dep.workspace = true` (adding crate-specific extra features alongside it where needed).
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# thiserror MUST stay on the 2.x line: sea-orm/sqlx/testcontainers already pull 2.0.18, and a
# crate declaring "1" here would reintroduce the duplicate-major dependency this workspace dep
# was added to dedupe (see the 5b review).
thiserror = "2"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
chrono = { version = "0.4", features = ["serde"] }
# `replay` decodes `.aoe2record` bytes via vendored aoe2rec, which itself takes `bytes::Bytes`
# (not `&[u8]`) as its `Savegame::from_bytes` input — pinned here since `fetch`'s reqwest
# download will also hand back `bytes::Bytes` and should reuse the same version.
bytes = { version = "1", features = ["std"] }

[workspace.dependencies.sea-orm-migration]
version = "1.1.20"
features = ["runtime-tokio-rustls", "sqlx-postgres"]

[workspace.dependencies.proptest]
version = "1"

[workspace.dependencies.testcontainers-modules]
version = "0.15"
features = ["postgres"]
