slug: pocket
term:
  en: Pocket
  tr: Pocket
letter: P
definition:
  en: >-
    In team games, a player in the center positions who is shielded from the enemy by the flank players. The pocket
    usually plays cavalry and runs a greedy, fast economy to support and supply allies.


    **Related terms:** Flank, Boom.
  tr: >-
    Takım oyunlarında, merkez konumlarda bulunan ve flank oyuncuları tarafından düşmana karşı korunan oyuncudur. Pocket
    genellikle süvari oynar ve müttefiklerini desteklemek için açgözlü, hızlı bir ekonomi yürütür.


    **İlgili terimler:** Flank, Boom.
