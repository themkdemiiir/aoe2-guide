slug: uptime
term:
  en: Uptime
  tr: Uptime
letter: U
definition:
  en: >-
    The in-game time at which you reach the next Age (e.g. a 25:00 Castle Age uptime). Faster uptimes mean you field new
    units and upgrades earlier than your opponent, so shaving seconds off your build order is one of the highest-value
    skills to practice.


    **Related terms:** Build order, Fast Castle, Idle Time.
  tr: >-
    Bir sonraki Çağ'a ulaştığın oyun içi süre (örneğin 25:00'lik bir Castle Age uptime'ı). Daha hızlı uptime'lar, yeni
    birimleri ve geliştirmeleri rakibinden daha erken sahaya sürmen anlamına gelir; bu yüzden build order'ından saniye
    kısaltmak çalışılacak en değerli becerilerden biridir.


    **İlgili terimler:** Build order, Fast Castle, Idle Time.
