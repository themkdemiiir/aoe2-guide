slug: flank
term:
  en: Flank
  tr: Flank
letter: F
definition:
  en: >-
    In team games, a player on the edge of the map directly next to an enemy. The flank usually plays archers or a
    defensive style and is responsible for holding the front line so the pockets can develop.


    **Related terms:** Pocket.
  tr: >-
    Takım oyunlarında, haritanın kenarında doğrudan bir düşmanın yanında bulunan oyuncudur. Flank genellikle okçu ya da
    savunmacı bir tarz oynar ve pocket'ların gelişebilmesi için ön cepheyi tutmaktan sorumludur.


    **İlgili terimler:** Pocket.
