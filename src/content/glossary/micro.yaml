slug: micro
term:
  en: Micro
  tr: Micro
letter: M
definition:
  en: >-
    Short for micromanagement: controlling individual units during a fight to get more value out of them — dodging
    projectiles, sniping key targets, and hit-and-run with ranged units. Good micro lets a smaller army beat a larger
    one.


    **Related terms:** Macro, Hit-and-run, Counter.
  tr: >-
    Micromanagement'ın kısaltması: bir savaş sırasında birimlerden daha fazla değer almak için onları tek tek kontrol
    etmek — mermilerden kaçınmak, kritik hedefleri ayıklamak (sniping) ve menzilli birimlerle vur-kaç yapmak. İyi micro,
    daha küçük bir ordunun daha büyük bir orduyu yenmesini sağlar.


    **İlgili terimler:** Macro, Vur-kaç, Counter.
