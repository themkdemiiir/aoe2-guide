slug: wheelbarrow
term:
  en: Wheelbarrow
  tr: Wheelbarrow
letter: W
definition:
  en: >-
    A Town Center technology that raises villager carry capacity and move speed, giving a big boost to food and overall
    resource income. It is generally worth researching around 14–16 farms, once the eco is large enough to pay it back.


    **Related terms:** Boom, Feudal Age.
  tr: >-
    Köylülerin taşıma kapasitesini ve hareket hızını artıran bir Şehir Merkezi (Town Center) teknolojisidir; yiyecek ve
    genel kaynak gelirine büyük bir katkı sağlar. Ekonomi bunu geri ödeyecek kadar büyüdüğünde, genellikle 14–16 tarla
    civarında araştırmaya değer.


    **İlgili terimler:** Boom, Feudal Age.
