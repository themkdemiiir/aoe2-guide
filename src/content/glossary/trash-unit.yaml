slug: trash-unit
term:
  en: Trash Unit
  tr: Trash Unit
letter: T
definition:
  en: >-
    A unit that costs no gold — Skirmisher, Spearman/Pikeman, and Light Cavalry/Hussar. Because they only need food and
    wood, trash units stay sustainable in the late game when both players' gold runs out, and "trash wars" often decide
    long Imperial Age matches.


    **Related terms:** Counter, Macro.
  tr: >-
    Hiç altın harcamayan bir birim — Skirmisher, Mızrakçı/Pikeman ve Hafif Süvari/Hussar. Yalnızca yiyecek ve oduna
    ihtiyaç duydukları için trash birimler, iki oyuncunun da altını tükendiğinde oyunun son aşamasında sürdürülebilir
    kalır; uzun Imperial Age maçları çoğu zaman bu "trash savaşlarıyla" belirlenir.


    **İlgili terimler:** Counter, Macro.
