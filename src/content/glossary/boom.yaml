slug: boom
term:
  en: Boom
  tr: Boom
letter: B
definition:
  en: >-
    A play style focused on economy: skip early aggression to build extra Town Centers and out-produce your opponent.


    A typical Castle Age "boom" adds 2–3 Town Centers immediately on hitting Castle Age, producing villagers from all of
    them simultaneously. By 20 minutes, a boomed player has 50–70 villagers compared to ~30 for someone who fought in
    Feudal Age — an enormous economic lead that translates into a much larger army in Imperial.


    **Related terms:** Fast Castle, FC, BO Boom, 23-pop FC.
  tr: >-
    Ekonomi odaklı oynanış: erken saldırıyı atlayarak ekstra Town Center kurmak ve rakibinizden daha fazla köylü
    üreterek üretimde öne geçmek.


    Tipik bir Castle Age "boom"u, Castle Age'e geçer geçmez hemen 2-3 Town Center ekler ve hepsinden aynı anda köylü
    basar. 20. dakikada boom yapan bir oyuncunun Feudal Age'de savaşan birine (~30 köylü) kıyasla 50-70 köylüsü olur; bu
    devasa ekonomik üstünlük Imperial'da çok daha büyük bir orduya dönüşür.


    **İlgili terimler:** Fast Castle, FC, BO Boom, 23-pop FC.
