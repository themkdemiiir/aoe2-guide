slug: fast-imperial
term:
  en: Fast Imperial (FI)
  tr: Fast Imperial (FI)
letter: F
definition:
  en: >-
    Rushing to the Imperial Age as quickly as possible, often with a strong-economy civilization. The goal is to unlock
    powerful upgrades and units before the opponent can react and answer them.


    **Related terms:** Fast Castle, Boom.
  tr: >-
    İmparatorluk Çağı'na mümkün olduğunca hızlı çıkmaktır; genellikle ekonomisi güçlü bir uygarlıkla yapılır. Amaç,
    rakip tepki verip karşılık veremeden güçlü geliştirmelerin ve birimlerin kilidini açmaktır.


    **İlgili terimler:** Fast Castle, Boom.
