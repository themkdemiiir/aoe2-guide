slug: tower-rush
term:
  en: Tower Rush (Trush)
  tr: Tower Rush (Trush)
letter: T
definition:
  en: >-
    Building offensive Watch Towers in or near the enemy base during the Feudal Age to damage their economy and force a
    defensive response. The towers deny key resource piles and pin villagers down while you snowball the lead elsewhere.


    **Related terms:** Feudal Age, Drush, Laming.
  tr: >-
    Feodal Çağ'da düşman üssünün içinde ya da yakınında saldırı amaçlı Gözcü Kuleleri (Watch Tower) dikerek ekonomisine
    zarar verme ve onu savunmaya zorlama taktiğidir. Kuleler önemli kaynak yığınlarını kapatır ve köylüleri
    sıkıştırırken sen avantajı başka yerde büyütürsün.


    **İlgili terimler:** Feudal Age, Drush, Laming.
