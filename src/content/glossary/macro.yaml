slug: macro
term:
  en: Macro
  tr: Macro
letter: M
definition:
  en: >-
    Short for macromanagement: keeping your production and economy running smoothly in the background — queuing
    villagers, building farms, researching upgrades, and pumping out units without idle time. Strong macro is what wins
    most games below the top level.


    **Related terms:** Micro, Idle Time, Boom.
  tr: >-
    Macromanagement'ın kısaltması: üretimini ve ekonomini arka planda sorunsuz şekilde döndürmek — köylü sıraya almak,
    tarla kurmak, geliştirmeleri araştırmak ve boş süre bırakmadan birim basmak. Üst seviyenin altındaki çoğu oyunu
    kazandıran şey güçlü bir macro'dur.


    **İlgili terimler:** Micro, Idle Time, Boom.
