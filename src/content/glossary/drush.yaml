slug: drush
term:
  en: Drush
  tr: Drush
letter: D
definition:
  en: >-
    Short for "Dark Age Rush" — sending 3 Militia from a Barracks built in the Dark Age to the enemy base, before either
    player reaches Feudal Age. The militia arrive around the 5:30–6:00 mark and harass enemy villagers while you
    continue your build order.


    Drush is rarely a kill blow on its own; the purpose is to **slow the opponent's economy** by 30–90 seconds, forcing
    them to pull villagers off resources to defend. The economic lead the drush creates is then snowballed via a Feudal
    Age push or a Fast Castle.


    **Common follow-ups:** Drush → Fast Castle (advanced), Drush → Archers, Drush → Scouts.
  tr: >-
    "Dark Age Rush" ifadesinin kısaltması: iki oyuncu da Feudal Age'e ulaşmadan önce, Dark Age'de kurulan bir
    Barracks'tan 3 Militia'yı düşman üssüne göndermek. Militia'lar yaklaşık 5:30-6:00 civarında varır ve siz build
    order'ınıza devam ederken düşman köylülerini taciz eder.


    Drush tek başına nadiren öldürücü bir darbedir; amaç **rakibin ekonomisini** 30-90 saniye **yavaşlatmak**, onu
    savunma için köylüleri kaynaklardan çekmeye zorlamaktır. Drush'ın yarattığı ekonomik üstünlük ardından bir Feudal
    Age baskısı veya Fast Castle ile büyütülür.


    **Yaygın devam hamleleri:** Drush → Fast Castle (ileri seviye), Drush → Archers, Drush → Scouts.
