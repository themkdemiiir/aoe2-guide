slug: laming
term:
  en: Laming
  tr: Laming
letter: L
definition:
  en: >-
    Stealing the opponent's sheep or boars in the Dark Age, typically using your scout. The action causes a severe food
    deficit for the victim — sheep and boars are the highest-yield food sources of the Dark Age, and losing 1–2 of them
    sets the opponent back ~40–60 seconds in Feudal Age timing.


    Laming is legal but considered aggressive and is a regular high-level open-map (Arabia) tactic. The defense is to
    scout your own resources early and bring sheep close to your Town Center under guard.


    **Related:** Boar steal, sheep steal, hunt push.
  tr: >-
    Genellikle scout'unuzu kullanarak, Dark Age'de rakibin koyunlarını veya boar'larını çalmak. Bu hamle kurban için
    ağır bir yiyecek açığı yaratır; koyun ve boar Dark Age'in en verimli yiyecek kaynaklarıdır ve 1-2 tanesini kaybetmek
    rakibin Feudal Age zamanlamasını ~40-60 saniye geriye atar.


    Laming kurallara aykırı değildir ama agresif sayılır ve üst seviye açık harita (Arabia) oyunlarında düzenli bir
    taktiktir. Savunması, kendi kaynaklarınızı erkenden keşfetmek ve koyunları koruma altında Town Center'ınıza
    yaklaştırmaktır.


    **İlgili:** Boar steal, sheep steal, hunt push.
