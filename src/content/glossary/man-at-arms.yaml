slug: man-at-arms
term:
  en: Man-at-Arms (MAA)
  tr: Man-at-Arms (MAA)
letter: M
definition:
  en: >-
    The Feudal Age upgrade of the Militia and a cost-effective early infantry unit. It is especially strong paired with
    a forward tower, or as an opening that transitions smoothly into archers.


    **Related terms:** Feudal Age, Drush.
  tr: >-
    Militia biriminin Feudal Çağı geliştirmesidir ve erken oyunda maliyetine göre verimli bir piyade birimidir.
    Özellikle ileri bir kuleyle birlikte güçlüdür ya da okçulara akıcı bir şekilde geçiş yapan bir açılış olarak
    kullanılır.


    **İlgili terimler:** Feudal Age, Drush.
