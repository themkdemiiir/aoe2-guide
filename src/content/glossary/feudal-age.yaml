slug: feudal-age
term:
  en: Feudal Age
  tr: Feudal Age
letter: F
definition:
  en: >-
    The second of four ages. Reached by researching the age-up from the Town Center, requiring 500 food, a Mill, and a
    Barracks (or two age-up buildings on most civilizations).


    Unlocks the Archery Range, Stable, Blacksmith, walls (palisade and stone), Watch Tower, Market, and many critical
    military units: Scout Cavalry, Archers, Skirmishers, Spearmen, and the Man-at-Arms upgrade. The Feudal Age is when
    most early aggression happens — the gap between when one player reaches Feudal and when the other does is the most
    predictive timing in the game.


    **Typical Feudal Age click time:** 8:30–10:30 depending on build order.
  tr: >-
    Dört çağdan ikincisi. Town Center'dan çağ atlama araştırmasıyla ulaşılır; 500 yiyecek, bir Mill ve bir Barracks
    (çoğu uygarlıkta iki çağ atlama binası) gerektirir.


    Archery Range, Stable, Blacksmith, duvarları (palisade ve taş), Watch Tower, Market ve birçok kritik askeri birimi
    açar: Scout Cavalry, Archers, Skirmishers, Spearmen ve Man-at-Arms yükseltmesi. Feudal Age, erken saldırıların
    çoğunun yaşandığı çağdır; bir oyuncunun Feudal'a ulaşmasıyla diğerinin ulaşması arasındaki fark, oyundaki en
    belirleyici zamanlamadır.


    **Tipik Feudal Age tıklama zamanı:** build order'a göre 8:30-10:30.
