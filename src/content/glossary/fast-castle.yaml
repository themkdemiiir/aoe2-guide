slug: fast-castle
term:
  en: Fast Castle (FC)
  tr: Fast Castle (FC)
letter: F
definition:
  en: >-
    Skipping Feudal Age aggression to reach the Castle Age as fast as possible — typically around 23 villagers. The
    freed-up time and resources usually flow into a boom, Knights, or a civilization's unique unit.


    **Related terms:** Boom, FC.
  tr: >-
    Feudal Çağı'ndaki saldırganlığı atlayıp Kale Çağı'na olabildiğince hızlı çıkmaktır — genellikle 23 köylü civarında.
    Kazanılan zaman ve kaynaklar çoğunlukla bir boom'a, Şövalyelere ya da uygarlığın benzersiz birimine yönlendirilir.


    **İlgili terimler:** Boom, FC.
