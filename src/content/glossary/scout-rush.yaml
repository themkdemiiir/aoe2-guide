slug: scout-rush
term:
  en: Scout Rush
  tr: Scout Rush
letter: S
definition:
  en: >-
    An 18-pop Feudal Age opening that masses Scout Cavalry to raid enemy villagers — the default open-map aggression.
    Scouts are fast and tanky against archers, so they harass eco and force the opponent onto the back foot while you
    transition.


    **Related terms:** Feudal Age, Drush, Boom.
  tr: >-
    Düşman köylülerine akın yapmak için Scout Cavalry (Süvari Gözcü) yığan 18 nüfuslu bir Feodal Çağ açılışıdır; açık
    haritalarda varsayılan saldırı planıdır. Gözcüler hızlıdır ve okçulara karşı dayanıklı olduğundan ekonomiyi taciz
    eder ve sen geçiş yaparken rakibi geri çekilmeye zorlar.


    **İlgili terimler:** Feudal Age, Drush, Boom.
