slug: double-bit-axe
term:
  en: Double-Bit Axe
  tr: Double-Bit Axe
letter: D
definition:
  en: >-
    The first Lumber Camp wood upgrade. It is cheap and delivers a large increase to your wood-gathering rate, so you
    should never skip it.


    **Related terms:** Wheelbarrow, Boom.
  tr: >-
    Kereste Kampı'nın (Lumber Camp) ilk odun geliştirmesidir. Ucuzdur ve odun toplama hızına büyük bir artış sağlar, bu
    yüzden asla atlanmamalıdır.


    **İlgili terimler:** Wheelbarrow, Boom.
