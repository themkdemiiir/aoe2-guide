slug: galley-rush
term:
  en: Galley Rush (Grush)
  tr: Galley Rush (Grush)
letter: G
definition:
  en: >-
    Massing War Galleys early on water maps to seize control of the water, kill enemy Fishing Ships, and deny the enemy
    Dock. Winning the water fight chokes the opponent's economy and often decides the whole game on hybrid and water
    maps.


    **Related terms:** Feudal Age, Boom.
  tr: >-
    Su haritalarında erkenden War Galley yığarak suyun kontrolünü ele geçirme, düşmanın Balıkçı Gemilerini (Fishing
    Ship) yok etme ve düşman Liman'ını (Dock) kapatma taktiğidir. Su savaşını kazanmak rakibin ekonomisini boğar ve
    hibrit ile su haritalarında çoğu zaman tüm oyunu belirler.


    **İlgili terimler:** Feudal Age, Boom.
