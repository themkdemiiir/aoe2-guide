slug: idle-time
term:
  en: Idle Time
  tr: Idle Time
letter: I
definition:
  en: >-
    Time a Town Center or production building spends not producing anything. Idle TC time — gaps where no villager is
    queued — is one of the biggest beginner mistakes, since every idle second is a villager you never get.


    **Related terms:** Uptime, Macro, Boom.
  tr: >-
    Bir Şehir Merkezi'nin (Town Center) ya da üretim binasının hiçbir şey üretmeden geçirdiği boş süre. Hiç köylü sıraya
    alınmadan geçen anlar, yani idle TC süresi, yeni başlayanların en büyük hatalarından biridir; çünkü her boş saniye,
    hiç sahip olamadığın bir köylü demektir.


    **İlgili terimler:** Uptime, Macro, Boom.
