slug: trebuchet
name:
  en: Trebuchet
  tr: Trebuchet
role:
  en: siege long-range
  tr: uzun menzilli kuşatma
line: trebuchet-line
lineRank: 1
description:
  en: >-
    Powerful anti-building Siege Weapon with exceptional range. Must be packed to move, unpacked to attack. Cannot
    attack enemies at close range. Strong vs. buildings. Can attack ground and destroy trees.
  tr: >-
    Son derece uzun menzilli, bina karşıtı Kuşatma Silahı. Hareket etmesi için toplanmalı, saldırması için kurulmalıdır.
    Yakındaki birimlere ateş edemez. Binalara karşı güçlü. Alana saldırabilir ve ağaçları yok edebilir.
upgrades:
  en: attack, range (University); creation speed (Castle); more resistant to Monks (Monastery).
  tr: saldırı, menzil (Üniversite); oluşturma hızı (Kale); Keşişlere karşı daha fazla direnç (Manastır).
