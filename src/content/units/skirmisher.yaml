    Yakın mesafeden saldıramayan, okçu karşıtı Akıncı. Menzilli Askerlere ve Mızraklı Asker türlerine karşı güçlüdür.
    Yakın mesafedeki birimlere karşı zayıftır.
upgrades:
  en: >-
    attack, range, armor (Blacksmith); attack, accuracy (University); accuracy, to Elite Skirmisher (Archery Range);
    creation speed (Castle); more resistant to Monks (Monastery).
  tr: >-
    saldırı, menzil, zırh (Demirci); saldırı, isabet (Üniversite); isabet, Elit Akıncıya yükseltme (Okçuluk Binası);
    oluşturma hızı (Kale); Keşişlere karşı daha fazla direnç (Manastır).
