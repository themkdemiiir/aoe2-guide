    speed, HP (Stable); attack, range, armor (Blacksmith); attack, accuracy (University); accuracy, armor, to Heavy
    Cavalry Archer (Archery Range); creation speed (Castle); more resistant to Monks (Monastery).
  tr: >-
    hız, DP (Ahır); saldırı, menzil, zırh (Demirci); saldırı, isabet (Üniversite); isabet, zırh, Ağır Atlı Okçuya
    yükseltme (Okçuluk Binası); oluşturma hızı (Kale); Keşişlere daha fazla direnç (Manastır).
