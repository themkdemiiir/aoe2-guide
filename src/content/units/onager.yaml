description:
  en: >-
    Siege Weapon with ranged blast attack, but cannot attack at close range. Strong vs. tight groups of units. Weak vs.
    units at close range. Can attack ground and destroy trees.
  tr: >-
    Menzilli patlama saldırısı yapabilen Kuşatma Silahı. Yakın menzilde saldıramaz. Yoğun birim gruplarına karşı
    güçlüdür. Yakın menzildeki birimlere karşı zayıftır. Karaya saldırabilir ve ağaçları yok edebilir.
upgrades:
  en: attack, range (University); to Siege Onager (Siege Workshop); more resistant to Monks (Monastery).
  tr: >-
    saldırı, menzil (Üniversite); Kuşatma Mancınığına yükseltme (Kuşatma Atölyesi); Keşişlere karşı daha fazla direnç
    (Manastır).
