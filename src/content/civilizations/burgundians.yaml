strategy:
  en: >-
    Burgundians are a Cavalry civilization from Western Europe.


    ## How to Play Burgundians


    **Ideal opening (Dark → Castle):** Burgundians have no real Feudal aggression, so play a quiet, defensive Feudal Age
    — wall up, take the cheap Bow Saw and Heavy Plow economy upgrades, and grow your economy rather than commit to a
    rush. Push to Castle Age and transition into Light Cavalry or Cavaliers, while using Monks to fight for Relics (your
    Knights can carry them).


    **Ideal late-game composition:** Lean into the civilization's double-gold economy from Burgundian Vineyards and
    field Coustillier backed by Hand Cannoneers, then close games out with Flemish Revolution and Bombard Cannons once
    your gold supply allows it.


    **Deathball composition (closed maps / team games):** Mass Coustillier and Hand Cannoneers with Bombard Cannon
    support — a gold-heavy ball that grinds through fortified positions on closed maps and in team games.


    **Recommended build:** [Fast Castle 2-Stable Knights (Pocket)](/en/builds/fc-knights-pocket)
  tr: >-
    Burgundians, Batı Avrupa'dan bir Süvari uygarlığıdır.


    ## Burgundians Nasıl Oynanır


    **İdeal açılış (Karanlık Çağ → Kale Çağı):** Burgundians'ın Feodal Çağ'da gerçek bir saldırı gücü yoktur; bu yüzden
    sessiz ve savunmacı bir Feodal Çağ oyna — duvarlarını kur, ucuz Bow Saw ve Heavy Plow ekonomi yükseltmelerini
    araştır ve rush'a girişmek yerine ekonomini büyüt. Kale Çağı'na geç ve Light Cavalry ya da Cavalier'lara yönel;
    Relic'ler için Monk'larını kullan (Knight'ların onları taşıyabilir).


    **İdeal geç oyun kompozisyonu:** Burgundian Vineyards'ın çift Altın ekonomisinden yararlan ve Coustillier'ları Hand
    Cannoneers desteğiyle sahaya çıkar; ardından Altın arzın yettiğinde Flemish Revolution ve Bombard Cannon'larla oyunu
    bitir.


    **Deathball kompozisyonu (kapalı haritalar / takım oyunları):** Bombard Cannon desteğiyle Coustillier ve Hand
    Cannoneers yığını — kapalı haritalarda ve takım oyunlarında tahkimatlı mevzileri yavaş yavaş ezip geçen, Altın
    ağırlıklı bir top.


    **Önerilen build order:** [Fast Castle 2-Stable Knights (Pocket)](/en/builds/fc-knights-pocket)
