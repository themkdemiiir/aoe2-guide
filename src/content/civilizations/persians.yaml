strategy:
  en: >-
    Persians are a Cavalry civilization from the Middle East.


    ## How to Play Persians


    **Ideal opening (Dark → Castle):** Lean on the bonus economy and open with a Scout Rush, then transition into
    Knights, camels, or light cavalry as the matchup demands. The faster Town Centers let you boom hard on the way to
    Savar in the late game — skip Cavalry Archers, as they don't pay off for this civ.


    **Ideal late-game composition:** Pair Paladins with Trash-Bows for a Halberdier, Trash-Bow, and Skirmisher core,
    adding Hussar when you need to clear out enemy Monks. Round it out with Bombard Cannons or Trebuchets for siege.


    **Deathball composition (closed maps / team games):** Mass War Elephants behind a wall of Trash-Bows and Hussar,
    supported by Cedrum siege or Bombard Cannons to crack fortified positions.


    **Recommended build:** [Scout Rush](/en/builds/18pop-scouts/)
  tr: >-
    Persians, Orta Doğu'dan gelen bir Süvari uygarlığıdır.


    ## Persians Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Bonus ekonomiye yaslan ve Scout Rush ile aç; ardından maça göre Knight, Camel
    Rider ya da hafif süvariye geç. Hızlı Town Center'lar, geç oyunda Savar'a giden yolda güçlü bir boom yapmanı sağlar
    — Cavalry Archer'lara para harcama, bu uygarlık için verimli değil.


    **İdeal geç oyun kompozisyonu:** Paladin'leri Trash okçularıyla eşleştirerek Halberdier, Trash okçusu ve Skirmisher
    çekirdeği kur; düşman Monk'larını temizlemen gerektiğinde Hussar ekle. Kuşatma için Bombard Cannon veya Trebuchet
    ile tamamla.


    **Deathball kompozisyonu (kapalı haritalar / takım maçları):** Trash okçusu ve Hussar duvarının arkasında kitlesel
    War Elephant kullan; tahkimli mevzileri kırmak için Cedrum kuşatma araçları veya Bombard Cannon ekle.


    **Önerilen build:** [Scout Rush](/tr/builds/18pop-scouts/)
