strategy:
  en: >-
    Celts are an Infantry civilization from Western Europe.


    ## How to Play Celts


    **Ideal opening (Dark → Castle):** Lean on the faster-moving infantry and pressure early with a two-militia Feudal
    rush to deny your opponent's economy, then flow that aggression into Archery Ranges before transitioning toward
    Celtic Siege as you hit Castle Age.


    **Ideal late-game composition:** Anchor your army on Halberdiers as the trash backbone and pair them with Siege —
    Siege Rams to crack defenses and Siege Onagers (boosted by the faster Celt reload) to clear massed enemies.


    **Deathball composition (closed maps / team games):** Roll forward with Halberdiers screening Woad Raiders, then
    back the push with Siege Rams and Siege Onagers for an unkillable infantry-and-siege ball.


    **Recommended build:** [18 Pop Feudal Drush](/en/builds/18pop-feudal-drush)
  tr: >-
    Celts, Batı Avrupa'dan bir Yaya uygarlığıdır.


    ## Celts Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Daha hızlı hareket eden yayaya dayan ve iki militia'lık Feodal rush ile
    rakibinin ekonomisini baskı altına al; ardından bu saldırganlığı Archery Range'lere aktar ve Kale Çağı'na ulaşınca
    Celtic Siege'e geç.


    **İdeal geç oyun kompozisyonu:** Orduyu trash omurgası olarak Halberdier'lara dayandır ve bunları Siege ile destekle
    — savunmaları kırmak için Siege Ram'ler, yığılmış düşmanları temizlemek için (hızlı Celt yeniden yükleme bonusuyla
    güçlendirilmiş) Siege Onager'lar.


    **Deathball kompozisyonu (kapalı haritalar / takım maçları):** Woad Raider'ları perdelemek için öne Halberdier'ları
    sür, ardından Siege Ram'ler ve Siege Onager'larla push'u destekle — durdurulamaz bir yaya-siege topu oluşturursun.


    **Önerilen build:** [18 Pop Feudal Drush](/tr/builds/18pop-feudal-drush)
