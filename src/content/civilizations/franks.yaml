strategy:
  en: >-
    Franks are a Cavalry civilization from Western Europe.


    ## How to Play Franks


    **Ideal opening (Dark → Castle):** Begin with a Scout opening to pressure the enemy economy, then transition
    straight into Knights once you reach Castle Age — the +20% HP bonus makes them brutally efficient. Snowball that
    lead by upgrading into Paladin as the game pushes toward Imperial.


    **Ideal late-game composition:** Lean on massed Paladin as your core; their durability lets them trade favorably
    even into Halberdiers. Round the army out with a ranged answer (Skirmishers, Throwing Axemen, or Hand Cannoneers)
    plus your own Halberdiers to cover against enemy cavalry.


    **Deathball composition (closed maps / team games):** Stack Paladin in front, back them with Heavy Scorpions to
    shred clumped infantry, and add Trebuchets (plus Bombard Cannons) to break down defenses as you grind forward.


    **Recommended build:** [Scout Rush](/en/builds/18pop-scouts/)
  tr: >-
    Franks, Batı Avrupa'dan bir Süvari uygarlığıdır.


    ## Franks Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Scout rush ile düşman ekonomisine baskı yap, ardından Kale Çağı'na ulaşınca
    doğrudan Knight'lara geç — %20 bonus can onları son derece verimli kılar. Knight'ları Paladin'e yükselterek
    İmparatorluk Çağı'na doğru bu avantajı kartopu gibi büyüt.


    **İdeal geç oyun kompozisyonu:** Kalabalık Paladin'i ana gücün olarak kullan; dayanıklılıkları Halberdier'lara karşı
    bile avantajlı çatışma sağlar. Orduyu menzilli bir cevapla (Skirmisher'lar, Throwing Axemen veya Hand Cannoneers) ve
    düşman süvarisine karşı kendi Halberdier'larınla tamamla.


    **Deathball kompozisyonu (kapalı haritalar / takım oyunları):** Paladin'i öne koy, Heavy Scorpion'larla toplu
    piyadeleri tarayarak arkalarında destekle; ilerlerken savunmaları yıkmak için Trebuchet (ve Bombard Cannon) ekle.


    **Önerilen build:** [Scout Rush](/en/builds/18pop-scouts/)
