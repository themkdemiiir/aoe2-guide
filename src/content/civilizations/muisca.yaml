    - Settlement'lar -%25 maliyetli ve yakınındaki birimleri iyileştirir
    - Champi Warriors ve Archery Range Birimleri Feodal/Kale/İmparatorluk Çağı'nda +1/2/3 yakın dövüş zırhı kazanır
    - Monks inancını %50 daha hızlı yeniler
