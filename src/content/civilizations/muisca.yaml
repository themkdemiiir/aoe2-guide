tagline:
  en: Muisca — an Archer and Monk civilization from South America.
  tr: Muisca, Güney Amerika'dan bir Okçu ve Keşiş uygarlığıdır.
bonuses:
  en:
    - Advancing to the next Age costs -50% gold
    - Settlements cost -33% and heal nearby units
    - Champi Warriors and Archery Range Units +1/2/3 melee armor in Feudal/Castle/Imperial Age
    - Monks regain faith +50% faster
    - Caravan, Guilds free
  tr:
    - Bir sonraki Çağa atlama %50 daha az altına mal olur
    - Yerleşim maliyeti %33 daha azdır ve yerleşimler yakındaki birimleri iyileştirir
    - >-
      Champi Savaşçıları ve Okçuluk Binası Birimleri Feodal/Kale/İmparatorluk Çağlarında +1/2/3 yakın dövüş zırhı
      kazanır
    - Keşişler +%50 daha hızlı inanç kazanır
    - Kervanlar ve Loncalar ücretsizdir
