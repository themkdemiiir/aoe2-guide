strategy:
  en: >-
    Muisca are a Gold and Infantry civilization from South America.


    ## How to Play Muisca


    **Ideal opening (Dark → Castle):** Lean on the cheap, durable barracks line and the strong gold economy. Open with
    Men-at-Arms or Eagle Warriors backed by your faster gold income, since the -10% gold cost and +5 HP make early
    infantry trades favorable; pair them with a Range or extra Barracks pressure and transition into a Castle where
    Zipa's Authority turns your infantry into a real threat.


    **Recommended build:** [18 Pop Double Barracks Eagles](/en/builds/18pop-double-barracks-eagles)


    *(Late-game and deathball compositions not yet covered for this civ.)*
  tr: >-
    Muisca, Güney Amerika'dan bir Altın ve Piyade uygarlığıdır.


    ## Muisca Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Ucuz ve dayanıklı barracks hattına ve güçlü Altın ekonomisine yaslan. Daha hızlı
    Altın gelirinle Men-at-Arms veya Eagle Warriors açılışı yap; -%10 Altın maliyeti ve +5 can, erken piyade takaslarını
    senin lehine çevirir. Bunu bir Range ya da ekstra Barracks baskısıyla destekle ve Kale Çağı'na geç; orada Zipa's
    Authority piyadelerini gerçek bir tehdide dönüştürür.


    **Önerilen build:** [18 Pop Double Barracks Eagles](/en/builds/18pop-double-barracks-eagles)


    *(Bu uygarlık için geç oyun ve deathball kompozisyonları henüz eklenmedi.)*
