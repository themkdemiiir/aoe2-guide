strategy:
  en: >-
    Dravidians are an Infantry and Naval civilization from South Asia.


    ## How to Play Dravidians


    **Ideal opening (Dark → Castle):** Spend the +200 wood bonus on two Archery Ranges and pump Archers backed by
    Skirmishers, leaning on the civ's stronger-than-usual Skirmisher line. Add a handful of Spearmen to deter cavalry,
    then transition toward Crossbows as you push into Castle Age.


    **Ideal late-game composition:** A realistic, sustainable army pairs Skirmishers as your trash core with a gold-cost
    melee threat — Halberdiers, Champions, or Urumi Swordsmen empowered by Wootz Steel — and rounds out with Bombard
    Cannons for siege.


    **Deathball composition (closed maps / team games):** On closed maps, mass Elephant Archers (available from the
    Archery Range) behind a wall of Halberdiers, sprinkle in Urumi Swordsmen, and bring Siege Onagers, Trebuchets, or
    Bombard Cannons to break enemy formations.


    **Recommended build:** [19 Pop 1-Range Archers](/en/builds/19pop-archers)
  tr: >-
    Dravidians, Güney Asya'dan bir Yaya ve Denizcilik uygarlığıdır.


    ## Dravidians Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** +200 Odun bonusunu iki Okçu Talimhanesi açmak için harca ve uygarlığın
    ortalamanın üzerindeki Skirmisher hattına dayanarak Archer'ları Skirmisher desteğiyle pompalamaya başla. Süvariye
    karşı koymak için bir avuç Spearman ekle; ardından Kale Çağı'na geçerken Crossbow'lara geç.


    **İdeal geç oyun kompozisyonu:** Gerçekçi ve sürdürülebilir bir ordu, trash core olarak Skirmisher'ları; Wootz Steel
    ile güçlendirilmiş Halberdier, Champion ya da Urumi Swordsman'dan oluşan Altın maliyetli yakın dövüş tehdidini;
    kuşatma için ise Bombard Cannon'ı bir araya getirir.


    **Deathball kompozisyonu (kapalı haritalar / takım maçları):** Kapalı haritalarda Halberdier duvarının arkasına
    kitlesel Elephant Archer (Okçu Talimhanesi'nden alınabilir) diz, Urumi Swordsman ekle ve düşman düzenini bozmak için
    Siege Onager, Trebuchet ya da Bombard Cannon getir.


    **Önerilen build:** [19 Pop 1-Range Archers](/tr/builds/19pop-archers)
