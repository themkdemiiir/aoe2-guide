strategy:
  en: >-
    Berbers are a Cavalry and Naval civilization from North Africa.


    ## How to Play Berbers


    **Ideal opening (Dark → Castle):** Apply early Feudal pressure with a Scout Rush, leaning on the faster villagers to
    reach Feudal smoothly. Once you hit the Castle Age, the -20% stable discount makes cheap mounted units the backbone
    of your army — flood the map with discounted stable units, or branch into Camel Archers and Genitours depending on
    what your opponent fields.


    **Ideal late-game composition:** Build around Camel Archers as your gold-based core, padded out with Hussars as the
    cheap trash unit to soak hits and raid, and add Bombard Cannons or Trebuchets to break buildings and siege lines.


    **Deathball composition (closed maps / team games):** Pack Camel Archers behind a wall of Heavy Scorpions to shred
    massed infantry and archers, with Bombard Cannons clearing fortifications and enemy siege as the ball rolls forward.


    **Recommended build:** [Scout Rush](/en/builds/18pop-scouts)
  tr: >-
    Berbers, Kuzey Afrika'dan bir Süvari ve Denizcilik uygarlığıdır.


    ## Berbers Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Daha hızlı köylüler sayesinde Feodal Çağ'a sorunsuz çıkarken Scout Rush ile
    erken baskı uygula. Kale Çağı'na geçtiğinde %-20 Stable indirimi, ucuz süvari birimlerini ordunun temelini oluşturur
    — haritayı indirimli Stable birimleriyle kapla ya da rakibinin çıkardığı şeye göre Camel Archer ve Genitour'a yönel.


    **İdeal geç oyun kompozisyonu:** Altın bazlı çekirdeği Camel Archer'larla oluştur; ucuz trash birimi olarak darbe
    yutan ve baskı yapan Hussar'larla doldur; binaları ve kuşatma hatlarını kırmak için Bombard Cannon veya Trebuchet
    ekle.


    **Deathball kompozisyonu (kapalı haritalar / takım maçları):** Kitlesel piyade ve Archer'ları parçalamak için Heavy
    Scorpion duvarının arkasına Camel Archer diz; top yuvarlayarak ilerlerken tahkimatları ve düşman kuşatmalarını
    Bombard Cannon'la temizle.


    **Önerilen build:** [Scout Rush](/tr/builds/18pop-scouts)
