strategy:
  en: >-
    Poles are a Cavalry civilization from Eastern Europe.


    ## How to Play Poles


    **Ideal opening (Dark → Castle):** Lean on the free Scout upgrades and pressure with a Scout Rush while your farms
    quietly stack stone, or commit to a forward Tower Rush (scouts plus walling also works). From there transition into
    a boom and exploit the cheap Knight line tech for an all-in Knight push.


    **Ideal late-game composition:** Pair Obuch as your gold core with Skirmishers as the trash counter and back them up
    with siege — Trebuchets or Bombard Cannons.


    **Deathball composition (closed maps / team games):** Stack Obuch with Arbalests and Bombard Cannons, then round it
    out with Monks and Winged Hussar for the final push.


    **Recommended build:** [Scout Rush](/en/builds/18pop-scouts)
  tr: >-
    Poles, Doğu Avrupa'dan bir Süvari uygarlığıdır.


    ## Poles Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Ücretsiz Scout yükseltmelerine yaslan ve Scout Rush ile baskı uygularken
    çiftliklerin sessiz sedasız taş biriktirmesini sağla; ya da öne doğru bir Tower Rush'a odaklan (Scout'larla
    çevreleme de işe yarar). Ardından boom yaparak geçiş yap ve ucuz Knight hat teknolojisini kullanarak tam güçte bir
    Knight saldırısı başlat.


    **İdeal geç oyun kompozisyonu:** Altın gücün olarak Obuch'u, trash counter olarak Skirmisher'ları ve arkalarında
    kuşatma makinelerini — Trebuchet veya Bombard Cannon — birleştir.


    **Deathball kompozisyonu (kapalı haritalar / takım maçları):** Obuch'u Arbalest'ler ve Bombard Cannon'larla yığ; son
    atılım için Monk'lar ve Winged Hussar ile tamamla.


    **Önerilen build:** [Scout Rush](/tr/builds/18pop-scouts)
