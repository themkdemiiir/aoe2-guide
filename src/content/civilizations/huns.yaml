strategy:
  en: >-
    Huns are a Cavalry civilization from Central Asia.


    ## How to Play Huns


    **Ideal opening (Dark → Castle):** Lean on the no-houses bonus to push a fast Scout opening, then transition
    smoothly into Cavalry Archers or Light Cavalry as you reach Castle Age — the discounted Cav Archers make that pivot
    especially cheap.


    **Ideal late-game composition:** Field Heavy Cavalry Archers as your gold unit, back them with Hussar as the cheap
    trash frontline, and bring Trebuchets (boosted by the accuracy bonus) to break down buildings.


    **Deathball composition (closed maps / team games):** Mass Elite Tarkans to tear through fortifications, pair them
    with Heavy Cavalry Archers for ranged damage, and add Siege Rams to flatten anything left standing.


    **Recommended build:** [Scout Rush](/en/builds/18pop-scouts)
  tr: >-
    Huns, Orta Asya'dan bir Süvari uygarlığıdır.


    ## Huns Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Ev inşa etme zorunluluğu olmadığı için bu avantajı hızlı Scout açılışı yapmak
    için kullan, ardından Kale Çağı'na ulaşınca Cavalry Archer veya Light Cavalry'ye geç — indirimli Cavalry Archer'lar
    bu geçişi özellikle ucuza getirir.


    **İdeal geç oyun kompozisyonu:** Altın birimlerin olarak Heavy Cavalry Archer'ları sürüşünün önünde tut, ucuz trash
    ön hat olarak Hussar'larla destekle ve binalara karşı (isabetlilik bonusundan yararlanan) Trebuchet'ler ekle.


    **Deathball kompozisyonu (kapalı haritalar / takım oyunları):** Fortifikasyonları yıkmak için kalabalık Elite Tarkan
    kullan, menzilli hasar için Heavy Cavalry Archer'larla eşleştir ve geri kalanını düzlemek için Siege Ram ekle.


    **Önerilen build:** [Scout Rush](/en/builds/18pop-scouts)
