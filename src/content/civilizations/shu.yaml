slug: shu
name:
  en: Shu
  tr: Shu
tagline:
  en: Shu — an Archer and Siege civilization from East Asia.
  tr: Shu, Doğu Asya'dan bir Okçu ve Kuşatma uygarlığıdır.
bonuses:
  en:
    - Lumberjacks generate food in addition to wood
    - Archery Unit technologies at the Archery Range and Blacksmith cost -25%
    - Siege Weapons and Siege Warships move +10/15% faster in Castle/Imperial Age
  tr:
    - Oduncular oduna ek olarak yiyecek üretir
    - Okçuluk Binasındaki ve Demircideki Okçu Birim teknolojileri %25 daha ucuzdur
    - Kuşatma Silahları ve Kuşatma Gemileri, Kale Çağı'nda/İmparatorluk Çağı'nda %10/%15 daha hızlıdır
teamBonus:
  en: Foot Archers +2 line of sight
  tr: Yaya Okçuların görüş hattı +2 artar
uniqueTechs:
  castle:
    name:
      en: Coiled Serpent Array
      tr: Coiled Serpent Array
    effect:
      en: Spearman-line and White Feather Guards gain additional HP when near each other
      tr: Mızraklı Asker Türleri ve Beyaz Tüy Muhafızları birbirine yakınken ek DP kazanır
  imperial:
    name:
      en: Bolt Magazine
      tr: Bolt Magazine
    effect:
      en: Archer-line, War Chariots and Lou Chuans fire additional projectiles
      tr: Okçu türleri, Savaş Arabaları ve Lou Chuanlar fazladan mermi atar
strategy:
  en: >-
    Shu are an Infantry civilization from East Asia.


    ## How to Play Shu


    **Ideal opening (Dark → Castle):** As an infantry-bonus civ (Shu Strategy gives infantry +1 attack), open with a
    Man-at-Arms rush or a Feudal drush, then transition into Long Swordsmen and your Tiger Cavalry in Castle Age.


    **Recommended build:** [18 Pop Feudal Drush](/en/builds/18pop-feudal-drush)


    *Opening synthesized from this Three Kingdoms civ's bonuses; a fuller guide is coming.*
  tr: >-
    Shu, Doğu Asya'dan gelen bir Piyade uygarlığıdır.


    ## Shu Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Piyade bonuslu bir uygarlık olarak (Shu Strategy piyadelerine +1 saldırı verir),
    Man-at-Arms rush ya da Feodal drush ile açılış yap; ardından Kale Çağı'nda Long Swordsmen'a ve Tiger Cavalry'ye geç.


    **Önerilen build:** [18 Pop Feudal Drush](/en/builds/18pop-feudal-drush)


    *Açılış, bu Üç Krallık uygarlığının bonuslarından sentezlenmiştir; daha kapsamlı bir rehber yakında.*
