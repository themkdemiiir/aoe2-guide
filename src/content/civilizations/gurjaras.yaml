strategy:
  en: >-
    Gurjaras are a Cavalry and Naval civilization from South Asia.


    ## How to Play Gurjaras


    **Ideal opening (Dark → Castle):** Open with single-range Archers in Feudal Age, then transition into Crossbowmen
    reinforced by Camel Riders once you reach Castle Age, leaning on the food discount from Kshatriyas to keep
    production flowing.


    **Ideal late-game composition:** Build around Chakram Throwers as your gold-cost core, add Hussars as the trash
    backbone to soak melee and chase down stragglers, and round it out with Trebuchets or Bombard Cannons for siege.


    **Deathball composition (closed maps / team games):** Mass Chakram Throwers behind a wall of Heavy Camel Riders,
    with Bombard Cannons providing the long-range punch to break through fortified positions.


    **Recommended build:** [19 Pop 1-Range Archers](/en/builds/19pop-archers)
  tr: >-
    Gurjaras, Güney Asya'dan gelen bir Süvari ve Denizcilik uygarlığıdır.


    ## Gurjaras Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Feodal Çağ'da tek Archery Range'den Archer'larla aç; Kale Çağı'na ulaşınca
    Kshatriyas'ın Yiyecek indiriminden yararlanarak üretime devam ederken Crossbowmen'leri Camel Rider'larla destekle.


    **İdeal geç oyun kompozisyonu:** Altın maliyetli çekirdek olarak Chakram Thrower'ları kullan, yakın dövüşü emmek ve
    kaçanları kovalamak için trash omurgası olarak Hussar'lar ekle; kuşatma için Trebuchet veya Bombard Cannon ile
    tamamla.


    **Deathball kompozisyonu (kapalı haritalar / takım oyunları):** Heavy Camel Rider'lardan oluşan bir duvarın arkasına
    Chakram Thrower kitle; tahkimatlı mevzileri kırmak için uzun menzilli güç olarak Bombard Cannon kullan.


    **Önerilen build:** [19 Pop 1-Range Archers](/en/builds/19pop-archers)
