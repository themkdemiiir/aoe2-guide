strategy:
  en: >-
    Koreans are a Tower and Naval civilization from East Asia.


    ## How to Play Koreans


    **Ideal opening (Dark → Castle):** Lean on wood-based units rather than infantry or scouts — Koreans get no help
    there. Open with a Spear-Skirmisher mix or one-range Archers, then keep producing the units your lumber camps can
    sustain as you transition into Castle Age.


    **Ideal late-game composition:** Field Halberdiers as your trash backbone, back them with a gold core of Arbalests
    or War Wagons, and add Bombard Cannons or Trebuchets for siege. Your free Tower upgrades and ranged-tower bonus make
    defensive Yasama Tower lines a strong addition.


    **Deathball composition (closed maps / team games):** Stack War Wagons and Halberdiers behind long-range genitours
    (10 range) and finish with Trebuchets or Bombard Cannons, leaning on Korea's signature ranged firepower.


    **Recommended build:** [Korean Spear-Skirm](/en/builds/korean-spear-skirm)
  tr: >-
    Koreans, Doğu Asya'dan bir Kule ve Denizcilik uygarlığıdır.


    ## Koreans Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Piyade veya Scout yerine Odun bazlı birimlere yaslan — Koreans'ın bu konuda
    herhangi bir bonusu yok. Spear-Skirmisher karışımı veya tek menzilli Archer'larla başla, ardından Kale Çağı'na
    geçerken kereste kamplarının sürdürebildiği birimleri üretmeye devam et.


    **İdeal geç oyun kompozisyonu:** Halberdier'ları trash omurgası olarak kullan, arkalarını Arbalest veya War
    Wagon'lardan oluşan altın bir çekirdekle destekle ve kuşatma için Bombard Cannon ya da Trebuchet ekle. Ücretsiz Kule
    yükseltmelerin ve menzilli kule bonusun, savunma amaçlı Yasama Tower hatlarını güçlü bir seçenek haline getirir.


    **Deathball kompozisyonu (kapalı haritalar / takım oyunları):** Uzun menzilli (10 menzil) genitour'ların arkasına
    War Wagon ve Halberdier yığ, ardından Trebuchet veya Bombard Cannon ile bitir; Koreans'ın menzilli ateş gücünden
    yararlan.


    **Önerilen build:** [Korean Spear-Skirm](/en/builds/korean-spear-skirm)
