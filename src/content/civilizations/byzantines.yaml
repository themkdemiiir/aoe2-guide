strategy:
  en: >-
    Byzantines are a Defensive civilization from the Eastern Mediterranean.


    ## How to Play Byzantines


    **Ideal opening (Dark → Castle):** Pressure in Feudal with a Skirmisher-and-Spearman rush, leaning on your 25%
    discount to flood the field with cheap counter units. Carry that into Castle Age, where discounted Skirmishers,
    Spearmen, and Camels let you answer almost anything your opponent throws at you for a fraction of the usual cost.


    **Ideal late-game composition:** Build around Halberdiers and Skirmishers as your cut-rate trash core, fold in Siege
    to break formations and buildings, and use your +50% heal-speed Monks to reclaim relics and recover units. Top it
    off with a flexible gold unit — Cataphracts, Hand Cannoneers, or Heavy Camels — depending on what the matchup
    demands.


    **Deathball composition (closed maps / team games):** March forward behind a wall of Cataphracts, back them with
    Bombard Cannons to shell enemy positions, and keep Monks in the mix for healing and conversions; Bombard Towers
    anchor the line on defense thanks to your cheap, extra-tough buildings.


    **Recommended build:** [Spearman + Skirmisher](/en/builds/korean-spear-skirm)
  tr: >-
    Byzantines, Doğu Akdeniz'den savunmacı bir uygarlıktır.


    ## Byzantines Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Feodal Çağ'da Skirmisher ve Spearman rush'ıyla baskı uygula; %25 indiriminden
    yararlanarak alanı ucuz counter birimleriyle doldur. Bunu Kale Çağı'na taşı — indirimli Skirmisher'lar, Spearman'lar
    ve Camel Rider'lar, rakibinin hemen her hamlesine olağandan çok daha düşük bir maliyetle yanıt vermeni sağlar.


    **İdeal geç oyun kompozisyonu:** Ucuz trash çekirdeğin olarak Halberdier ve Skirmisher'ları kullan, birlikleri ve
    binaları kırmak için Siege ekle; rölikleri geri almak ve birimleri iyileştirmek için %50 daha hızlı iyileştiren
    Monk'lardan yararlan. Üstüne maç durumuna göre esnek bir Altın birimi — Cataphract, Hand Cannoneer ya da Heavy Camel
    Rider — ekle.


    **Deathball kompozisyonu (kapalı haritalar / takım maçları):** Cataphract duvarının arkasında ilerle, düşman
    mevzilerini dökmek için Bombard Cannon ekle ve iyileştirme ile dönüştürme için Monk'ları birlikte tut; ucuz ve
    ekstra dayanıklı binaların sayesinde Bombard Tower'lar savunma hattını sabitlemeye yarar.


    **Önerilen build:** [Spearman + Skirmisher](/en/builds/korean-spear-skirm)
