strategy:
  en: >-
    Romans are an Infantry civilization from the Ancient Mediterranean.


    ## How to Play Romans


    **Ideal opening (Dark → Castle):** A Scout Rush is the strongest line — the Romans' powerful economy lets you
    pressure early while staying ahead on villagers. Transition into Long Swordsmen once you reach the Castle Age to
    lean on the infantry attack bonus. A Men-at-Arms opening is viable but tends to over-commit and can stall your
    economy.


    **Recommended build:** [Romans 5 Men-at-Arms](/en/builds/romans-5-maa)


    *(Late-game and deathball compositions not yet covered for this civ.)*
  tr: >-
    Romans, Antik Akdeniz'den gelen bir Piyade uygarlığıdır.


    ## Romans Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Scout Rush en güçlü seçenek — Romans'ın güçlü ekonomisi erken baskı yaparken
    köylü sayısında önde kalmanı sağlar. Kale Çağı'na ulaştığında piyade saldırı bonusundan yararlanmak için Long
    Swordsmen'e geç. Men-at-Arms açılışı mümkündür ama ekonomini yavaşlatabilir.


    **Önerilen build:** [Romans 5 Men-at-Arms](/tr/builds/romans-5-maa)


    *(Bu uygarlık için geç oyun ve deathball kompozisyonları henüz eklenmedi.)*
