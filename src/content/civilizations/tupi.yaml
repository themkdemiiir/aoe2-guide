strategy:
  en: >-
    Tupi are an Archer and Raiding civilization from South America.


    ## How to Play Tupi


    **Ideal opening (Dark → Castle):** Lean on the archer identity early — push through Feudal with a one-range archer
    opening, since the +1 attack versus cavalry and the team bonus make your bowmen punch above their cost. Transition
    into Castle Age crossbows while using forests as a defensive crutch, where Ambush gives your archers extra range to
    win woodline fights.


    **Recommended build:** [19 Pop 1-Range Archers](/en/builds/19pop-archers)


    *(Late-game and deathball compositions not yet covered for this civ.)*
  tr: >-
    Tupi, Güney Amerika'dan bir Archer ve baskın uygarlığıdır.


    ## Tupi Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Erken dönemde okçu kimliğine yaslan — süvari karşısındaki +1 saldırısı ve takım
    bonusu sayesinde okçuların maliyetinin üzerinde güç verir; tek menzil okçu açılışıyla Feodal Çağ'ı geç. Kale
    Çağı'nda crossbow'a geç, ormanlara savunma kalkanı olarak yaslan; Ambush sayesinde okçuların ağaçlık savaşlarını
    kazanmak için ekstra menzil kazanır.


    **Önerilen build:** [19 Pop 1-Range Archers](/en/builds/19pop-archers)


    *(Bu uygarlık için geç oyun ve deathball kompozisyonları henüz kapsanmamıştır.)*
