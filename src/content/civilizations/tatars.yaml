strategy:
  en: >-
    Tatars are a Cavalry Archer civilization from Central Asia.


    ## How to Play Tatars


    **Ideal opening (Dark → Castle):** Pressure with a Scout Rush in Feudal, then transition into Cavalry Archers in
    Castle Age — your free Thumb Ring makes them accurate immediately. Steppe Lancers, Camels, or Light Cavalry are
    flexible alternatives depending on what your opponent fields.


    **Ideal late-game composition:** Heavy Cavalry Archers backed by Hussars (their armor benefits from your unique
    tech) and Trebuchets. A Keshik, Skirmisher, and Trebuchet mix is the strong second option when you need to grind out
    a longer game.


    **Deathball composition (closed maps / team games):** Long-range Trebuchets — 18 tiles with Siege Engineers plus
    your unique tech — paired with Heavy Cavalry Archers and Keshiks to shred buildings and armies from a safe distance.


    **Recommended build:** [Scout Rush](/en/builds/18pop-scouts/)
  tr: >-
    Tatars, Orta Asya kökenli bir Cavalry Archer uygarlığıdır.


    ## Tatars Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Feodal Çağ'da Scout Rush ile baskı uygula, ardından Kale Çağı'nda Cavalry
    Archer'lara geç — ücretsiz Thumb Ring onları anında isabetli yapar. Scout, Camel Rider veya Light Cavalry, rakibinin
    ne çıkardığına göre esnek alternatiflerdir.


    **İdeal geç oyun kompozisyonu:** Hussar desteğiyle Heavy Cavalry Archer'lar (zırhları özgün teknolojinden
    yararlanır) ve Trebuchet'ler. Keshik, Skirmisher ve Trebuchet karışımı, uzun soluklu bir oyun gerektiğinde güçlü
    ikinci seçenektir.


    **Deathball kompozisyonu (kapalı haritalar / takım maçları):** Siege Engineers artı özgün teknolojinle 18 karo
    menzile ulaşan uzun menzilli Trebuchet'ler — Heavy Cavalry Archer'lar ve Keshik'lerle eşleştirerek binaları ve
    orduları güvenli bir mesafeden ezip geç.


    **Önerilen build:** [Scout Rush](/tr/builds/18pop-scouts/)
