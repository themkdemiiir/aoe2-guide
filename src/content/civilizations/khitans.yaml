    name:
      en: Lamellar Armor
      tr: Lamellar Armor
    effect:
      en: Infantry and Skirmishers reflect 25% melee damage back to the attacker
      tr: Piyadeler ve Avcı Erleri, yakın dövüş hasarının %25'ini saldırgana geri yansıtır
  imperial:
    name:
      en: Ordo Cavalry
      tr: Ordo Cavalry
    effect:
      en: Cavalry regenerates HP in combat
      tr: Süvari savaşta DP yeniler
