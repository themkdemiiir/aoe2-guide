slug: khitans
name:
  en: Khitans
  tr: Khitans
tagline:
  en: Khitans — an Infantry and Cavalry civilization from East Asia.
  tr: Khitans, Doğu Asya'dan bir Piyade ve Süvari uygarlığıdır.
bonuses:
  en:
    - Pastures replace Farms
    - Melee attack upgrade effects are doubled
    - Skirmishers, Spearman-, and Scout Cavalry-line train and upgrade +15% faster
    - Heavy Cavalry Archer upgrade available in Castle Age and costs -50%
  tr:
    - Çiftliklerin yerini Meralar alır
    - Yakın dövüş saldırısının yükseltme etkileri iki katına çıkar
    - Avcı Erleri, Mızraklı Askerler ve Atlı Gözcü türleri %15 daha hızlı eğitilir ve yükseltilir
    - Ağır Atlı Okçu yükseltmesi Kale Çağı'nda açılır ve %50 daha az maliyetli olur
teamBonus:
  en: Infantry +2 attack vs. Ranged Soldiers
  tr: Piyadeler, Menzilli Askerlere karşı +2 saldırı kazanır
