strategy:
  en: >-
    Turks are a Gunpowder civilization from the Middle East.


    ## How to Play Turks


    **Ideal opening (Dark → Castle):** Lean on a Scout opening that flexes into Light Cavalry, Knights, camels, or
    Cavalry Archers, or open with single-range Archers and ride the faster gold mining into an Archer plus Camel/Light
    Cavalry follow-up. Either path keeps you mobile while your gunpowder economy comes online.


    **Ideal late-game composition:** Mass Heavy Cavalry Archers buffed by Zepaji's bonus HP, back them with the free
    upgraded Hussars (extra pierce armor) as your trash line, and add Bombard Cannons whose Artillery range bonus lets
    your siege out-position the enemy.


    **Deathball composition (closed maps / team games):** Roll forward with Heavy Cavalry Archers shielded by Hussars
    and supported by Bombard Cannons — a durable, hard-hitting ball that grinds through static defenses.


    **Recommended build:** [28 Pop Turks Fast Imp](/en/builds/28pop-turks-fast-imp)
  tr: >-
    Turks, Orta Doğu'dan bir Barut uygarlığıdır.


    ## Turks Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Scout açılışı yaparak Light Cavalry, Knight'lar, Camel'lar ya da Cavalry
    Archer'lara yönelebilirsin; ya da tek Archery Range ile Archer'larla başlayıp hızlı Altın madenciliği avantajını
    Archer + Camel/Light Cavalry takibiyle değerlendirebilirsin. Her iki yol da barut ekonomin devreye girerken seni
    hareketli tutar.


    **İdeal geç oyun kompozisyonu:** Zepaji'nin bonus can avantajıyla güçlendirilmiş kalabalık Heavy Cavalry Archer'ları
    öne çıkar; ücretsiz yükseltilmiş Hussar'ları (ekstra delici zırh) trash line'ın olarak arkalarına ekle ve Artillery
    menzil bonusu sayesinde düşmanı pozisyon olarak geçen Bombard Cannon'lar ile desteği tamamla.


    **Deathball kompozisyonu (kapalı haritalar / takım oyunları):** Hussar'larla korunan ve Bombard Cannon'larla
    desteklenen Heavy Cavalry Archer'larla ilerle — statik savunmaları ezen dayanıklı, çok hasarlı bir top.


    **Önerilen build:** [28 Pop Turks Fast Imp](/en/builds/28pop-turks-fast-imp)
