strategy:
  en: >-
    Mayans are an Archer civilization from Mesoamerica.


    ## How to Play Mayans


    **Ideal opening (Dark → Castle):** Lean on your archer discount and start with a Feudal pressure mix of Eagle Scouts
    and Archers, since your bowmen are already cheaper than everyone else's. Transition into Castle Age and ramp into
    Crossbows backed by Eagle Warriors, using the early raiding from Eagles to disrupt the enemy economy while your
    ranged core builds up.


    **Ideal late-game composition:** Field your signature Plumed Archers (or Arbalests) as the gold-line ranged
    backbone, screen them with Halberdiers as the cheap trash anti-cavalry line, and add Siege Rams or Trebuchets to
    crack buildings. This gives you the realistic one-trash, one-gold, one-siege army while spending two gold-heavy
    lines is supported by your cost reductions.


    **Deathball composition (closed maps / team games):** Build around Elite Eagle Warriors supercharged by El Dorado
    for durable, hard-hitting raiders, massed Plumed Archers for ranged firepower, and Siege Rams or Trebuchets to push
    through walls and fortifications.


    **Recommended build:** [Eagle Range Feudal](/en/builds/eagle-range-feudal)
  tr: >-
    Mayans, Mezoamerika'dan bir Okçu uygarlığıdır.


    ## Mayans Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Okçu indirimini kullan ve Feodal baskıda Eagle Scout'lar ile Archer'ları
    birleştir; okçuların zaten herkesten daha ucuz. Kale Çağı'na geç ve Eagles'dan gelen erken baskınlar düşman
    ekonomisini aksatırken Crossbow'larını Eagle Warrior desteğiyle çoğalt.


    **İdeal geç oyun kompozisyonu:** Altın hattının menzilli omurgası olarak imza birimin Plumed Archer'ları (ya da
    Arbalest'leri) çıkar, düşük maliyetli trash olarak Halberdier'larla korudur ve binaları kırmak için Siege Ram ya da
    Trebuchet ekle. Bu sana bir trash, bir altın birimi ve bir kuşatma aracından oluşan dengeli bir ordu verir; maliyet
    indirimlerin iki altın ağır hat kullanmayı destekler.


    **Deathball kompozisyonu (kapalı haritalar / takım maçları):** El Dorado ile güçlendirilmiş Elite Eagle Warrior'ları
    dayanıklı ve etkili akıncı olarak kullan, yığın Plumed Archer'larla menzilli ateş gücü ekle ve duvarlarla
    tahkimatları aşmak için Siege Ram ya da Trebuchet koy.


    **Önerilen build:** [Eagle Range Feudal](/en/builds/eagle-range-feudal)
