strategy:
  en: >-
    Japanese are an Infantry civilization from East Asia.


    ## How to Play Japanese


    **Ideal opening (Dark → Castle):** Lean on the fast-attacking infantry bonus and open with a Man-at-Arms rush, then
    transition straight into an early Archery Range to keep the pressure on. Japanese fall off in the late game, so aim
    to convert this aggression into a decisive lead and close the match out before opponents stabilize.


    **Ideal late-game composition:** Pair Halberdiers (your trash anti-cavalry line) with Arbalest as the gold-spending
    core, and back them up with Trebuchets. Yasama-boosted Towers give your defensive line extra reach, helping you hold
    positions while the Arbalest fire.


    **Deathball composition (closed maps / team games):** Mass Halberdier and Arbalest behind a wall of Onagers, with
    Trebuchets to crack buildings. The Siege Engineers bonus extends siege range, letting your Onagers and Trebs
    out-range enemy fortifications as the ball rolls forward.


    **Recommended build:** [17 Pop Japanese Man-at-Arms Rush](/en/builds/17pop-japanese-maa-rush)
  tr: >-
    Japanese, Doğu Asya'dan bir Piyade uygarlığıdır.


    ## Japanese Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Hızlı saldıran piyade bonusuna yaslan ve Man-at-Arms rush ile aç, ardından
    baskıyı sürdürmek için erken bir Archery Range'e geç. Japanese geç oyunda zayıflar; bu yüzden saldırganlığını
    belirleyici bir avantaja dönüştür ve rakipler toparlanmadan maçı kapat.


    **İdeal geç oyun kompozisyonu:** Halberdier'ları (altın harcamayan anti-süvari hattın) Arbalest ile eşleştir ve
    Trebuchet'lerle destekle. Yasama ile güçlendirilmiş Tower'lar savunma hattına ekstra menzil kazandırır; Arbalest
    ateş ederken pozisyonları tutmana yardımcı olur.


    **Deathball kompozisyonu (kapalı haritalar / takım oyunları):** Onager duvarının arkasında kalabalık Halberdier ve
    Arbalest yığ; binaları yıkmak için Trebuchet ekle. Siege Engineers bonusu menzili uzatır, böylece Onager'ların ve
    Treb'lerin top ilerlerken düşman tahkimatlarını daha uzaktan iter.


    **Önerilen build:** [17 Pop Japanese Man-at-Arms Rush](/en/builds/17pop-japanese-maa-rush)
