strategy:
  en: >-
    Teutons are an Infantry civilization from Central Europe.


    ## How to Play Teutons


    **Ideal opening (Dark → Castle):** Teutons shine with an aggressive Feudal tower rush — free Murder Holes removes
    the usual minimum-range weakness, and the doubled garrison capacity means a single tower can hold up to 10 villagers
    and rain arrows on an enemy base. If you prefer something safer, lean on the cheap-farms economy and play a standard
    archer opening into the Castle Age.


    **Ideal late-game composition:** Build around Halberdiers as your trash backbone, add Bombard Cannons or Onagers as
    your gold-and-siege punch, and round it out with Trebuchets to crack buildings. Their long-healing-range Monks
    support the whole army.


    **Deathball composition (closed maps / team games):** Mass Teutonic Knights as the unbreakable melee core, screen
    them with Halberdiers against cavalry, and pile on Ironclad Siege Onagers plus Bombard Cannons to grind through
    defenses and clumped armies.


    **Recommended build:** [17 Pop Teuton Tower Rush](/en/builds/17pop-teuton-tower-rush/)
  tr: >-
    Teutons, Orta Avrupa'dan bir Piyade uygarlığıdır.


    ## Teutons Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Teutons, agresif bir Feodal tower rush ile parlar — ücretsiz Murder Holes olağan
    minimum menzil zayıflığını ortadan kaldırır; ikiye katlanmış garnizon kapasitesi sayesinde tek bir Tower 10 köylüye
    kadar barındırıp düşman üssüne ok yağdırabilir. Daha güvenli bir oyun tercih edersen ucuz çiftlik ekonomisine yaslan
    ve standart bir Archer açılışıyla Kale Çağı'na geç.


    **İdeal geç oyun kompozisyonu:** Halberdier'ları trash omurgası olarak kur, Altın ve kuşatma gücü için Bombard
    Cannon ya da Onager ekle, binaları yıkmak için Trebuchet ile tamamla. Uzun menzilli iyileştirme yapan Monk'lar tüm
    orduyu destekler.


    **Deathball kompozisyonu (kapalı haritalar / takım oyunları):** Kırılmaz yakın dövüş özü olarak kalabalık Teutonic
    Knight kur, süvariye karşı onları Halberdier'larla ört; savunmaları ve yığılmış orduları yıpratmak için Ironclad
    Siege Onager ile Bombard Cannon yığ.


    **Önerilen build:** [17 Pop Teuton Tower Rush](/en/builds/17pop-teuton-tower-rush/)
