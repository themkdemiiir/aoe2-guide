tagline:
  en: Jurchens — a Cavalry and Gunpowder civilization from East Asia.
  tr: Jurchens, Doğu Asya'dan bir Süvari ve Barut uygarlığıdır.
bonuses:
  en:
    - Meat of hunted and livestock animals doesn't decay
    - Mounted Units and Fire Lancers attack +25% faster starting in Feudal Age
    - Siege Engineers available in Castle Age
    - Siege and Fortification upgrades cost -75% wood and research +100% faster
    - Units receive -50% friendly fire damage
  tr:
    - Avlanan hayvanların ve besi hayvanlarının eti çürümez
    - Feodal Çağ'dan itibaren Binekli Birimler ve Alev Mızraklı Süvariler %25 daha hızlı saldırır
    - Kuşatma Mühendisleri, Kale Çağı'nda açılır.
    - Kuşatma ve Sur yükseltmeleri %75 daha az odun gerektirir ve %100 daha hızlı araştırılır
    - Birimler -%50 daha az dost ateşi hasarı alır
