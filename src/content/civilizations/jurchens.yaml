    - Siege Engineers Kale Çağı'nda kullanılabilir
    - Kuşatma ve Tahkimat yükseltmeleri %75 daha az Odun gerektirir ve %100 daha hızlı araştırılır
    - Birimler dost ateşinden %50 daha az hasar alır
