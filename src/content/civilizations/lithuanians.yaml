strategy:
  en: >-
    Lithuanians are a Cavalry and Monk civilization from Eastern Europe.


    ## How to Play Lithuanians


    **Ideal opening (Dark → Castle):** Open with Scouts or a Spearman-Skirmisher build — or go forward to apply early
    pressure — while making relic collection your top priority, since each garrisoned relic powers up your Cavalry and
    Monks. Hold on one Town Center to stay aggressive, then transition into a second TC and expand once you have a
    foothold and the relics in hand.


    **Ideal late-game composition:** Anchor your army on Leitis, your gold-line cavalry that grow stronger with every
    relic you control, supported by cheap Lithuanian Skirmishers as your trash line and Bombard Cannons or Trebuchets to
    crack buildings and siege. The relic-fueled attack bonus makes the Leitis core hit far above its weight.


    **Deathball composition (closed maps / team games):** Push forward behind a mass of Leitis, layer in Hand Cannoneers
    for ranged firepower against infantry, and use Bombard Cannons to demolish defensive structures and enemy siege as
    you grind through walls.


    **Recommended build:** [Spearman + Skirmisher](/en/builds/korean-spear-skirm)
  tr: >-
    Lithuanians, Doğu Avrupa'dan bir Süvari ve Keşiş uygarlığıdır.


    ## Lithuanians Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Scout'larla ya da Spearman-Skirmisher build'iyle aç — ya da erken baskı
    uygulamak için öne git — ve Relic toplamayı en yüksek önceliğin yap; çünkü garnizona alınan her Relic, Süvarilerin
    ve Keşişlerini güçlendirir. Agresif kalmak için tek Town Center'da tut, ardından bir dayanak noktası ve elindeki
    Relic'lerle ikinci bir Town Center'a geç ve genişle.


    **İdeal geç oyun kompozisyonu:** Orduyu, kontrol ettiğin her Relic'le güçlenen altın hattı süvarisi Leitis'e
    dayandır; trash hattın olarak ucuz Lithuanian Skirmisher'larla ve binaları ile kuşatmayı kırmak için Bombard Cannon
    ya da Trebuchet'lerle destekle. Relic'le güçlenen saldırı bonusu, Leitis çekirdeğinin ağırlığının çok üzerinde
    vurmasını sağlar.


    **Deathball kompozisyonu (kapalı haritalar / takım maçları):** Kitlesel Leitis'in arkasına geç; piyadelere karşı
    menzilli ateş gücü için Hand Cannoneer ekle ve duvarları ve düşman kuşatmasını yıkarken savunma yapılarını yıkmak
    için Bombard Cannon kullan.


    **Önerilen build:** [Spearman + Skirmisher](/en/builds/korean-spear-skirm)
