strategy:
  en: >-
    Mongols are a Cavalry Archer civilization from East Asia.


    ## How to Play Mongols


    **Ideal opening (Dark → Castle):** Open with Scouts and transition into Steppe Lancers, which is the strongest line
    for the civ; a Fast Castle straight into Steppe Lancers also works as a cheesy aggressive option. Scouts into
    Cavalry Archers or Men-at-Arms are solid alternatives depending on what your opponent commits to.


    **Ideal late-game composition:** Lean on Mangudai backed by Hussars, with Siege Rams or Siege Onagers (boosted by
    Drill) rounding out the army — Mangudai handle gold-cost firepower, Hussars provide cheap trash meatshields, and the
    siege breaks through buildings and clumps.


    **Deathball composition (closed maps / team games):** Stack Mangudai with Drill-powered Siege Onagers and a screen
    of Hussars, pushing a mobile, high-damage ball that shreds both units and structures.


    **Recommended build:** [Mongol Scouts into Cavalry Archers](/en/builds/mongol-scouts-ca)
  tr: >-
    Mongols, Doğu Asya'dan bir Cavalry Archer uygarlığıdır.


    ## Mongols Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Scout rush ile aç, ardından Steppe Lancer'lara geç — bu uygarlık için en güçlü
    hat bunlardır; Kale Çağı'na direkt atlayıp Steppe Lancer'lara geçmek agresif bir seçenek olarak da işe yarar.
    Scout'lardan Cavalry Archer'lara veya Man-at-Arms'a geçiş de rakibinin tercihine göre sağlam alternatiflerdir.


    **İdeal geç oyun kompozisyonu:** Hussar desteğiyle Mangudai'yi ana güç olarak kullan; Drill ile güçlendirilmiş Siege
    Ram veya Siege Onager'lar orduyu tamamlar — Mangudai Altın gerektiren ateş gücünü sağlar, Hussar'lar ucuz trash
    kalkanı görevi görür, siege ise binaları ve toplu birimleri ezer.


    **Deathball kompozisyonu (kapalı haritalar / takım oyunları):** Mangudai'yi Drill'li Siege Onager'larla ve önünde
    bir Hussar ekranıyla yığ; hem birimleri hem yapıları parçalayan hareketli, yüksek hasarlı bir top oluştur.


    **Önerilen build:** [Mongol Scouts into Cavalry Archers](/en/builds/mongol-scouts-ca)
