strategy:
  en: >-
    Britons are an Archer civilization from Western Europe.


    ## Playstyle


    Britons want to reach Castle Age fast with a strong wood economy (Town Center bonus), then mass Crossbowmen behind
    Longbowman support. The combination of range bonus + Yeomen turns them into the longest-range archer civ in the
    game.


    ## When to play Britons


    - Closed maps where you can boom safely.

    - Late-game team games where Longbowmen + Trebuchets break sieges.


    ## How to Play Britons


    **Ideal opening (Dark → Castle):** Open with a single Archery Range and play passively while your wood economy
    snowballs off the cheap Town Centers. Transition smoothly into Castle Age, where your +1 range Crossbowmen become
    the backbone of your army.


    **Ideal late-game composition:** Pair Longbowmen (or Arbalests when you want a cheaper, faster-firing line) with
    Halberdiers to screen against cavalry, and add Warwolf Trebuchets to flatten buildings and clumps of units without
    missing.


    **Deathball composition (closed maps / team games):** Stack 12-range Longbowmen behind a wall of Halberdiers and
    roll forward with Trebuchets — the unmatched range lets you out-shoot everything before the enemy closes.


    **Recommended build:** [19 Pop 1-Range Archers](/en/builds/19pop-archers)
  tr: >-
    Britons, oyunun en güçlü özgün birimlerinden biri olan Uzunyay Okçusuna sahip bir okçu uygarlığıdır. Kale ve
    İmparatorluk Çağı'nda uzun menzilli yaya okçu kompozisyonunda parlar.


    ## Oynayış


    Britons güçlü bir odun ekonomisiyle (Şehir Merkezi bonusu) hızlı Kale Çağı'na geçer; ardından Uzunyay Okçusu
    desteğiyle Tatar Yayı kalabalığı kurar. Menzil bonusu + Yeomen, Britons'ı oyundaki en uzun menzilli okçu uygarlığı
    yapar.


    ## Britons ne zaman oynanır


    - Güvenle ekonomi büyütebileceğin kapalı haritalar.

    - Uzunyay Okçusu + Trebuchet'lerin kuşatma savunmasını kıracağı geç oyun takım maçları.


    ## Britons Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Tek bir Okçu Talimhanesi ile aç ve ucuz Şehir Merkezleri sayesinde odun ekonomin
    katlanırken pasif oyna. Akıcı bir şekilde Kale Çağı'na geç; burada +1 menzilli Tatar Yayların ordunun belkemiği
    olur.


    **İdeal geç oyun kompozisyonu:** Uzunyay Okçularını (ya da daha ucuz ve hızlı ateş eden bir hat istediğinde
    Arbalest) süvariye karşı perde görevi gören Halberdier'lerle birleştir; binaları ve birim yığınlarını ıskalamadan
    ezmek için Warwolf Trebuchet ekle.


    **Deathball kompozisyonu (kapalı haritalar / takım maçları):** 12 menzilli Uzunyay Okçularını bir Halberdier
    duvarının arkasına diz ve Trebuchet'lerle öne doğru ilerle — eşsiz menzil, düşman yaklaşamadan her şeyi alt etmeni
    sağlar.


    **Önerilen build:** [19 Pop 1-Range Archers](/tr/builds/19pop-archers)
