strategy:
  en: >-
    Burmese are a Monk and Elephant civilization from Southeast Asia.


    ## How to Play Burmese


    **Ideal opening (Dark → Castle):** Lean on the infantry attack bonus right away with a two-militia drush in the Dark
    Age — the extra attack per age makes those early aggressors bite harder than a generic drush. From there, transition
    into a Range or Stable as you push toward Castle Age to keep the pressure rolling.


    **Ideal late-game composition:** Build around a clean trash-plus-gold-plus-siege core: Halberdiers carry the trash
    slot, your gold goes into massed Arambai, and Bombard Cannon (or Trebuchets) handle the siege. Thanks to the
    half-price monastery techs, folding in a pack of Monks rounds out the army nicely.


    **Deathball composition (closed maps / team games):** Stack a wall of Arambai as the damage core, screen them with
    Halberdiers, support with Monks, and bring Bombard Cannon to crack buildings — Battle Elephants are a strong
    alternative anchor when you want a heavier front line.


    **Recommended build:** [18 Pop Feudal Drush](/en/builds/18pop-feudal-drush/)
  tr: >-
    Burmese, Güneydoğu Asya kökenli bir Rahip ve Fil uygarlığıdır.


    ## Burmese Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Piyade saldırı bonusunu hemen kullanmak için Karanlık Çağ'da iki-militia drush
    ile aç — çağ başına gelen ekstra saldırı, bu erken agresörleri sıradan bir drush'tan çok daha etkili kılar. Ardından
    Kale Çağı'na ilerlerken baskıyı sürdürmek için Okçu Talimhanesi veya Stable'a geç.


    **İdeal geç oyun kompozisyonu:** Temiz bir trash-plus-altın-plus-kuşatma çekirdeği kur: Halberdier'lar trash slotunu
    doldurur, altınını toplu Arambai'ye yatır, Bombard Cannon (ya da Trebuchet'ler) kuşatmayı üstlenir. Yarı fiyatlı
    monastery teknolojileri sayesinde bir grup Monk eklemek orduyu güzel tamamlar.


    **Deathball kompozisyonu (kapalı haritalar / takım maçları):** Hasar çekirdeği olarak Arambai duvarı yığ, önlerine
    Halberdier'larla ekran kur, Monk'larla destek ver ve binaları kırmak için Bombard Cannon getir — daha ağır bir ön
    hat istediğinde Battle Elephant'lar güçlü bir alternatif çapa olabilir.


    **Önerilen build:** [18 Pop Feudal Drush](/tr/builds/18pop-feudal-drush/)
