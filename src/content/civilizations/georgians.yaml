strategy:
  en: >-
    Georgians are an Infantry and Cavalry civilization from the Caucasus.


    ## How to Play Georgians


    **Ideal opening (Dark → Castle):** Open with a Scout Rush, leaning on the civ's quick uptime. Your self-healing
    Scouts excel at hit-and-run raids — poke at enemy villagers, retreat to recover, and repeat without bleeding
    resources on repairs. Transition into massed Monaspa once you reach the Castle Age while your economy snowballs
    behind cheap Monasteries and extra Town Centers.


    **Recommended build:** [Georgians Healing Scouts](/en/builds/georgians-healing-scouts)


    *(Late-game and deathball compositions not yet covered for this civ.)*
  tr: >-
    Georgians, Kafkasya'dan bir Piyade ve Süvari uygarlığıdır.


    ## Georgians Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Scout Rush ile aç ve uygarlığın hızlı geçiş potansiyelinden yararlan.
    Kendiliğinden iyileşen Scout'ların vur-kaç baskısında mükemmeldir — düşman köylülerine saldır, geri çekil, kaynak
    harcamadan iyileş ve tekrarla. Ucuz Monastery'ler ve ek Town Center'larla ekonomin büyürken Kale Çağı'na ulaşınca
    kitlesel Monaspa'ya geç.


    **Önerilen build:** [Georgians Healing Scouts](/tr/builds/georgians-healing-scouts)


    *(Bu uygarlık için geç oyun ve deathball kompozisyonları henüz eklenmedi.)*
