    - Fortified Churches provide Villagers in a 9 tiles radius with +10% work rate
  tr:
    - Katır Arabasıyla başlanır
    - Birimler ve binalar daha yüksekte olduğunda %15 daha az hasar alır
    - Binekli Birimler dakika başına Feodal Çağ'da 2, Kale Çağı'nda 8, İmparatorluk Çağı'nda 14 DP yeniler
    - >-
      Güçlendirilmiş Kiliseler, etrafında 9 kare yarıçapındaki bir daire içinde bulunan Köylülere %10 çalışma hızı
      kazandırır
