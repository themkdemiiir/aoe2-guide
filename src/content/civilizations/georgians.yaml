    - Fortified Churches provide Villagers in a 9 tiles radius with +10% work rate
  tr:
    - Bir Mule Cart ile başla
    - Daha yüksek konumda bulunan birlik ve binalar -%15 hasar alır
    - Binekli Birlikler Feodal/Kale/İmparatorluk Çağı'nda dakikada 2/8/14 can yeniler
    - Fortified Church'ler, 9 karo yarıçapındaki köylülere +%10 çalışma hızı sağlar
