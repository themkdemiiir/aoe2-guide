strategy:
  en: >-
    Wei are a Cavalry civilization from East Asia.


    ## How to Play Wei


    **Ideal opening (Dark → Castle):** As a cavalry-bonus civ (Wei Formation gives cavalry +1 armour), open with a Scout
    Rush and play toward Knights and your Heavy Cavalry in Castle Age.


    **Recommended build:** [18 Pop Scout Rush](/en/builds/18pop-scouts)


    *Opening synthesized from this Three Kingdoms civ's bonuses; a fuller guide is coming.*
  tr: >-
    Wei, Doğu Asya'dan gelen bir Süvari uygarlığıdır.


    ## Wei Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** Süvari bonuslu bir uygarlık olarak (Wei Formation süvarilerine +1 zırh verir),
    Scout Rush ile açılış yap ve Kale Çağı'nda Knight'lara ve Ağır Süvari birimlerine geç.


    **Önerilen build:** [18 Pop Scout Rush](/en/builds/18pop-scouts)


    *Açılış, bu Üç Krallık uygarlığının bonuslarından sentezlenmiştir; daha kapsamlı bir rehber yakında.*
