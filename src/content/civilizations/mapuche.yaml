bonuses:
  en:
    - Foragers drop off +20% food
    - Settlements can train Spearman-line and Skirmishers
    - Infantry, Slingers and Skirmishers +5/10/15 HP in Feudal/Castle/Imperial Age
    - Mounted Units generate +3 gold when defeating military units
    - Enemy Castles are revealed on the map
  tr:
    - Toplayıcılar %20 daha fazla Yiyecek bırakır
    - Yerleşim Yerleri Spearman serisi ve Skirmisher eğitebilir
    - Piyade, Slingers ve Skirmisher'lar Feodal/Kale/İmparatorluk Çağı'nda +5/10/15 can kazanır
    - Atlı Birimler askeri birimleri yendiklerinde +3 Altın üretir
    - Düşman Kale'leri haritada görünür hale gelir
