slug: mapuche
name:
  en: Mapuche
  tr: Mapuche
tagline:
  en: Mapuche — a Cavalry and Counter-units civilization from South America.
  tr: Mapuche, Güney Amerika'dan bir Süvari ve Karşıt Birlik uygarlığıdır.
bonuses:
  en:
    - Foragers drop off +25% food
    - Settlements can train Spearman-line and Skirmishers
    - Infantry, Slingers and Skirmishers +5/10/15 HP in Feudal/Castle/Imperial Age
    - Mounted Units generate +3 gold when defeating military units
    - Enemy Castles are revealed on the map
  tr:
    - Toplayıcılar %25 daha fazla yiyecek bırakır
    - Yerleşimler, Mızraklı Asker türlerini ve Avcı Eri eğitebilir
    - Piyadeler, Sapancılar ve Avcı Erleri Feodal/Kale/İmparatorluk Çağlarında +5/10/15 DP'ye sahip olur
    - Binekli birimler, askerî birimleri yendiğinde +3 daha fazla altın üretir
    - Düşman Kaleleri haritada görülebilir
teamBonus:
  en: Spearman-line and Skirmishers +2 line of sight
  tr: Mızraklı Asker türleri ve Avcı Erleri +2 görüş hattı kazanır
uniqueTechs:
  castle:
    name:
      en: Malon
      tr: Malon
    effect:
      en: Bolas Riders, Slingers and Skirmishers deal pass through damage
      tr: Bolas Binicileri, Sapancılar ve Avcı Erleri delici hasar verir
  imperial:
    name:
      en: Butalmapu
      tr: Butalmapu
    effect:
      en: Team Castle Unique Units and Bolas Riders cost -15%
      tr: Takım Kalesi Özgün Birimlerinin ve Bolas Binicilerinin maliyeti %15 azalır
