strategy:
  en: >-
    Sicilians are an Infantry and Cavalry civilization from Southern Europe.


    ## How to Play Sicilians


    **Ideal opening (Dark → Castle):** Two main paths work. The aggressive route is a Fast Castle into Serjeants,
    leaning on the Donjon for an all-in pressure build that punishes greedy opponents. The safer, more flexible route is
    a Scout opening backed by Spearmen, which keeps you mobile while transitioning smoothly into Castle Age.


    **Ideal late-game composition:** Settle into Hauberk Cavalier as your gold core, paired with Skirmishers as cheap
    ranged trash and Trebuchets to break buildings. A viable alternative swaps the cavalry for Serjeants supported by
    Halberdiers and Trebuchets.


    **Deathball composition (closed maps / team games):** Mass Serjeants as the frontline, screen them with
    Scorpion-Corps genitours for ranged support, and add Trebuchets to dismantle fortifications as you grind forward.


    **Recommended build:** [Scout Rush](/en/builds/18pop-scouts/)
  tr: >-
    Sicilians, Güney Avrupa'dan bir Piyade ve Süvari uygarlığıdır.


    ## Sicilians Nasıl Oynanır


    **İdeal açılış (Karanlık → Kale):** İki ana yol işe yarar. Agresif yol, açgözlü rakipleri cezalandıran Donjon
    destekli bir all-in baskı build'i için Serjeant'lara hızlı Kale Çağı'dır. Daha güvenli ve esnek yol ise Kale Çağı'na
    sorunsuzca geçerken hareketli kalmana izin veren Spearmen destekli Scout açılışıdır.


    **İdeal geç oyun kompozisyonu:** Altın çekirdeğin olarak Hauberk Cavalier'a yerleş; yanına ucuz menzilli trash
    olarak Skirmisher'lar ve binaları kırmak için Trebuchet'ler ekle. Uygulanabilir bir alternatif olarak süvariyi
    Halberdier'ler ve Trebuchet'lerle desteklenen Serjeant'larla değiştirebilirsin.


    **Deathball kompozisyonu (kapalı haritalar / takım maçları):** Ön hat olarak kitlesel Serjeant'lar kullan, onları
    menzilli destek için Scorpion-Corps genitour'larıyla perdele ve ilerlerken tahkimatları yıkmak için Trebuchet ekle.


    **Önerilen build:** [Scout Rush](/tr/builds/18pop-scouts/)
