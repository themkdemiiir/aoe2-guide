intro:
  en: >-
    Reach Feudal at 17 pop, march ten villagers forward, and choke the enemy economy under a chain of cheap,
    garrison-stuffed Teuton towers.
  tr: >-
    17 köylüde Feudal'e geç, on köylüyü ileri yürüt ve rakibin ekonomisini ucuz, içi köylü dolu Teuton kulelerinden
    oluşan bir zincirle boğ.
strategy:
  en:
    - >-
      This is a committal opening, so scouting comes before the click-up: locate the enemy first so your ten forward
      villagers land on their resources instead of marching into walls or open map.
    - >-
      Teutons are the definitive tower civilization — their towers are cheaper, garrison up to ten villagers, and fire
      back hard, so a Teuton tower reliably wins any tower-versus-tower exchange and is painful to dislodge.
    - >-
      Hold every eco upgrade (Double-Bit Axe, Horse Collar) until the first tower is up; standing stone and bodies on
      the front line matter far more than economy polish this early.
    - >-
      Once the first tower stands, keep walking: chain towers 6–8 tiles apart to peel the enemy off each food and wood
      patch in turn and slowly suffocate their gathering.
    - >-
      If they wall up before you arrive, roll the pressure into Castle Age — a forward Stable for Knights or a Siege
      Workshop with Mangonels behind your tower line keeps them pinned.
    - >-
      Pull wounded villagers inside a tower to save them, and never let home production idle; the rush only pays off if
      your Town Center keeps pumping while the towers go up.
  tr:
    - >-
      Bu, tam bağlılık gerektiren bir açılış olduğundan scout etmek tıklamadan önce gelir: önce rakibi bul ki on ileri
      köylün duvara ya da boş haritaya değil, doğrudan kaynaklarının üzerine insin.
    - >-
      Teutonlar tartışmasız kule medeniyetidir — kuleleri daha ucuzdur, on köylüye kadar içeri alır ve sert karşılık
      verir; bu yüzden bir Teuton kulesi kuleye karşı kule savaşını güvenle kazanır ve sökülmesi son derece zordur.
    - >-
      İlk kule dikilene kadar tüm eko geliştirmelerini (Double-Bit Axe, Horse Collar) beklet; bu erken aşamada cephedeki
      taş ve köylüler, ekonomi cilasından çok daha önemlidir.
    - >-
      İlk kule dikildiğinde ilerlemeyi sürdür: kuleleri 6–8 kare aralıkla zincirleyerek rakibi her yemek ve odun
      alanından sırayla kopar ve toplamasını yavaşça boğ.
    - >-
      Sen gelmeden duvar çekerlerse baskıyı Castle Age'e taşı — ileride bir Stable ile Knight ya da kule hattının
      arkasında bir Siege Workshop ile Mangonel onları sabit tutar.
    - >-
      Yaralı köylüleri kuleye alarak kurtar ve evdeki üretimi asla boş bırakma; bu baskın yalnızca kuleler dikilirken
      Town Center'ın üretmeye devam ederse karşılığını verir.
