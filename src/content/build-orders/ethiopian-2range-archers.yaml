    assign:
      en: 6 → sheep under the TC
      tr: 6 → TC altındaki koyunlara
    icons:
      - food
      - town-center
  - villagers: 8
    assign:
      en: +2 → wood; build a house with one of them
      tr: +2 → oduna; biriyle bir ev yap
    icons:
      - wood
      - house
  - villagers: 9
    assign:
      en: +1 → lure the first boar
      tr: +1 → ilk yaban domuzunu çek
    note:
      en: With the scout, lure 1–3 deer once all sheep are found
