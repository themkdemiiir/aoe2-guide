      - bow-saw
      - lumber-camp
intro:
  en: >-
    Land in Feudal at 18 pop and open two Archery Ranges at once, leaning on Ethiopia's faster Archers and free age-up
    resources to flood the flank with arrows.
  tr: >-
    18 nüfusta Feudal'a geç ve aynı anda iki Okçu Menzili aç; Etiyopya'nın hızlı Okçuları ve bedava çağ atlama
    kaynaklarına yaslanarak kanadı ok yağmuruna tut.
strategy:
  en:
    - >-
      This is a flank build for team games: the objective is to get as many Archers as possible right away. Two ranges
      from the start means double the Archer output, and Ethiopia's faster Archers kite Skirmishers and disengage from
      Scouts better than a generic ranged opening. Easiest with Ethiopians — slower civs usually go up at 20 pop instead.
    - >-
      The Dark Age is hunt-heavy — one boar, a deer lure, then a second boar — so you reach Feudal with almost no wood
      banked. Get the new lumber camp and straggler vils onto wood immediately or Archer production will stall.
    - >-
      You deliberately sacrifice economy in favor of army. Seven villagers go to gold in Feudal so Fletching lands fast
      and you never run dry feeding two ranges; Ethiopia's free +100 food and +100 gold on each age-up cushions the heavy
      military spend and speeds the click to Castle.
    - >-
      Add berries and farms only as your hunt expires, and use the Market to reach Castle Age faster by selling stone.
      The goal is to win in Feudal or early Castle — or build such a lead that you can fall back, add economy, and win
      later. If you're short on food, keep adding villagers to whatever resource you need.
    - >-
      In Castle Age go straight for Crossbow and Bodkin Arrow with Bow Saw to keep the wood flowing; a second lumber camp
      on six vils sustains the mass. Keep attacking but don't lose your Archers, and let your pocket ally's Scouts cover
      your weakness to Skirmishers.
  tr:
    - >-
      Bu, takım oyunları için bir kanat build'idir: amaç hemen mümkün olduğunca çok Okçu çıkarmaktır. Baştan iki menzil,
      iki kat Okçu üretimi demektir ve Etiyopya'nın hızlı Okçuları Skirmisher'ları kitelemek ve Scout'lardan kaçmak için
      normal bir menzilli açılıştan daha iyidir. En kolayı Etiyopya iledir — yavaş uygarlıklar genelde 20 nüfusta çıkar.
    - >-
      Karanlık Çağ av ağırlıklıdır — bir yaban domuzu, bir geyik çekme, sonra ikinci yaban domuzu — bu yüzden Feudal'a
      neredeyse hiç biriktirilmiş odun olmadan ulaşırsın. Yeni kütük kampını ve ayrık ağaç köylülerini hemen oduna
      geçir, yoksa Okçu üretimi tıkanır.
    - >-
      Ordu uğruna ekonomiyi bilerek feda edersin. Feudal'da yedi köylü altına gider; böylece Fletching hızlı tamamlanır
      ve iki menzili beslerken hiç kurumazsın. Etiyopya'nın her çağ atlayışında verdiği bedava +100 yiyecek ve +100 altın,
      ağır askeri harcamayı yumuşatır ve Castle tıklamasını hızlandırır.
    - >-
      Meyve ve tarlaları yalnızca avın tükendikçe ekle ve Pazar'ı kullanarak taş satıp Castle Çağı'na daha hızlı ulaş.
      Amaç Feudal'da ya da erken Castle'da kazanmak — ya da geri çekilip ekonomi ekleyerek sonradan kazanabileceğin kadar
      büyük bir üstünlük kurmaktır. Yiyecek sıkıntısı çekersen, ihtiyacın olan kaynağa köylü eklemeye devam et.
    - >-
      Castle Çağı'nda doğrudan Crossbow ve Bodkin Arrow'a git, odunu akıtmak için Bow Saw'ı da al; altı köylüyle ikinci
      bir kütük kampı kitleyi besler. Saldırmaya devam et ama Okçularını kaybetme ve cep müttefikinin Scout'larının
      Skirmisher zaafını kapatmasına izin ver.
source:
  author: Hera
