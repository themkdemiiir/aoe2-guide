      tr: "Castle'da: Double-Bit Axe, Gold Mining, Bow Saw araştır; Crossbow + Bodkin Arrow"
    note:
      en: Drop a second lumber camp with 6 vils; keep attacking but don't lose your Archers
      tr: 6 köylüyle ikinci bir kütük kampı kur; saldırmaya devam et ama Okçularını kaybetme
    icons:
