      tr: 2 Okçu Menzili kur ve Okçu üret; 1 menzil köylüsü → Demirci, diğeri → yiyecek
    icons:
      - archery-range
      - archer
      - blacksmith
  - villagers: 25
    assign:
      en: +7 → gold; move 2 stragglers → food; research Fletching and attack
      tr: +7 → altına; 2 ayrık ağaç köylüsü → yiyecek; Fletching araştır ve saldır
    icons:
      - gold
      - fletching
  - villagers: 31
    assign:
      en: +6 → berries; add farms as the sheep run out
      tr: +6 → meyvelere; koyunlar bitince tarla ekle
    icons:
      - food
      - farm
  - villagers: 33
    assign:
      en: +2 → wood
      tr: +2 → oduna
    icons:
      - wood
  - villagers: 36
    assign:
      en: +3 → gold; build a Market and sell stone to click up to Castle
