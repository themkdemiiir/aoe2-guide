      tr: +6 → TC altındaki ava
    note:
      en: Lure the second boar during this time
      tr: Bu sırada ikinci yaban domuzunu çek
    icons:
      - food
      - town-center
  - villagers: 16
    assign:
      en: +1 → gold, build a mining camp
      tr: +1 → altına, bir maden kampı yap
    icons:
      - gold
      - mining-camp
  - villagers: 18
    assign:
      en: +2 → hunt under the TC; research Loom
      tr: +2 → TC altındaki ava; Loom araştır
