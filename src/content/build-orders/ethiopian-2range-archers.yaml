      tr: İdeal varış zamanı 8:50
    icons:
      - loom
  - villagers: 18
    assign:
      en: 7 from the TC → lumber camp; 2 → barracks + house; 2 → straggler trees
      tr: TC'den 7 → kütük kampı; 2 → kışla + ev; 2 → ayrık ağaçlar
