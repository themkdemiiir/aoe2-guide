intro:
  en: >-
    Open with Scout Cavalry to grab map control in Feudal, wall up safely, then snowball into massed Cavalry Archers —
    and the Mangudai upgrade for Mongols — in Castle Age.
  tr: >-
    Feudal çağda Süvarilerle harita kontrolünü ele geçir, üssünü güvenle duvarla ve ardından Castle çağda yığınla Atlı
    Okçuya — Moğollar için Mangudai yükseltmesine — geçiş yap.
strategy:
  en:
    - >-
      The Feudal Scouts are a screen, not the win condition: their job is to deny the enemy map control and buy time
      while you wall fully. Do not over-commit them into Spearmen or Skirmishers.
    - >-
      Walling is the linchpin. Cavalry Archers are fragile while massing, so a sealed base lets you tech up and build
      numbers behind cover before pushing out.
    - >-
      Roll Scout production straight into the Stable's eco upgrades, then pivot all your gold into the Archery Ranges
      the moment you hit Castle Age.
    - >-
      For Mongols specifically, beeline the Mangudai upgrade — the faster firing rate and anti-siege bonus turn the
      Cavalry Archer mass into a top-tier composition.
    - >-
      Hard counters to respect: Skirmishers and Camels both shred the archer line, so keep moving, kite carefully, and
      add Hussars or Halberdiers as a melee screen for the late game.
    - >-
      If you cannot wall in time, abandon the Cavalry Archer plan, keep producing Bloodlines Scouts, and lean on the eco
      lead instead.
  tr:
    - >-
      Feudal Süvariler asıl kazanma planın değil, bir perdedir: görevleri düşmanın harita kontrolünü engellemek ve sen
      üssü tamamen duvarlarken zaman kazandırmaktır. Onları Mızrakçı veya Okçulara karşı fazla harcama.
    - >-
      Duvarlamak işin can damarıdır. Atlı Okçular yığılırken kırılgandır; kapalı bir üs, dışarı çıkmadan önce
      teknolojiye yatırım yapıp sayı toplamana imkân verir.
    - >-
      Süvari üretimini doğrudan Ahır'ın ekonomi yükseltmelerine yönlendir, sonra Castle çağa geçtiğin an tüm altını Okçu
      Menzillerine aktar.
    - >-
      Özellikle Moğollar için Mangudai yükseltmesine doğrudan git — daha hızlı atış hızı ve kuşatmaya karşı bonus, Atlı
      Okçu yığınını üst sınıf bir kompozisyona dönüştürür.
    - >-
      Dikkat etmen gereken sert karşı birimler var: hem Okçu Avcıları (Skirmisher) hem de Develer atlı okçu hattını
      biçer; bu yüzden sürekli hareket halinde kal, dikkatlice kite et (vur-kaç) ve geç oyun için yakın dövüş perdesi
      olarak Hussar veya Halberdier ekle.
    - >-
      Zamanında duvarlayamazsan Atlı Okçu planından vazgeç, Bloodlines'lı Süvari üretmeye devam et ve bunun yerine
      ekonomi avantajına yaslan.
