      - wheelbarrow
intro:
  en: >-
    Open with Scout Cavalry off an 18-pop Feudal landing, then layer in Skirmishers the moment the opponent shows
    Archers, giving you a cheap answer to both ranged play and Spearman responses.
  tr: >-
    18 köylülük bir Feudal inişiyle Scout Cavalry baskısı başlat, ardından rakip Archers gösterir göstermez Skirmisher
    ekleyerek hem menzilli oyuna hem de Spearman tepkisine ucuz bir yanıt elde et.
strategy:
  en:
    - >-
      Scouts come first to pressure villagers and force a reaction; the Skirmisher switch is reactive, so only commit to
      the Range once you actually see the enemy leaning on Archers.
    - >-
      Skirmishers are gold-free and hard-counter Archers, so this opening shrugs off the most common Feudal aggression
      while your Scouts keep punishing anything that steps outside walls.
    - >-
      Keep the economy on wood and food early — Skirmishers and Scouts cost no gold, which lets you delay the gold move
      until berries are spent and you split 6 onto a Mining Camp.
    - >-
      Blacksmith into Fletching plus infantry armor is the key power-spike: it lifts your Skirmishers above the enemy's
      Archers and keeps your Scouts alive in the skirmish.
    - >-
      Franks, Huns, Malians, and Lithuanians all fit: Franks for hardier cavalry and free farm upgrades, Huns for
      skipping houses, Malians for cheaper farming, and Lithuanians for the early food bonus that speeds the whole
      opening.
    - >-
      In Castle Age this transitions cleanly into Elite Skirmishers backed by Knights — the Skirmishers screen against
      Crossbows while the Knights provide the punch your gold-light Feudal lacked.
  tr:
    - >-
      Önce Scouts gelir; köylülere baskı yapıp rakibi tepki vermeye zorlar. Skirmisher geçişi tepkiseldir, bu yüzden
      Range'i ancak rakibin gerçekten Archers'a yaslandığını gördüğünde kur.
    - >-
      Skirmisher'lar altın gerektirmez ve Archers'ı sert şekilde sayar; böylece bu açılış en yaygın Feudal saldırısını
      rahatça savuşturur, bu sırada Scouts duvar dışına çıkan her şeyi cezalandırmaya devam eder.
    - >-
      Ekonomiyi erken dönemde odun ve yiyecekte tut — Skirmisher ve Scouts hiç altın harcamaz, bu da altına geçişi meyve
      tükenip 6 köylüyü Mining Camp'e bölene kadar ertelemene izin verir.
    - >-
      Blacksmith'in ardından Fletching ve piyade zırhı asıl güç sıçramasıdır: Skirmisher'larını rakibin Archers'ının
      üzerine çıkarır ve çatışmada Scouts'unu hayatta tutar.
    - >-
      Franks, Huns, Malians ve Lithuanians bu açılışa uyar: Franks daha dayanıklı süvari ve bedava tarla yükseltmeleri
      için, Huns ev kurmayı atladığı için, Malians ucuz tarımı için, Lithuanians ise tüm açılışı hızlandıran erken
      yiyecek bonusu için.
    - >-
      Castle Age'de bu, Knights destekli Elite Skirmisher'a temiz şekilde geçer — Skirmisher'lar Crossbow'lara karşı
      perde olurken, Knights altın-fakiri Feudal'ında eksik kalan vurucu gücü sağlar.
