      - mill
      - food
  - villagers: 16
    assign:
      en: +5 → hunt under the Town Center
      tr: +5 → Town Center altında avda
    note:
      en: Lure the deer with your scout and bring in the second boar to stretch your food
      tr: Yiyeceği uzatmak için scout ile geyikleri sür ve ikinci domuzu da getir
    icons:
      - food
  - villagers: 19
    assign:
      en: +3 → berries
      tr: +3 → meyveye
    icons:
