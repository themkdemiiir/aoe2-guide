      tr: +2 → oduna; Loom araştır ve Feudal'a çağ atla
    note:
      en: Perfect Feudal landing 9:13 on 5 wood / 16 food — Malay's faster age-up keeps you roughly 2 villagers ahead
      tr: >-
        Mükemmel Feudal inişi 9:13, 5 odun / 16 yiyecek ile — Malay'ın hızlı çağ atlaması seni kabaca 2 köylü önde
        tutar
    icons:
      - wood
      - loom
  - villagers: 21
    assign:
      en: Send 5 from hunt → wood for a second lumber camp, and pull 1 from hunt to build a Barracks so it is ready the moment you hit Feudal — earlier than other civs
      tr: Avdan 5 köylüyü → oduna gönderip ikinci bir lumber camp kur ve avdan 1 köylü alıp bir Barracks dik, böylece Feudal'a ulaştığın an hazır olur — diğer uygarlıklardan önce
    icons:
      - wood
      - lumber-camp
      - barracks
  - assign:
      en: "Fork A — Archers: build one Archery Range and start Archers, moving 4 villagers → gold"
      tr: "Yol A — Archers: bir Archery Range kur ve Archers üret, 4 köylüyü → altına taşı"
    icons:
      - archery-range
      - archer
      - gold
  - assign:
      en: "Fork B — Scouts: build a Stable and pump Scout Cavalry to harass the eco"
      tr: "Yol B — Scouts: bir Stable kur ve rakibin ekonomisini taciz etmek için Scout Cavalry bas"
    icons:
      - stable
      - scout-cavalry
  - assign:
      en: "Fork C — Spear-Skirm: produce Spearmen and Skirmishers, leaning on Malay's free infantry armor"
      tr: "Yol C — Spear-Skirm: Malay'ın bedava piyade zırhına dayanarak Spearman ve Skirmisher üret"
    icons:
