    assign:
      en: 6 → sheep under the Town Center
      tr: 6 → Town Center altında koyunda
    icons:
      - food
      - town-center
  - villagers: 9
    assign:
      en: +3 → wood, drop a lumber camp
      tr: +3 → oduna, lumber camp kur
    icons:
      - wood
      - lumber-camp
  - villagers: 10
    assign:
      en: +1 → lure the first boar
      tr: +1 → ilk domuzu çek
    icons:
      - food
  - villagers: 11
    assign:
      en: +1 → build a house, then a mill on berries
      tr: +1 → bir ev, sonra meyvenin yanına mill kur
    icons:
