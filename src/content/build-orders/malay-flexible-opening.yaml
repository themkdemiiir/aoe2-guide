      - skirmisher
  - assign:
      en: Add farms as the hunt runs out and research Double-Bit Axe (Horse Collar optional); once your chosen military is online, build a Blacksmith and research Fletching
      tr: Av tükenirken tarla ekle ve Double-Bit Axe araştır (Horse Collar isteğe bağlı); seçtiğin ordu hazır olunca bir Blacksmith kur ve Fletching araştır
    icons:
      - farm
      - double-bit-axe
      - blacksmith
      - fletching
intro:
  en: >-
    Reach Feudal a step ahead of the field on Malay's faster age-up, then commit to Archers, Scouts, or Spear-Skirm only
    after you read what the opponent is doing.
  tr: >-
    Malay'ın hızlı çağ atlamasıyla Feudal'a rakiplerinden bir adım önde ulaş, ardından rakibin ne yaptığını okuduktan
    sonra Archers, Scouts ya da Spear-Skirm'e karar ver.
strategy:
  en:
    - >-
      Malay's cheaper, faster age-up is the whole point: the same villager flow lands Feudal around 9:13 while leaving
      you roughly two villagers ahead of a standard opener, and that surplus is what funds the early Barracks and the
      follow-up of your choice.
    - >-
      Keep your options open through the early Barracks — it is built before you have decided anything, so whichever
      fork you pick is producing the moment you spot the enemy's plan.
    - >-
      Fork A (Archers): drop a single Range and shift four villagers to gold for a clean Archer line; this is the
      default answer when the opponent leans on infantry or stays passive.
    - >-
      Fork B (Scouts): a Stable and Scout Cavalry punish greedy economies and unwalled flanks, buying time to transition
      once the harass has done its work.
    - >-
      Fork C (Spear-Skirm): Malay's free infantry armor makes Spearman-plus-Skirmisher unusually durable, a cheap
      gold-light wall against enemy Archers and Scouts.
    - >-
      Whichever branch you take, the +2 villager edge compounds: farms in behind a fast Blacksmith and Fletching let you
      spike into a faster Castle or Imperial Age than your opponent can match.
  tr:
    - >-
      Malay'ın daha ucuz ve daha hızlı çağ atlaması işin tüm özüdür: aynı köylü akışı Feudal'a yaklaşık 9:13'te indirir
      ve seni standart bir açılışa göre kabaca iki köylü önde bırakır; bu fazlalık erken Barracks'ı ve seçtiğin devamı
      finanse eder.
    - >-
      Seçeneklerini erken Barracks ile açık tut — daha hiçbir şeye karar vermeden kurulur, böylece hangi yolu seçersen
      seç rakibin planını gördüğün an üretim başlar.
    - >-
      Yol A (Archers): tek bir Range kur ve temiz bir Archer hattı için dört köylüyü altına kaydır; bu, rakip piyadeye
      yaslandığında ya da pasif kaldığında varsayılan yanıttır.
    - >-
      Yol B (Scouts): bir Stable ve Scout Cavalry, açgözlü ekonomileri ve duvarsız kanatları cezalandırır; taciz işini
      görene kadar geçiş için zaman kazandırır.
    - >-
      Yol C (Spear-Skirm): Malay'ın bedava piyade zırhı, Spearman artı Skirmisher kombinasyonunu olağandışı derecede
      dayanıklı kılar; rakip Archers ve Scouts'a karşı ucuz, az altın gerektiren bir duvardır.
    - >-
      Hangi yolu seçersen seç, +2 köylü avantajı katlanarak büyür: hızlı bir Blacksmith ve Fletching arkasına ekilen
      tarlalar, rakibinin yetişemeyeceği kadar hızlı bir Castle veya Imperial çağ sıçraması yapmanı sağlar.
