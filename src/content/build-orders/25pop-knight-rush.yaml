intro:
  en: Reach Castle Age on a clean economy and flood Knights from two Stables for a forgiving, high-impact attack.
  tr: Temiz bir ekonomiyle Castle çağına geç ve iki Ahırdan Şövalye yağdırarak affedici, yüksek etkili bir saldırı kur.
strategy:
  en:
    - >-
      This is the most beginner-friendly aggressive opener: your eco runs on a tidy sheep-boar-berry-then-farms loop, so
      you can focus on macro instead of micro while you bank toward Castle Age.
    - >-
      Two Stables let you keep Knights coming non-stop. Knights are tanky, fast, and punish unwalled lumber camps and
      gold miners, so raid the moment the first one pops.
    - >-
      Get Double-Bit Axe and Horse Collar to keep wood and farm income healthy, then add Bow Saw — sustained eco
      upgrades matter more than rushing extra military buildings here.
    - >-
      Bloodlines is a big Knight power spike for most of these civs; Franks skip it because their team-wide +20% Knight
      HP already covers the gap.
    - >-
      Knights fold to Pikemen and Camel Riders, so scout for spears. When you see mass anti-cavalry, stop force-feeding
      Knights and mix in Skirmishers, a Siege Workshop, or a second Town Center to out-boom instead.
    - >-
      Magyars, Slavs, Berbers, and Huns each sweeten the plan (cheaper or faster Knights, free Houses, cheaper eco), but
      the order is identical for all five.
  tr:
    - >-
      Bu, yeni başlayanlar için en uygun saldırı açılışıdır: ekonomin düzenli bir koyun-domuz-meyve-sonra-tarla
      döngüsünde döner, böylece Castle çağına para biriktirirken mikro yerine makroya odaklanabilirsin.
    - >-
      İki Ahır, Şövalyelerin durmadan gelmesini sağlar. Şövalyeler dayanıklı ve hızlıdır; duvarsız kereste kamplarını ve
      altın madencilerini cezalandırır, bu yüzden ilk Şövalye çıkar çıkmaz baskına git.
    - >-
      Odun ve tarla gelirini sağlam tutmak için Double-Bit Axe ile Horse Collar al, ardından Bow Saw ekle — burada
      ekstra askeri bina dikmekten çok sürekli ekonomi yükseltmeleri önemlidir.
    - >-
      Bloodlines çoğu uygarlık için büyük bir Şövalye güç sıçramasıdır; Franks bunu atlar çünkü takım geneli +%20
      Şövalye canı bu açığı zaten kapatır.
    - >-
      Şövalyeler Mızraklılara (Pikeman) ve Develilere (Camel Rider) karşı erir, bu yüzden mızrak birimleri için keşif
      yap. Yığınla süvari karşıtı birim görünce Şövalye basmayı zorlamayı bırak; Skirmisher, bir Kuşatma Atölyesi ya da
      ikinci bir Ana Bina ile booma geçerek üstünlük kur.
    - >-
      Magyars, Slavs, Berbers ve Huns'un her biri planı tatlandırır (daha ucuz ya da daha hızlı Şövalye, bedava Ev, daha
      ucuz ekonomi), ama düzen beşinde de aynıdır.
