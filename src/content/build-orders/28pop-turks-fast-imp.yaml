intro:
  en: Rush to Imperial Age around the 20-minute mark and flood the field with instant gunpowder.
  tr: Yaklaşık 20. dakikada İmparatorluk Çağı'na koş ve sahayı anında barutlu birliklerle doldur.
strategy:
  en:
    - >-
      This is a greedy, economy-first plan: no Feudal or Castle military, just a clean climb to Imperial powered by
      selling stone and a fast gold transition. It rewards a safe or walled base where the passive economy is hard to
      punish.
    - >-
      Turks get Chemistry for free, so Hand Cannoneers and Bombard Cannons arrive the instant you hit Imperial — there
      is no awkward gunpowder research delay. Pump Hand Cannoneers from the two Archery Ranges and add one or two
      Bombard Cannons for siege.
    - >-
      Keep buying wood and seeding Farms through the transition; your bottleneck is wood for production buildings, not
      food. The free, faster gold mining keeps a heavy gunpowder army affordable.
    - >-
      Use the Monastery to heal damaged Hand Cannoneers and pick up a relic or two for trickle gold. Protect the Bombard
      Cannons at all costs — losing them stalls your siege answer.
    - >-
      Weak to early Feudal or Castle aggression that cracks the unwalled economy, and to mass Mangonels or Siege Onagers
      that punish clumped Hand Cannoneers. Spread your gunpowder and add Light Cavalry to snipe enemy siege.
  tr:
    - >-
      Bu açgözlü, ekonomi öncelikli bir plandır: Feudal veya Castle'da asker yoktur, sadece taş satışı ve hızlı altın
      geçişiyle desteklenen temiz bir İmparatorluk tırmanışı vardır. Pasif ekonominin cezalandırılmasının zor olduğu
      güvenli veya duvarlı bir üs ister.
    - >-
      Türkler Chemistry'yi ücretsiz aldığı için, İmparatorluk'a basar basmaz El Topçusu ve Bombard Cannon hazır gelir —
      barut araştırması için sıkıntılı bir bekleme yoktur. İki Archery Range'den El Topçusu bas, kuşatma için bir veya
      iki Bombard Cannon ekle.
    - >-
      Geçiş boyunca odun almaya ve Farm ekmeye devam et; darboğazın yiyecek değil, üretim binaları için odundur.
      Ücretsiz ve daha hızlı altın madenciliği, ağır barut ordusunu karşılanabilir kılar.
    - >-
      Hasarlı El Topçularını iyileştirmek için Manastır'ı kullan ve damlama altın için bir iki kalıntı topla. Bombard
      Cannon'ları ne pahasına olursa olsun koru — onları kaybetmek kuşatma cevabını durdurur.
    - >-
      Duvarsız ekonomiyi kıran erken Feudal veya Castle saldırılarına ve kümelenmiş El Topçularını cezalandıran toplu
      Mangonel veya Siege Onager'a karşı zayıftır. Barutunu yay ve düşman kuşatmasını avlamak için Light Cavalry ekle.
