slug: fc-knights-pocket
name:
  en: Fast Castle 2-Stable Knights (Pocket)
  tr: Fast Castle 2-Stable Knights (Pocket)
difficulty: intermediate
targetAge: castle
durationMin: 17
civsRecommended:
  - franks
  - lithuanians
  - berbers
  - huns
  - magyars
steps:
  - villagers: 6
    assign:
      en: 6 → sheep under TC
      tr: 6 → TC altında koyun
    icons:
      - food
  - villagers: 9
    assign:
      en: +3 → wood, build lumber camp
      tr: +3 → odun, Lumber Camp kur
    icons:
      - wood
      - lumber-camp
  - villagers: 12
    assign:
      en: +3 → berries, build mill
      tr: +3 → böğürtlen, Mill kur
    icons:
      - food
      - mill
  - villagers: 15
    assign:
      en: +3 → wood
      tr: +3 → odun
    icons:
      - wood
  - villagers: 23
    assign:
      en: +8 food/wood mix; click Feudal at 22–23 pop
      tr: +8 yiyecek/odun karışımı; 22–23 nüfusta Feodal'a tıkla
    icons:
      - food
      - wood
  - villagers: 23
    assign:
      en: "Feudal: build Blacksmith + Market; 4 → gold (mining camp)"
      tr: "Feodal: Blacksmith + Market kur; 4 → altın (Mining Camp)"
    icons:
      - blacksmith
      - market
      - gold
  - villagers: 28
    assign:
      en: +5; click Castle Age; add farms during transition
      tr: +5; Kale Çağı'na tıkla; geçiş sırasında çiftlik ekle
    icons:
      - farm
  - villagers: 30
    assign:
      en: "Castle: build 2 Stables; produce Knights non-stop"
      tr: "Kale: 2 Stable kur; Knight üretimini kesme"
    icons:
      - stable
      - knight
  - villagers: 32
    assign:
      en: +2 → gold; research Bloodlines + Forging
      tr: +2 → altın; Bloodlines + Forging araştır
    icons:
      - gold
      - bloodlines
intro:
  en: >-
    **Goal:** Boom to ~28–30 villagers, arrive in Castle Age, then flood Knights from 2 Stables to support your team's
    flanks. **Recommended civs:** Franks (Chivalry extra HP), Lithuanians (relics boost attack), Berbers (faster
    cavalry), Huns (no houses), Magyars (free Husbandry)
  tr: >-
    **Hedef:** ~28–30 köylüye kadar boom yap, Kale Çağı'na ulaş, ardından 2 Stable'dan Knight dök ve takım
    arkadaşlarının flank'larını destekle. **Önerilen medeniyetler:** Franks (Chivalry ekstra can), Lithuanians
    (emanetler saldırıyı artırır), Berbers (daha hızlı süvari), Huns (ev gerekmez), Magyars (ücretsiz Husbandry)
strategy:
  en:
    - 6 villagers on sheep
    - 3 villagers on wood; Lumber Camp
    - 3 villagers to berries; Mill
    - 3 more villagers to wood (15 total)
    - 8 more villagers to food/wood split (23 total)
    - Research Loom
    - Build Blacksmith + Market
    - 4 villagers to gold; Mining Camp
    - Continue TC production to 28–30 villagers
    - Build Farms; research Double-Bit Axe
    - Build 2 Stables simultaneously
    - Research Bloodlines (HP upgrade for Knights)
    - Produce Knights non-stop from both Stables
    - Research Forging + Scale Barding Armor
    - Add 2 more gold villagers as queue grows
    - Send Knights to support flanks or raid opponent pockets
    - >-
      **Weak against:** Spearman + Archer combinations; Camel civs (Saracens, Hindustanis, Gurjaras) hard-counter
      Knights.
    - "**Strong against:** Any army without Spearmen or Camels; Crossbow-heavy flanks that need cavalry support."
  tr:
    - 6 köylü koyuna
    - 3 köylü oduna; Lumber Camp
    - 3 köylü böğürtlene; Mill
    - 3 köylü daha oduna (toplamda 15)
    - 8 köylü daha yiyecek/odun bölüşümüne (toplamda 23)
    - Loom araştır
    - Blacksmith + Market kur
    - 4 köylü altına; Mining Camp
    - TC üretimini 28–30 köylüye kadar sürdür
    - Çiftlik kur; Double-Bit Axe araştır
    - Aynı anda 2 Stable kur
    - Bloodlines araştır (Knight'lar için can yükseltmesi)
    - Her iki Stable'dan da durmadan Knight üret
    - Forging + Scale Barding Armor araştır
    - Kuyruk büyüdükçe 2 köylü daha altına ekle
    - Knight'ları flank'ları desteklemeye ya da rakip pocket'ları basmaya gönder
    - >-
      **Zayıf olduğu yerler:** Spearman + Archer kombinasyonları; Camel medeniyetleri (Saracens, Hindustanis, Gurjaras)
      Knight'lara karşı güçlü counter'dır.
    - >-
      **Güçlü olduğu yerler:** Spearman veya Camel içermeyen her ordu; süvari desteğine ihtiyaç duyan Crossbow ağırlıklı
      flank'lar.
