slug: fc-knights-pocket
name:
  en: Fast Castle 2-Stable Knights (Pocket)
  tr: Hızlı Kale 2-Stable Knights (Pocket)
difficulty: intermediate
targetAge: castle
durationMin: 17
civsRecommended:
  - franks
  - lithuanians
  - berbers
  - huns
  - magyars
steps:
  - villagers: 6
    assign:
      en: 6 → sheep under TC
      tr: 6 → TC altında koyun
    icons:
      - food
  - villagers: 10
    assign:
      en: +4 → wood, build Lumber Camp
      tr: +4 → odun, Lumber Camp kur
    icons:
      - wood
      - lumber-camp
  - villagers: 16
    assign:
      en: 1 lures boar; +5 → berries, build Mill (research Loom)
      tr: 1 köylü domuzu çeker; +5 → böğürtlen, Mill kur (Loom araştır)
    icons:
      - food
      - mill
  - villagers: 24
    assign:
      en: +2 → farms, +6 → wood (2nd Lumber Camp)
      tr: +2 → çiftlik, +6 → odun (2. Lumber Camp)
    icons:
      - farm
      - wood
  - villagers: 27
    assign:
      en: +3 → gold (Mining Camp); click Feudal at 27 (~10:00)
      tr: +3 → altın (Mining Camp); 27'de Feodal'a tıkla (~10:00)
    icons:
      - gold
  - villagers: 27
    phase: feudal
    time: "10:00"
    assign:
      en: "Feudal: build Barracks, Stable + Blacksmith; research Double-Bit Axe + Horse Collar"
      tr: "Feodal: Barracks, Stable + Blacksmith kur; Double-Bit Axe + Horse Collar araştır"
    icons:
      - stable
      - blacksmith
  - villagers: 29
    assign:
      en: +2 → gold; move 2 berry villagers to farms; click Castle Age
      tr: +2 → altın; 2 böğürtlen köylüsünü çiftliğe al; Kale Çağı'na tıkla
    icons:
      - gold
      - farm
  - villagers: 29
    phase: castle
    time: "17:00"
    assign:
      en: "Castle: build 2nd Stable; train Knights non-stop from both; research Bloodlines"
      tr: "Kale: 2. Stable kur; her iki Stable'dan durmadan Knight üret; Bloodlines araştır"
    icons:
      - stable
      - knight
  - assign:
      en: Research Forging + Scale Barding Armor; add Knights and farms as gold allows
      tr: Forging + Scale Barding Armor araştır; altın yettikçe Knight ve çiftlik ekle
    icons:
      - knight
      - bloodlines
intro:
  en: >-
    **Goal:** Click Feudal at 27 villagers (~10:00), reach Castle Age around 17:00 with 29 villagers, then flood Knights
    from 2 Stables to support your team's flanks. **Recommended civs:** Franks (Chivalry extra HP), Lithuanians (relics
    boost attack), Berbers (faster cavalry), Huns (no houses), Magyars (free Husbandry)
  tr: >-
    **Hedef:** 27 köylüde Feodal'a tıkla (~10:00), 17:00 civarında 29 köylüyle Kale Çağı'na ulaş, ardından 2 Stable'dan
    Knight dök ve takım arkadaşlarının flank'larını destekle. **Önerilen medeniyetler:** Franks (Chivalry ekstra can),
    Lithuanians (emanetler saldırıyı artırır), Berbers (daha hızlı süvari), Huns (ev gerekmez), Magyars (ücretsiz
    Husbandry)
strategy:
  en:
    - 6 villagers on sheep
    - 4 villagers to wood; build Lumber Camp
    - Lure boar; 5 villagers to berries; build Mill; research Loom
    - 2 villagers to farms; 6 to wood; build a 2nd Lumber Camp
    - 3 villagers to gold; build Mining Camp; click Feudal at 27 (~10:00)
    - "Feudal: build Barracks, Stable + Blacksmith"
    - Research Double-Bit Axe + Horse Collar
    - Move 2 berry villagers to farms; 2 new villagers to gold; click Castle Age
    - Reach Castle Age around 17:00 with 29 villagers
    - "Castle: build a 2nd Stable; train Knights non-stop from both"
    - Research Bloodlines (HP upgrade for Knights)
    - Research Forging + Scale Barding Armor
    - Add Knights and farms as gold allows
    - Send Knights to support flanks or raid opponent pockets
    - >-
      **Weak against:** Spearman + Archer combinations; Camel civs (Saracens, Hindustanis, Gurjaras) hard-counter
      Knights.
    - "**Strong against:** Any army without Spearmen or Camels; Crossbow-heavy flanks that need cavalry support."
  tr:
    - 6 köylü koyuna
    - 4 köylü oduna; Lumber Camp kur
    - Domuzu çek; 5 köylü böğürtlene; Mill kur; Loom araştır
    - 2 köylü çiftliğe; 6 köylü oduna; 2. Lumber Camp kur
    - 3 köylü altına; Mining Camp kur; 27'de Feodal'a tıkla (~10:00)
    - "Feodal: Barracks, Stable + Blacksmith kur"
    - Double-Bit Axe + Horse Collar araştır
    - 2 böğürtlen köylüsünü çiftliğe al; 2 yeni köylüyü altına; Kale Çağı'na tıkla
    - 17:00 civarında 29 köylüyle Kale Çağı'na ulaş
    - "Kale: 2. Stable kur; her iki Stable'dan durmadan Knight üret"
    - Bloodlines araştır (Knight'lar için can yükseltmesi)
    - Forging + Scale Barding Armor araştır
    - Altın yettikçe Knight ve çiftlik ekle
    - Knight'ları flank'ları desteklemeye ya da rakip pocket'ları basmaya gönder
    - >-
      **Zayıf olduğu yerler:** Spearman + Archer kombinasyonları; Camel medeniyetleri (Saracens, Hindustanis, Gurjaras)
      Knight'lara karşı güçlü counter'dır.
    - >-
      **Güçlü olduğu yerler:** Spearman veya Camel içermeyen her ordu; süvari desteğine ihtiyaç duyan Crossbow ağırlıklı
      flank'lar.
source:
  author: AoE Companion
  url: https://aoecompanion.com/build-guides/fast-castle-knights
