intro:
  en: >-
    **Goal:** Exploit Khmer's no-building-prerequisite bonus to skip Feudal structures entirely and slam into Castle Age
    (~13:30) with an aggressive Knight-and-Scorpion push.
  tr: >-
    **Amaç:** Khmer'in bina ön koşulu gerektirmeyen bonusunu kullanarak Feudal binalarını tamamen atla ve agresif bir
    Knight-Scorpion baskısıyla Castle Age'e (~13:30) gir.
strategy:
  en:
    - >-
      Khmer's signature trick: villagers never need to walk to a building to advance, so you click Castle the instant
      Feudal finishes without spending wood on a Barracks or Stable. That saved time and resources is the whole point of
      this build.
    - >-
      Defend the dangerous Feudal-to-Castle window with hidden houses and your Scout — you have no military yet, so
      position your Town Center and walls to deny easy villager kills.
    - >-
      The moment you reach Castle, build a Stable and Blacksmith together, take +1 cavalry armor, and start non-stop
      Knights; a forward Siege Workshop lets Scorpions clear massed archers and add map pressure.
    - >-
      Scorpions are the Khmer power spike here — their bonus damage shreds infantry and archer clumps while Knights
      punish anything that tries to close in.
    - >-
      **Weak against:** Camel and Pikeman compositions that hard-counter cavalry; an opponent who walls perfectly and
      matches your Castle timing with Crossbows plus Pikes.
    - >-
      **Follow-up:** Add Town Centers behind the push if it stalls, then transition toward Elite Battle Elephants or a
      relic-backed Monk play in the late game.
  tr:
    - >-
      Khmer'in imza numarası: köylülerin çağ atlamak için bir binaya yürümesi gerekmez, bu yüzden Feudal biter bitmez
      Barracks ya da Stable için odun harcamadan Castle'a tıklarsın. Kazanılan bu zaman ve kaynak, build'in tüm
      mantığını oluşturur.
    - >-
      Tehlikeli Feudal-Castle geçiş penceresini gizli evler ve Scout'unla savun — henüz askerin yok, bu yüzden Town
      Center ve duvarlarını köylü kaybını zorlaştıracak şekilde konumlandır.
    - >-
      Castle'a ulaşır ulaşmaz Stable ve Blacksmith'i birlikte kur, +1 süvari zırhı al ve durmadan Knight üretmeye başla;
      ileri bir Siege Workshop, Scorpion'ların okçu yığınlarını temizlemesini ve harita baskısı kurmasını sağlar.
    - >-
      Buradaki Khmer güç sıçraması Scorpion'lardır — bonus hasarları piyade ve okçu kümelerini biçerken Knight'lar
      yaklaşmaya çalışan her şeyi cezalandırır.
    - >-
      **Zayıf olduğu:** Süvariyi sert sayan Camel ve Pikeman kompozisyonları; mükemmel duvar çekip Crossbow + Pike ile
      senin Castle zamanlamana yetişen rakipler.
    - >-
      **Devamı:** Baskı tıkanırsa arkaya ek Town Center kur, ardından geç oyunda Elite Battle Elephant veya relic
      destekli Monk oyununa geçiş yap.
