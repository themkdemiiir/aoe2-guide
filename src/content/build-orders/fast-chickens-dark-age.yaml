slug: fast-chickens-dark-age
name:
  en: Fast Chickens Dark Age
  tr: Hızlı Tavuklu Dark Age
difficulty: intermediate
targetAge: feudal
durationMin: 9
civsRecommended: []
steps:
  - villagers: 5
    assign:
      en: 5 → sheep under the TC
      tr: 5 → TC altındaki koyunlara
    icons:
      - food
      - town-center
  - villagers: 8
    assign:
      en: +3 → build a mill on the chickens and gather them
      tr: +3 → tavukların üzerine değirmen kur ve tavukları topla
    note:
      en: Chickens give fast, dense food right next to the TC
      tr: Tavuklar TC'nin hemen yanında hızlı ve yoğun yiyecek verir
    icons:
      - mill
      - food
  - villagers: 9
    assign:
      en: +1 → back onto the sheep
      tr: +1 → tekrar koyunlara
    icons:
      - food
  - villagers: 10
    assign:
      en: +1 → send 1 villager to the first boar
      tr: +1 → 1 köylüyü ilk yaban domuzuna gönder
    icons:
      - food
  - villagers: 11
    assign:
      en: +1 → build a house, then chop a straggler tree
      tr: +1 → bir ev kur, sonra tek ağaçtan odun kes
    icons:
      - house
      - wood
  - villagers: 14
    assign:
      en: +3 → straggler trees near the TC
      tr: +3 → TC yakınındaki tek ağaçlara
    icons:
      - wood
  - villagers: 15
    assign:
      en: +1 → send 1 villager to the second boar
      tr: +1 → 1 köylüyü ikinci yaban domuzuna gönder
    icons:
      - food
  - assign:
      en: Drop a lumber camp on the 4 straggler-tree villagers
      tr: Tek ağaçlardaki 4 köylüye odun kampı kur
    note:
      en: No new villager — just relocate to a proper woodline
      tr: Yeni köylü yok — sadece düzgün bir ağaç hattına taşı
    icons:
      - lumber-camp
      - wood
  - villagers: 18
    phase: feudal
    time: "8:50"
    assign:
      en: +3 → hunt under the TC; research Loom, then click up to Feudal
      tr: +3 → TC altındaki ava; Loom araştır, sonra Feudal'a tıkla
    note:
      en: Land at 18 pop with a 4-wood / 14-food split
      tr: 18 nüfusta, 4 odun / 14 yiyecek dağılımıyla geç
    icons:
      - food
      - loom
  - assign:
      en: "Feudal: walk 6 villagers onto the berries with a mill so food keeps flowing"
      tr: "Feudal: 6 köylüyü değirmenle çilek çalılarına götür ki yiyecek akmaya devam etsin"
    icons:
      - food
      - mill
  - assign:
      en: Pick your feudal opening based on what your scout sees — scouts, archers, or man-at-arms all work from here
      tr: Feudal açılışını scout'unun gördüğüne göre seç — scout, okçu veya man-at-arms hepsi buradan çalışır
    icons:
      - scout-cavalry
      - archer
intro:
  en: >-
    A flexible 18-pop Arabia opener that uses the chickens by your Town Center for fast early food, landing in Feudal
    around 8:50, ready for any aggressive strategy.
  tr: >-
    Town Center'ının yanındaki tavukları erken yiyecek için kullanan, esnek bir 18 nüfus Arabia açılışı; yaklaşık
    8:50'de Feudal'a geçer ve her türlü agresif stratejiye hazır olursun.
strategy:
  en:
    - >-
      The whole point is tempo: a mill on the chickens early gives you dense food a few tiles from the TC, so villagers
      walk less and the TC never idles. Keep producing villagers nonstop until you click up.
    - >-
      This is an open template, not a committed plan. The 4-wood / 14-food landing lets you turn into scouts, archers,
      or a man-at-arms rush — let your scout's information decide before you commit buildings.
    - >-
      If you want man-at-arms or a drush, shift one extra villager to wood while you place the lumber camp (5 on wood)
      and go up one villager later at 19 pop, which pays for the barracks and early infantry.
    - >-
      In early Feudal, send roughly 6 villagers to the berries with a fresh mill. That stabilizes food while you re-task
      hunters to wood and gold for your chosen military.
    - >-
      Wall as your economy transitions, then react to what you see: add a stable against scouts, an archery range plus
      skirmishers against archers, or push militia across the map if you opened man-at-arms.
    - >-
      Civ notes: eco bonuses (Mayans extra villager, Aztecs faster gathering, Vikings cheaper economy) stretch the
      chicken food further, while Malians and Ethiopians convert cleanly into archer pressure thanks to their cheaper or
      faster ranged units.
  tr:
    - >-
      Tüm mesele tempo: tavukların üzerine erken kurulan değirmen, TC'den birkaç kare ötede yoğun yiyecek verir, böylece
      köylüler daha az yürür ve TC asla boş kalmaz. Yukarı tıklayana kadar durmadan köylü üret.
    - >-
      Bu bağlayıcı bir plan değil, açık bir şablondur. 4 odun / 14 yiyecek geçişi sana scout, okçu veya man-at-arms
      baskısına dönme imkânı verir — bina dikmeden önce kararı scout'unun bilgisi versin.
    - >-
      Man-at-arms veya drush istiyorsan, odun kampını kurarken bir köylüyü daha oduna kaydır (5 odun) ve bir köylü geç,
      19 nüfusta yukarı çık; bu, kışla ve erken piyade masrafını karşılar.
    - >-
      Erken Feudal'da yaklaşık 6 köylüyü yeni bir değirmenle çilek çalılarına gönder. Bu, avcıları seçtiğin orduya göre
      odun ve altına kaydırırken yiyeceği dengeler.
    - >-
      Ekonomin geçiş yaparken duvar ör, sonra gördüğüne göre tepki ver: scout'a karşı bir ahır, okçuya karşı bir okçu
      menzili artı skirmisher, man-at-arms açtıysan haritanın karşısına militia bas.
    - >-
      Uygarlık notları: ekonomi bonusları (Mayans ek köylü, Aztecs daha hızlı toplama, Vikings ucuz ekonomi) tavuk
      yiyeceğini daha da uzatır; Malians ve Ethiopians ise ucuz veya hızlı menzilli birimleri sayesinde temiz bir
      şekilde okçu baskısına dönüşür.
source:
  author: Hera
