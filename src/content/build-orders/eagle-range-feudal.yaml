intro:
  en: >-
    Hit Feudal fast off a heavy hunt, then apply two-pronged pressure with Eagle Scouts plus an Archery Range backing
    them up.
  tr: >-
    Yoğun avla Feodal'e hızlı geç, sonra Kartal İzcileri ve onları destekleyen bir Okçu Menzili ile iki koldan baskı
    uygula.
strategy:
  en:
    - >-
      This is a Mesoamerican-only opener (Aztecs, Incas, Mayans): they are the civs with Eagle Scouts, and their food
      bonuses let the boar-and-deer-heavy collection land Feudal near 9:15.
    - >-
      The whole idea is two threats at once — Eagles run down stragglers and raid villagers while your Range adds ranged
      damage the enemy must also answer, splitting their defense.
    - >-
      Read your opponent before committing the second unit: against a man-at-arms or scout opening, mass your own
      Archers; against an archer opening, switch the same villagers to Skirmishers so you out-trade them.
    - >-
      Wall early with the Range and Barracks builders — Houses and palisades close the gaps so your raiders stay safe
      and the enemy cannot counter-raid your exposed gold.
    - >-
      Take Double-Bit Axe but skip Horse Collar here: wood feeds the Range and walls, and your hunt covers food long
      enough to delay Farm tech.
    - >-
      To transition, seed Farms behind the army, keep gold flowing for Eagles, and add Fletching plus Blacksmith
      upgrades before deciding whether to keep pressuring or boom into Castle Age.
  tr:
    - >-
      Bu yalnızca Mezoamerika uygarlıklarına özgü bir açılış (Aztekler, İnkalar, Mayalar): Kartal İzcisine sahip
      uygarlıklar bunlar ve yiyecek bonusları, yaban domuzu ve geyik ağırlıklı toplamayı 9:15 civarında Feodal'e taşır.
    - >-
      Tüm fikir aynı anda iki tehdit oluşturmaktır — Kartallar kaçan köylüleri kovalayıp baskın yaparken, Menzil rakibin
      yine cevap vermek zorunda kalacağı menzilli hasar ekler ve savunmasını böler.
    - >-
      İkinci birime karar vermeden önce rakibini oku: man-at-arms veya izci açılışına karşı kendi Okçularını yığ; okçu
      açılışına karşı aynı köylüleri Nişancıya çevirip takasta öne geç.
    - >-
      Menzil ve Kışla işçileriyle erkenden duvar ör — Evler ve palisadlar boşlukları kapatır, böylece baskıncıların
      güvende kalır ve rakip açıktaki altınına karşı baskın yapamaz.
    - >-
      Burada Double-Bit Axe al ama Horse Collar'ı atla: odun Menzili ve duvarları besler, avın ise Tarla teknolojisini
      geciktirecek kadar yiyecek sağlar.
    - >-
      Geçiş için ordunun arkasına Tarlalar ek, Kartallar için altını akıtmaya devam et ve baskıya devam mı edeceğine
      yoksa Kale Çağı'na boom mu yapacağına karar vermeden önce Fletching ile Demirci yükseltmelerini al.
