intro:
  en: >-
    **Goal:** A clean Arena Fast Castle with no Feudal military — reach 23 villagers, click up around 10:10, build Market
    and Blacksmith, then hit Castle Age near 12:30. In Castle Age you mass Monks to grab every relic and add Siege to
    crack the walls. **Recommended civs:** Aztecs (+5 Monk HP per Monastery tech, +33% relic gold, strong Eagles +
    Siege), Byzantines (Monks heal faster, cheap trash + Cataphracts), Bohemians (powerful Monastery techs + gunpowder),
    Spanish (Missionaries — mounted Monks), Saracens (Madrasah refunds gold when Monks die).
  tr: >-
    **Hedef:** Feodal askeri olmadan temiz bir Arena Hızlı Kale — 23 köylüye ulaş, ~10:10'da çağ at, Market ve Blacksmith
    kur, ardından ~12:30'da Kale Çağı'na geç. Kale Çağı'nda tüm kalıntıları kapmak için Keşiş yığ ve duvarları kırmak
    için Siege ekle. **Önerilen uygarlıklar:** Aztecs (Manastır teknolojisi başına +5 Keşiş canı, +%33 kalıntı altını,
    güçlü Eagle + Siege), Byzantines (Keşişler daha hızlı iyileştirir, ucuz trash + Cataphract), Bohemians (güçlü
    Manastır teknolojileri + barut), Spanish (Missionary — binekli Keşiş), Saracens (Madrasah, Keşiş ölünce altını geri
    verir).
strategy:
  en:
    - 6 villagers on sheep; build 2 houses
    - 4 villagers to wood; build Lumber Camp
    - 3 villagers to berries; build Mill; lure boar
    - 5 more villagers to food; add 2 farms as sheep deplete
    - 1 villager to wood, 2 to gold; build Mining Camp
    - Reach 23 villagers and click Feudal (~10:10) — no Feudal military
    - In Feudal, build Market + Blacksmith; put 4 villagers on gold
    - Research Double-Bit Axe + Horse Collar; click Castle (~12:30)
    - Build a Monastery immediately; queue Monks; send them to grab relics
    - Build a Siege Workshop for Rams/Mangonels; add a 2nd Monastery
    - Add a 2nd Town Center and keep booming behind Monks + Siege
    - >-
      **Weak against:** Massed archers killing Monks; Trebuchet snipes on unsupported Monks; an opponent grabbing the
      relics first.
    - >-
      **Strong against:** Knight-heavy armies (Monks convert Knights); slow infantry; opponents who ignore Monastery
      protection.
  tr:
    - 6 köylü koyunlara; 2 house kur
    - 4 köylü oduna; Lumber Camp kur
    - 3 köylü çileklere; Mill kur; boar çek
    - 5 köylü daha yiyeceğe; koyunlar bitince 2 farm ekle
    - 1 köylü oduna, 2 köylü altına; Mining Camp kur
    - 23 köylüye ulaş ve Feodal'a tıkla (~10:10) — Feodal askeri yok
    - Feodal'da Market + Blacksmith kur; 4 köylüyü altına koy
    - Double-Bit Axe + Horse Collar araştır; Kale Çağı'na tıkla (~12:30)
    - Hemen Manastır kur; Keşiş sıraya al; kalıntıları kapmaya gönder
    - Ram/Mangonel için Siege Workshop kur; 2. Manastır ekle
    - 2. Town Center ekle ve Keşiş + Siege arkasında boom yapmaya devam et
    - >-
      **Zayıf olduğu durumlar:** Keşişleri öldüren yoğun okçular; desteksiz Keşişlere yapılan Trebuchet sniping'i;
      rakibin kalıntıları önce kapması.
    - >-
      **Güçlü olduğu durumlar:** Knight ağırlıklı ordular (Keşişler Knight'ları dönüştürür); yavaş piyade; Manastır
      korumasını ihmal eden rakipler.
source:
