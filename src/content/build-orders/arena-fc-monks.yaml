intro:
  en: >-
    **Goal:** Fast Castle with no Feudal military, send the scout out the gate immediately to grab relics, then mass
    Monks and Siege in Castle Age. **Recommended civs:** Aztecs (+5 Monk HP per Monastery tech, +33% relic gold),
    Byzantines (Monks heal 50% faster, cheap trash + Cataphracts), Bohemians (powerful Monastery upgrades + gunpowder),
    Spanish (Missionaries — mounted Monks), Saracens (Madrasah refunds gold when Monks die)
  tr: >-
    **Hedef:** Feodal askeri olmadan Kale Çağı'na hızlıca geç, atlıyı hemen kapıdan dışarı gönder ve kalıntıları kap;
    ardından Kale Çağı'nda Keşiş ve Siege yığ. **Önerilen uygarlıklar:** Aztecs (Manastır teknolojisi başına +5 Keşiş
    canı, +%33 kalıntı altını), Byzantines (Keşişler %50 daha hızlı iyileştirir, ucuz trash + Cataphract), Bohemians
    (güçlü Manastır yükseltmeleri + barut), Spanish (Missionary — binekli Keşiş), Saracens (Madrasah, Keşiş ölünce
    altını geri verir)
strategy:
  en:
    - 6 villagers on sheep
    - 3 villagers on wood; Lumber Camp
    - 3 villagers to berries; Mill
    - 3 more villagers to wood
    - 8 more villagers to food/wood
    - Build Blacksmith + Market
    - 4 villagers to gold; Mining Camp
    - Boom to 28–30 villagers
    - Research Double-Bit Axe, Horse Collar
    - Build Monastery immediately; produce 2 Monks; grab remaining relics
    - Build a Castle (defense + unique unit access)
    - Build Siege Workshop; produce Battering Rams for wall breaching
    - Research Sanctity, Fervor, Redemption
    - Add 2nd Town Center; boom to 40+ villagers
    - >-
      **Weak against:** Massed archers killing Monks; Trebuchet snipes on unsupported Monks; opponent grabbing 4+ relics
      first.
    - >-
      **Strong against:** Knight-heavy armies (Monks convert Knights); slow infantry; opponents who ignore monastery
      protection.
  tr:
    - 6 köylü koyunlara
    - 3 köylü oduna; Lumber Camp
    - 3 köylü çileklere; Mill
    - 3 köylü daha oduna
    - 8 köylü daha yiyecek/oduna
    - Blacksmith + Market kur
    - 4 köylü altına; Mining Camp
    - 28–30 köylüye boom yap
    - Double-Bit Axe ve Horse Collar araştır
    - Hemen Manastır kur; 2 Keşiş üret; kalan kalıntıları topla
    - Castle kur (savunma + özgün birim erişimi)
    - Siege Workshop kur; duvar kırmak için Battering Ram üret
    - Sanctity, Fervor ve Redemption araştır
    - 2. Town Center ekle; 40+ köylüye boom yap
    - >-
      **Zayıf olduğu durumlar:** Keşişleri öldüren yoğun okçular; desteksiz Keşişlere yapılan Trebuchet sniping'i;
      rakibin önce 4+ kalıntı kapması.
    - >-
      **Güçlü olduğu durumlar:** Knight ağırlıklı ordular (Keşişler Knight'ları dönüştürür); yavaş piyade; Manastır
      korumasını ihmal eden rakipler.
