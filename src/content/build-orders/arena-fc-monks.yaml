slug: arena-fc-monks
name:
  en: Arena Fast Castle with Monk Rush
  tr: Arena Hızlı Kale ve Keşiş Baskını
difficulty: intermediate
targetAge: castle
durationMin: 20
civsRecommended:
  - aztecs
  - byzantines
  - bohemians
  - spanish
  - saracens
