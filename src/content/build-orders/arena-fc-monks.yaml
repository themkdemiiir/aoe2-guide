    assign:
      en: 6 → sheep under TC
      tr: 6 → TC altındaki koyunlar
    icons:
      - food
  - villagers: 9
    assign:
      en: +3 → wood, build lumber camp
      tr: +3 → oduna, kereste kampı kur
    icons:
      - wood
      - lumber-camp
  - villagers: 12
    assign:
      en: +3 → berries, build mill
      tr: +3 → çileklere, Mill kur
    icons:
      - food
      - mill
  - villagers: 15
    assign:
      en: +3 → wood
      tr: +3 → oduna
    icons:
      - wood
  - villagers: 23
    assign:
      en: +8; click Feudal at 23 pop; no Feudal military
      tr: +8; 23 nüfusta Feodal'a tıkla; Feodal askeri yok
    icons:
      - food
  - villagers: 23
    assign:
      en: "CRITICAL: send scout out gate immediately for relics"
      tr: "KRİTİK: atlıyı hemen kapıdan dışarı gönder — kalıntıları topla"
    icons:
      - scout-cavalry
  - villagers: 23
    assign:
      en: "Feudal: build Blacksmith + Market; 4 → gold (mining camp)"
      tr: "Feodal: Blacksmith + Market kur; 4 → altın (maden kampı)"
