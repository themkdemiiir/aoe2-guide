slug: arena-fc-monks
name:
  en: Arena Fast Castle into Monks
  tr: Arena Hızlı Kale ve Keşiş Baskını
difficulty: intermediate
targetAge: castle
durationMin: 13
civsRecommended:
  - aztecs
  - byzantines
  - bohemians
  - spanish
  - saracens
steps:
  - villagers: 6
    time: "0:25"
    assign:
      en: 6 → sheep under TC; build 2 houses
      tr: 6 → TC altındaki koyunlar; 2 house kur
    icons:
      - food
  - villagers: 10
    time: "2:10"
    assign:
      en: +4 → wood; build Lumber Camp
      tr: +4 → oduna; Lumber Camp kur
    icons:
      - wood
      - lumber-camp
  - villagers: 13
    time: "3:30"
    assign:
      en: +3 → berries; build Mill; lure boar
      tr: +3 → çileklere; Mill kur; boar çek
    icons:
      - food
      - mill
  - villagers: 18
    time: "5:40"
    assign:
      en: +5 → food; add 2 farms as sheep run out
      tr: +5 → yiyeceğe; koyunlar bitince 2 farm ekle
    icons:
      - food
  - villagers: 21
    time: "7:20"
    assign:
      en: +1 → wood, +2 → gold; build Mining Camp
      tr: +1 → oduna, +2 → altına; Mining Camp kur
    icons:
      - wood
      - gold
  - villagers: 23
    time: "10:10"
    phase: feudal
    assign:
      en: +2; click Feudal at 23 pop — no Feudal military
      tr: +2; 23 nüfusta Feodal'a tıkla — Feodal askeri yok
    icons:
      - food
  - villagers: 25
    time: "11:00"
    assign:
      en: "Feudal: build Market + Blacksmith; +2 → gold (4 total)"
      tr: "Feodal: Market + Blacksmith kur; +2 → altına (toplam 4)"
    icons:
      - market
      - blacksmith
      - gold
  - villagers: 25
    time: "11:10"
    assign:
      en: Research Double-Bit Axe + Horse Collar; click Castle Age
      tr: Double-Bit Axe + Horse Collar araştır; Kale Çağı'na tıkla
    icons:
      - castle-age
  - villagers: 25
    time: "12:30"
    phase: castle
    assign:
      en: "Castle: build Monastery; queue Monks; send them for relics"
      tr: "Kale: Manastır kur; Keşiş sıraya al; kalıntılar için gönder"
    icons:
      - monastery
      - monk
  - villagers: 27
    time: "13:30"
    assign:
      en: Build Siege Workshop for Rams/Mangonels; add 2nd Monastery
      tr: Ram/Mangonel için Siege Workshop kur; 2. Manastır ekle
    icons:
      - siege-workshop
