slug: khmer-fast-scouts
name:
  en: Khmer Super Fast Scouts
  tr: Khmer Süper Hızlı Atlı Keşifçiler
difficulty: advanced
targetAge: feudal
durationMin: 8
civsRecommended:
  - khmer
steps:
  - villagers: 6
    assign:
      en: 6 → sheep under the TC
      tr: 6 → TC altında koyunlar
    icons:
      - food
      - town-center
  - villagers: 7
    assign:
      en: +1 → lure and kill the first boar
      tr: +1 → ilk yaban domuzunu çek ve avla
    note:
      en: Eat boars before the sheep run dry
      tr: Koyunlar bitmeden domuzları yiyip bitir
    icons:
      - food
  - villagers: 9
    assign:
      en: +2 → the same boar, dragged under the TC
      tr: +2 → TC altına çekilen aynı domuza
    icons:
      - food
  - villagers: 10
    assign:
      en: +1 → lure the second boar
      tr: +1 → ikinci domuzu çek
    icons:
      - food
  - villagers: 11
    assign:
      en: +1 → build a house, then return to the boar
      tr: +1 → bir ev kur, sonra domuza geri dön
    icons:
      - house
      - food
  - villagers: 16
    phase: feudal
    time: "7:35"
    assign:
      en: +5 → hunt under the TC, then click up to Feudal
      tr: +5 → TC altında avlanma, sonra Feudal'a tıkla
    note:
      en: Land at 16 pop on 0 wood / 16 food — pure food up
      tr: 16 nüfusta 0 odun / 16 yiyecek ile geç — tamamen yiyecekle çık
    icons:
      - food
  - villagers: 16
    assign:
      en: "Feudal: send 8 vils to a fresh woodline and build a lumber camp"
      tr: "Feudal: 8 köylüyü yeni bir ormana gönder ve bir kereste kampı kur"
    icons:
      - wood
      - lumber-camp
  - assign:
      en: Drop 1 house near the new woodline to stay above pop
      tr: Nüfusun üstünde kalmak için yeni ormanın yanına 1 ev bırak
    icons:
      - house
  - assign:
      en: Build a stable with 2 vils; start Scout Cavalry the moment it finishes
      tr: 2 köylüyle ahır kur; biter bitmez Atlı Keşifçi üretmeye başla
    note:
      en: No barracks — Khmer go straight to the stable
      tr: Kışla yok — Khmer doğrudan ahıra geçer
    icons:
      - stable
      - scout-cavalry
  - assign:
      en: Place houses next to each resource cluster
      tr: Her kaynak kümesinin yanına evler yerleştir
    note:
      en: Khmer villagers garrison in houses, so houses double as protection
      tr: Khmer köylüleri evlere sığınır, yani evler aynı zamanda koruma sağlar
    icons:
      - house
  - assign:
      en: Research Double-Bit Axe at the lumber camp
      tr: Kereste kampında Double-Bit Axe'ı araştır
    icons:
      - double-bit-axe
  - villagers: 22
    assign:
      en: +6 new villagers → berries to fund continuous scout production
      tr: +6 yeni köylü → sürekli keşifçi üretimini beslemek için çileğe
    icons:
      - food
  - assign:
      en: Once you bank 60 wood, start seeding farms; keep scouts flowing
      tr: 60 odun biriktirince tarla ekmeye başla; keşifçileri akıtmaya devam et
    icons:
      - farm
      - scout-cavalry
intro:
  en: >-
    Abuse the Khmer free-housing bonus to reach Feudal at 16 pop around 7:35 and flood the map with Scout Cavalry before
    your opponent can react.
  tr: >-
    Khmer'in bedava ev bonusunu sömürerek 7:35 civarında 16 nüfusla Feudal'a geç ve rakip tepki veremeden haritayı Atlı
    Keşifçilerle doldur.
strategy:
  en:
    - >-
      The whole point is speed: a 16-pop, all-food landing gets scouts on the map well ahead of a standard 18-pop
      opening, so the first minutes of Feudal should be spent hunting villagers, not idling at home.
    - >-
      Khmer skip Feudal infrastructure they do not need. There is no barracks and no wall reflex here — vils tuck into
      nearby houses thanks to the garrison bonus, so place houses on the resources you most want to defend.
    - >-
      Keep the stable and TC producing in lockstep. Wood goes to the lumber camp first, then farms once you bank 60,
      while the +6 berry villagers keep enough food coming to never pause Scout Cavalry.
    - >-
      React to your scouting. Add spearmen only if the opponent commits to their own scouts; against archers, peel
      toward an archery range and skirmishers instead of forcing more cavalry into a bad trade.
    - >-
      Carry the tempo into Castle Age. Because Khmer pay no wood for houses, the saved resources can snowball into
      Knights or a fast follow-up tech spike if your early harassment lands.
  tr:
    - >-
      Mesele tamamen hızdır: 16 nüfuslu, tamamen yiyecekle yapılan geçiş, standart 18 nüfuslu açılışın çok önünde
      keşifçileri haritaya çıkarır; bu yüzden Feudal'ın ilk dakikalarını evde beklemek yerine köylü avlamaya harca.
    - >-
      Khmer ihtiyaç duymadığı Feudal yapılarını atlar. Burada kışla yok ve refleksle sur örme yok — köylüler garnizon
      bonusu sayesinde yakındaki evlere sığınır, o yüzden evleri en çok korumak istediğin kaynakların üzerine yerleştir.
    - >-
      Ahır ile TC'yi aynı anda üretimde tut. Odun önce kereste kampına, 60 biriktikten sonra tarlalara gider; +6 çilek
      köylüsü ise Atlı Keşifçi üretimini hiç durdurmayacak kadar yiyecek akıtmaya devam eder.
    - >-
      Keşfine göre tepki ver. Rakip kendi keşifçilerine yüklenirse ancak o zaman mızraklı ekle; okçulara karşı süvarini
      kötü bir takasa zorlamak yerine bir okçu menzili ve sıyırıcılara (skirmisher) yönel.
    - >-
      Tempoyu Castle çağına taşı. Khmer evlere odun ödemediği için biriken kaynaklar, erken tacizin tutarsa Şövalyelere
      ya da hızlı bir teknoloji sıçramasına dönüşebilir.
source:
