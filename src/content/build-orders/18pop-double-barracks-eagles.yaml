intro:
  en: Land Feudal fast off heavy hunt, then drown the enemy in Eagle Scouts trained from two Barracks at once.
  tr: Yoğun av ile hızlıca Feudal'a çık, ardından iki Barracks'tan aynı anda bastığın Eagle Scout'larla rakibi boğ.
strategy:
  en:
    - >-
      This opener belongs to the Mesoamerican civs (Aztecs, Incas, Mayans) — they are the only ones with Eagle Scouts,
      and their eco bonuses let this heavy-hunt opening land in Feudal cleanly around 8:50.
    - >-
      Two Barracks let you keep constant Eagle pressure: their speed and gold-conversion bonus make raiding villagers
      and snowballing map control easy, so commit to harassment rather than turtling.
    - Open 2 Spearmen if you scout a Scout Rush, then flip fully to Eagles once the cavalry threat is dealt with.
    - >-
      You are strong into Scout, Spear, and Skirmisher openings but soft against Man-at-Arms and Archers — if you see
      either, slot in a single Archery Range for Skirmishers and lean on walls.
    - >-
      Keep gold flowing: it fuels every Eagle, so wall the base and consider a Watch Tower over your mining camp; losing
      gold here usually ends the game.
    - >-
      To transition, add Farms behind the army, bank gold, and use a Market (sell stone if needed) to push a
      tech-and-eco lead into Castle Age.
  tr:
    - >-
      Bu açılış Mezoamerika medeniyetlerine (Aztecs, Incas, Mayans) özeldir — Eagle Scout'a sahip tek medeniyetler
      onlardır ve ekonomi bonusları sayesinde bu yoğun av açılışı 8:50 civarında sorunsuzca Feudal'a oturur.
    - >-
      İki Barracks sürekli Eagle baskısı sağlar: Eagle'ların hızı ve altına dönüştürme bonusu, köylü avlamayı ve harita
      kontrolünü çığ gibi büyütmeyi kolaylaştırır; bu yüzden savunmaya çekilmek yerine baskıya yüklen.
    - Scout Rush gördüysen önce 2 Spearman aç, süvari tehdidi geçtikten sonra tamamen Eagle üretimine dön.
    - >-
      Scout, Spear ve Skirmisher açılışlarına karşı güçlüsün ama Man-at-Arms ve Archer'a karşı zayıfsın — herhangi
      birini görürsen tek bir Archery Range açıp Skirmisher al ve wall'a yaslan.
    - >-
      Altın akışını sürdür: her Eagle'ı o besler, bu yüzden üssü wall'la ve mining camp'in üstüne bir Watch Tower
      kurmayı düşün; burada altını kaybetmek genelde oyunu bitirir.
    - >-
      Geçiş için ordu arkasına Farm ekle, altın biriktir ve bir Market kullanarak (gerekirse taş satarak) teknoloji ve
      ekonomi avantajını Castle Age'e taşı.
