slug: korean-spear-skirm
name:
  en: 18 Pop Korean Spear Skirm Rush
  tr: 18 Pop Korean Spear Skirm Rush
difficulty: beginner
targetAge: feudal
durationMin: 9
civsRecommended:
  - koreans
  - byzantines
  - lithuanians
steps:
  - villagers: 6
    assign:
      en: 6 → sheep under the Town Center
      tr: 6 → Town Center altındaki koyunlar
    icons:
      - food
      - town-center
  - villagers: 8
    assign:
      en: +2 → wood, drop a lumber camp
      tr: +2 → odun, bir kereste kampı kur
    icons:
      - wood
      - lumber-camp
  - villagers: 9
    assign:
      en: +1 → lure and eat the first boar
      tr: +1 → ilk yaban domuzunu çek ve ye
    icons:
      - food
  - villagers: 11
    assign:
      en: +2 → eat the boar under the Town Center
      tr: +2 → yaban domuzunu Town Center altında ye
    icons:
      - food
      - town-center
  - villagers: 12
    assign:
      en: +1 → build a house, then a mill on berries
      tr: +1 → bir ev kur, ardından çalıların üstüne değirmen
    icons:
      - house
      - mill
      - food
  - villagers: 13
    assign:
      en: +1 → lure the second boar
      tr: +1 → ikinci yaban domuzunu çek
    note:
      en: Lure deer with your scout to stretch the food
      tr: Yiyeceği uzatmak için scout ile geyikleri çek
    icons:
      - food
  - villagers: 15
    assign:
      en: +2 → remaining hunt under the Town Center
      tr: +2 → Town Center altındaki kalan avı topla
    icons:
      - food
  - villagers: 18
    phase: feudal
    time: "8:50"
    assign:
      en: +3 → berries; research Loom and click up to Feudal
      tr: +3 → çalılar; Loom araştır ve Feudal'a tıkla
    note:
      en: Feudal landing ~8:50 on 2 wood / 16 food
      tr: Feudal geçişi ~8:50, 2 odun / 16 yiyecek üzerine
    icons:
      - food
      - loom
  - villagers: 18
    assign:
      en: Send 3 → the first lumber camp and 5 → a second lumber camp
      tr: 3 köylüyü ilk kereste kampına, 5 köylüyü ikinci kereste kampına gönder
    icons:
      - wood
      - lumber-camp
  - assign:
      en: Build a Barracks and an Archery Range; push Spearmen forward as soon as they pop
      tr: Bir Barracks ve bir Archery Range kur; mızrakçılar çıkar çıkmaz öne sür
    icons:
      - barracks
      - archery-range
      - spearman
  - assign:
      en: Research Double-Bit Axe and Horse Collar
      tr: Double-Bit Axe ve Horse Collar araştır
    icons:
      - double-bit-axe
      - horse-collar
  - assign:
      en: Train Skirmishers and move them forward; seed 14-16 farms as hunt food runs out
      tr: Skirmisher üret ve öne sür; av yiyeceği biterken 14-16 çiftlik ek
    icons:
      - skirmisher
      - farm
  - assign:
      en: Move 7 villagers → gold and drop a Mining Camp
      tr: 7 köylüyü altına geçir ve bir Mining Camp kur
    icons:
      - gold
      - mining-camp
  - assign:
      en: Build a Blacksmith and research Fletching; wall up, then transition to Castle Age
      tr: Bir Blacksmith kur ve Fletching araştır; surları çek, sonra Castle Age'e geç
    icons:
      - blacksmith
      - fletching
intro:
  en: >-
    Land in Feudal around 8:50 and apply forward Spearman-plus-Skirmisher pressure with cheap, trash-cost units that are
    easy to mass and hard to lose value on.
  tr: >-
    Yaklaşık 8:50'de Feudal'a geç ve kolayca yığılan, değer kaybetmesi zor ucuz "çöp" birliklerle öne
    mızrakçı-skirmisher baskısı uygula.
strategy:
  en:
    - >-
      Spearmen and Skirmishers cost only food and wood, so a single mistake never bleeds gold — that forgiving economy
      is what makes this such a strong beginner and low-elo opener.
    - >-
      Spears go forward first to threaten the enemy's eco and scout line, then Skirmishers join to shred any archers
      your opponent reaches for; the pairing answers almost every Feudal composition.
    - >-
      Double-Bit Axe and Horse Collar keep your wood and farm income flowing while you produce nonstop from one Barracks
      and one Range — don't skip them just to make a couple more units.
    - >-
      Koreans are the headline pick for their cheaper towers and wood discount on buildings; Byzantines get discounted
      trash units to mass even harder, and Lithuanians add early speed plus a flexible follow-up.
    - >-
      Pull 7 villagers onto gold only once farms cover your food, then Blacksmith into Fletching to boost the
      Skirmishers before you wall and start clicking to Castle.
    - >-
      From Castle Age you flow naturally into Elite Skirmishers and Pikemen, add Crossbows or a Knight follow-up if you
      have the gold, and keep harassing while your trash army holds the map.
  tr:
    - >-
      Mızrakçılar ve Skirmisher'lar yalnızca yiyecek ve oduna mal olur, bu yüzden tek bir hata bile altın kaybettirmez;
      bu affedici ekonomi, build'i yeni başlayanlar ve düşük elo için bu kadar güçlü kılan şeydir.
    - >-
      Önce mızrakçılar öne çıkıp rakibin ekonomisini ve scout hattını tehdit eder, ardından Skirmisher'lar katılıp
      rakibin çıkardığı her okçuyu doğrar; bu ikili neredeyse her Feudal kompozisyonuna cevap verir.
    - >-
      Double-Bit Axe ve Horse Collar, tek Barracks ve tek Range'den durmadan üretirken odun ve çiftlik gelirini akışta
      tutar; sırf birkaç ekstra birlik için bunları atlamayın.
    - >-
      Koreans, daha ucuz kuleleri ve binalarda odun indirimiyle başroldeki seçim; Byzantines indirimli çöp birliklerle
      daha da fazla yığar, Lithuanians ise erken hız ve esnek bir devam sunar.
    - >-
      7 köylüyü altına ancak çiftlikler yiyeceğini karşıladığında çekin, sonra surları çekip Castle'a tıklamadan önce
      Blacksmith'ten Fletching alıp Skirmisher'ları güçlendirin.
    - >-
      Castle Age'de doğal olarak Elite Skirmisher ve Pikeman'a geçer, altınınız varsa Crossbow ya da Knight devamı
      eklersiniz; çöp ordunuz haritayı tutarken baskıya devam edin.
