slug: 17pop-japanese-maa-rush
name:
  en: 17 Pop Japanese Man-at-Arms Rush
  tr: 17 Pop Japon Man-at-Arms Baskını
difficulty: advanced
targetAge: feudal
durationMin: 9
civsRecommended:
  - japanese
steps:
  - villagers: 6
    assign:
      en: 6 → sheep under the Town Center
      tr: 6 → Şehir Merkezi altındaki koyunlar
    icons:
      - food
      - town-center
  - villagers: 8
    assign:
      en: +2 → wood, drop a Lumber Camp
      tr: +2 → oduna git, Kereste Kampı kur
    icons:
      - wood
      - lumber-camp
  - villagers: 10
    assign:
      en: +1 → first boar, +1 → second boar under the Town Center
      tr: +1 → ilk yaban domuzunu çek, +1 → ikinci domuzu Şehir Merkezi altına çek
    note:
      en: Lure at least 2 deer — this is mandatory
      tr: En az 2 geyik çek — bu zorunlu
    icons:
      - food
  - villagers: 11
    assign:
      en: +1 → build a House, then back to the hunt
      tr: +1 → Ev yap, sonra ava dön
    icons:
      - house
      - food
  - villagers: 13
    assign:
      en: +2 → hunt (eat through the second boar)
      tr: +2 → av (ikinci yaban domuzunu yiyerek bitir)
    icons:
      - food
  - villagers: 16
    assign:
      en: +1 → Barracks at the front, +2 → food under the Town Center
      tr: +1 → öne Kışla kur, +2 → Şehir Merkezi altında yiyecek
    icons:
      - barracks
      - food
  - villagers: 17
    phase: feudal
    time: "8:25"
    assign:
      en: +1 → wood, research Loom, then click up to Feudal
      tr: +1 → oduna git, Loom'u araştır, sonra Feudal'a tıkla
    note:
      en: Land with roughly 3 on wood and 13 on food
      tr: Yaklaşık 3 odunda, 13 yiyecekte iken çağ atla
    icons:
      - wood
      - loom
  - villagers: 17
    assign:
      en: 2 from the hunt → gold with a Mining Camp; pump 3 Militia and send them across the map
      tr: Avdan 2 kişi → Maden Kampı ile altına; 3 Milis bas ve haritanın karşısına yolla
    icons:
      - gold
      - mining-camp
      - militia
  - villagers: 17
    assign:
      en: 4 off the Town Center → wood; build an Archery Range, start Archers, research Man-at-Arms
      tr: Şehir Merkezi'nden 4 kişi → oduna; Okçu Menzili kur, Okçu bas, Man-at-Arms'ı araştır
    icons:
      - archery-range
      - archer
      - man-at-arms
  - villagers: 19
    assign:
      en: +2 → gold; add a Blacksmith and research Double-Bit Axe
      tr: +2 → altın; Demirci ekle ve Double-Bit Axe'ı araştır
    icons:
      - gold
      - blacksmith
      - double-bit-axe
  - villagers: 20
    assign:
      en: +1 → berries and build a Mill; research Fletching and push Archers + Man-at-Arms together
      tr: +1 → çileklere ve Değirmen kur; Fletching'i araştır ve Okçu + Man-at-Arms'ı birlikte ileri sür
    note:
      en: Slowly move villagers to farms before the sheep run out
      tr: Koyunlar bitmeden köylüleri yavaşça tarlalara geçir
    icons:
      - food
      - mill
      - fletching
intro:
  en: >-
    Reach Feudal Age around 8:25 and apply the fastest possible Man-at-Arms pressure, layering in Archers right behind
    the Militia.
  tr: >-
    Yaklaşık 8:25'te Feudal Çağ'a ulaş ve mümkün olan en hızlı Man-at-Arms baskısını uygula; Milislerin hemen arkasına
    Okçuları da ekle.
strategy:
  en:
    - >-
      This is the quickest Man-at-Arms timing in the game — Japanese infantry attack faster, so even a small group of
      Militia and Man-at-Arms punishes an unwalled opponent hard.
    - >-
      The plan front-loads aggression: send the 3 Militia out the moment Feudal lands, then convert them to Man-at-Arms
      and reinforce with Archers and Fletching to keep the push rolling.
    - >-
      Your economy is deliberately thin, so the early damage has to pay for itself; idle enemy villagers and a slow wall
      are exactly what you are hunting for.
    - >-
      Late game is the weakness of this opening — commit to finishing the fight in Feudal rather than coasting, because
      a contained rush leaves you behind on eco.
    - >-
      If the opponent walls fast or counters with Scouts, ease off, secure your gold and wood, and transition cleanly
      into Castle Age Crossbows instead of throwing units away.
  tr:
    - >-
      Bu, oyundaki en hızlı Man-at-Arms zamanlamasıdır — Japon piyadeleri daha hızlı saldırdığı için küçük bir Milis ve
      Man-at-Arms grubu bile duvarsız bir rakibi ağır cezalandırır.
    - >-
      Plan tüm ağırlığını erken saldırıya verir: Feudal gelir gelmez 3 Milisi dışarı yürüt, ardından onları
      Man-at-Arms'a dönüştür ve Okçular ile Fletching ekleyerek baskıyı sürdür.
    - >-
      Ekonomin bilerek zayıf tutulur, bu yüzden erken hasarın kendini ödemesi gerekir; aradığın şey tam olarak boşta
      duran düşman köylüleri ve yavaş örülen duvardır.
    - >-
      Bu açılışın zayıf noktası geç oyundur — savuşturulan bir baskı seni ekonomide geride bırakacağından, oyalanmak
      yerine savaşı Feudal'da bitirmeye odaklan.
    - >-
      Rakip hızlı duvar örerse veya Scout'larla karşılık verirse baskıyı gevşet, altın ve odununu güvene al ve
      birlikleri ziyan etmek yerine temiz bir şekilde Castle Çağı Crossbow'larına geçiş yap.
