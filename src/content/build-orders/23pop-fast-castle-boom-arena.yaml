  - villagers: 17
    assign:
      en: +4 → berries
      tr: +4 → meyvelere
    note:
      en: As sheep run out, re-task those villagers onto 4 new farms
      tr: Koyunlar bitince o köylüleri 4 yeni tarlaya kaydır
    icons:
      - food
      - farm
    resources: { food: 14, wood: 3, gold: 0, stone: 0, builder: 0 }
  - villagers: 21
    assign:
      en: +4 → wood on a single Lumber Camp
      tr: +4 → tek bir Lumber Camp'te oduna
    icons:
      - wood
      - lumber-camp
    resources: { food: 14, wood: 7, gold: 0, stone: 0, builder: 0 }
  - villagers: 23
    phase: feudal
    time: "10:30"
    assign:
      en: +2 → gold, then click Feudal Age
      tr: +2 → altına, ardından Feudal Age'e tıkla
    note:
      en: Spend as little time in Feudal as possible
      tr: Feudal'de mümkün olduğunca az zaman geçir
    icons:
      - gold
    resources: { food: 14, wood: 7, gold: 2, stone: 0, builder: 0 }
  - villagers: 25
    assign:
      en: "Feudal: 1 → Blacksmith, 2 → Market (use straggler-tree villagers); +2 → wood"
      tr: "Feudal: 1 → Blacksmith, 2 → Market (straggler ağaç köylüleriyle); +2 → oduna"
    icons:
      - blacksmith
      - market
      - wood
    resources: { food: 14, wood: 6, gold: 2, stone: 0, builder: 3 }
  - phase: castle
    time: "14:00"
    assign:
      en: Click Castle Age; research Double-Bit Axe and Horse Collar
      tr: Castle Age'e tıkla; Double-Bit Axe ve Horse Collar araştır
    icons:
