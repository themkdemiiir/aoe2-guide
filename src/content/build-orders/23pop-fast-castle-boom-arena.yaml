      - horse-collar
    resources: { food: 14, wood: 6, gold: 2, stone: 0, builder: 3 }
  - villagers: 25
    assign:
      en: "Castle: drop a new Lumber Camp and your extra Town Centers; research Bow Saw; seed more farms"
      tr: "Castle: yeni bir Lumber Camp ve ek Town Center'lar kur; Bow Saw araştır; yeni tarlalar ek"
    icons:
      - town-center
      - bow-saw
      - farm
    resources: { food: 14, wood: 6, gold: 2, stone: 0, builder: 3 }
  - assign:
      en: Keep booming — Wheelbarrow near 18 farms, then Hand Cart; add a 4th TC off a stone mine; buy food/wood at Market as needed
      tr: Boom'a devam et — ~18 tarlada Wheelbarrow, sonra Hand Cart; bir taş madeninden 4. TC ekle; gerekirse Market'ten yiyecek/odun al
    icons:
      - town-center
      - wheelbarrow
      - market
    resources: { food: 14, wood: 6, gold: 2, stone: 0, builder: 3 }
intro:
  en: >-
    Race to Castle Age off a clean 23-pop economy on a closed map, then snowball with extra Town Centers before the
    opponent can punish you.
  tr: >-
    Kapalı bir haritada temiz bir 23 köylü ekonomisiyle Castle Age'e koş, ardından rakip seni cezalandıramadan ek Town
    Center'larla ekonomini patlat.
strategy:
  en:
    - >-
      This build trades all early military for economy, so it only works behind walls — Arena, Hideout, Black Forest, or
      a fully sealed Arabia pocket. Wall before you commit.
    - >-
      Keep Feudal as short as possible: the only Feudal buildings are a Market and Blacksmith to unlock the upgrades and
      trading you need, then click straight to Castle around 14:00.
    - >-
      The moment Castle lands, your wood economy pays off — drop a fresh Lumber Camp and your extra Town Centers, then
      research Bow Saw so the booming villagers keep up with demand.
    - >-
      Stack Town Centers (3, then a 4th off a stone mine) and ride the villager count up; pick up Wheelbarrow near 18
      farms and Hand Cart shortly after to keep the food flowing.
    - >-
      Use the Market to flatten resource spikes during the boom — buy food or wood when one stockpile balloons so you
      never idle Town Centers.
    - >-
      When you stop booming, commit to one gold unit, one trash unit, and one siege unit, then push into Imperial with
      an economy the opponent cannot match.
  tr:
    - >-
      Bu build tüm erken askeri ekonomiye feda eder, bu yüzden yalnızca duvarların ardında işe yarar — Arena, Hideout,
      Black Forest ya da tamamen kapatılmış bir Arabia pocket. Bu stratejiye girmeden önce duvarla.
    - >-
      Feudal'i mümkün olduğunca kısa tut: tek Feudal binaları, ihtiyacın olan yükseltmeleri ve ticareti açan bir Market
      ile Blacksmith'tir; sonra 14:00 civarında doğrudan Castle Age'e tıkla.
    - >-
      Castle gelir gelmez odun ekonomin işe yarar — taze bir Lumber Camp ve ek Town Center'larını kur, ardından boom
      yapan köylülerin talebe yetişebilsin diye Bow Saw araştır.
    - >-
      Town Center'ları üst üste koy (önce 3, ardından bir taş madeninden 4.) ve köylü sayısını yukarı taşı; ~18 tarla
      civarında Wheelbarrow, kısa süre sonra da Hand Cart al ki yiyecek akmaya devam etsin.
    - >-
      Boom sırasında kaynak dalgalanmalarını dengelemek için Market'i kullan — bir stok şişince yiyecek veya odun al ki
      Town Center'ların asla boşta kalmasın.
    - >-
      Boom'u bıraktığında bir gold unit, bir trash unit ve bir siege unit'e karar ver; sonra rakibin eşleşemeyeceği bir
      ekonomiyle Imperial'a geç.
