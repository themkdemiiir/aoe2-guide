slug: 23pop-fast-castle-boom-arena
name:
  en: 23 Pop Fast Castle Boom — Arena
  tr: 23 Köylü Hızlı Kale Boom — Arena
difficulty: intermediate
targetAge: castle
durationMin: 14
civsRecommended:
  - burgundians
  - poles
  - bohemians
  - portuguese
  - bengalis
steps:
  - villagers: 6
    assign:
      en: 6 → sheep under the Town Center
      tr: 6 → Town Center'ın altındaki koyunlara
    icons:
      - food
      - town-center
    resources: { food: 6, wood: 0, gold: 0, stone: 0, builder: 0 }
  - villagers: 9
    assign:
      en: +3 → wood, build a Lumber Camp
      tr: +3 → oduna, bir Lumber Camp kur
