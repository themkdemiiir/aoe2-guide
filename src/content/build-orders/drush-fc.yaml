intro:
  en: Harass with three Dark Age Militia, then reach Castle Age first with a clean economic and technology lead.
  tr: >-
    Üç Dark Age Militia'sıyla baskı yap, ardından temiz bir ekonomi ve teknoloji üstünlüğüyle Castle Age'e ilk ulaşan
    ol.
strategy:
  en:
    - >-
      The Drush is the cheap part: three Militia plus the Scout poke the opponent's eco while you commit fully to the
      climb. Even one or two villager kills forces them off resources, and the panic alone slows their own up-time.
    - >-
      This is a true Drush, not a Men-at-Arms rush — never spend on the MAA upgrade. Every spare resource feeds the Fast
      Castle, so you land Castle Age around 16:05 with the lead intact.
    - >-
      Wall as you go. Palisades around the boar and woodlines keep your Militia builders safe and stop the opponent from
      trading the harassment back onto your own villagers.
    - >-
      Out of Castle Age, mass Archers from your single Range and follow Double-Bit Axe, Horse Collar, and Fletching to
      snowball the eco-and-tech advantage into a Crossbow timing. Add a 2nd Range only if you want all-in two-Range
      pressure — the standard line stays on one Range and grabs Bow Saw plus the Crossbow upgrade.
    - >-
      Strong civs here are the archer powers — Britons, Ethiopians, Italians, Mayans, and Vikings — whose cheaper or
      harder-hitting Archers convert the Castle-first lead directly into a winning unit.
    - >-
      If the opponent is already walled and turtling, drop the harassment early and lean on the boom: an early second
      Town Center behind your walls pulls the eco lead further ahead.
  tr:
    - >-
      Drush, planın ucuz tarafıdır: üç Militia ve Scout düşmanın ekonomisini dürterken sen tamamen yükselişe
      odaklanırsın. Bir iki köylüyü öldürmek bile rakibi kaynaktan çeker, çıkan panik ise onların kendi çağ atlamasını
      yavaşlatır.
    - >-
      Bu gerçek bir Drush'tır, Men-at-Arms rush değil — MAA yükseltmesine asla harcama yapma. Her artan kaynak Fast
      Castle'a gider, böylece üstünlük korunmuşken yaklaşık 16:05'te Castle Age'e ulaşırsın.
    - >-
      İlerledikçe duvar ör. Domuz ve odun hatlarının çevresindeki palisade'ler Militia inşaatçılarını güvende tutar ve
      rakibin baskıyı senin köylülerine geri çevirmesini engeller.
    - >-
      Castle Age'e geçince tek Range'inden Archer yığ; Double-Bit Axe, Horse Collar ve Fletching ile ekonomi ve
      teknoloji avantajını bir Crossbow zamanlamasına çevir. İkinci bir Range'i yalnızca tam baskı (two-Range) istiyorsan
      ekle — standart hat tek Range'de kalıp Bow Saw ve Crossbow yükseltmesini alır.
    - >-
      Buradaki güçlü medeniyetler okçu güçleridir — Britons, Ethiopians, Italians, Mayans ve Vikings — daha ucuz ya da
      daha sert vuran Archer'larıyla Castle-first üstünlüğünü doğrudan kazandıran bir birime dönüştürürler.
    - >-
      Rakip çoktan duvar örmüş ve turtle yapıyorsa baskıyı erken bırak ve boom'a yaslan: duvarlarının arkasında erken
      bir ikinci Town Center ekonomi üstünlüğünü daha da öne taşır.
