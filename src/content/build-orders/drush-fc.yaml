slug: drush-fc
name:
  en: Drush Fast Castle
  tr: Drush Fast Castle (Drush ile Hızlı Kale)
difficulty: advanced
targetAge: castle
durationMin: 16
civsRecommended:
  - britons
  - ethiopians
  - italians
  - mayans
  - vikings
