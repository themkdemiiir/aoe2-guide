      tr: 3 Militia üret ve Scout ile birlikte öne gönder
    note:
      en: Pure Drush — do NOT take Men-at-Arms
      tr: Saf Drush — Men-at-Arms yükseltmesini ASLA yapma
    icons:
      - militia
      - scout-cavalry
  - villagers: 14
    assign:
      en: +1 → 2nd boar
      tr: +1 → 2. domuz
    icons:
      - food
  - villagers: 19
    assign:
      en: +5 → berries (build a Mill)
      tr: +5 → meyveye (bir Mill kur)
    icons:
      - food
      - mill
  - villagers: 23
    assign:
      en: +4 → wood (2nd Lumber Camp)
      tr: +4 → oduna (2. Lumber Camp)
    icons:
      - wood
      - lumber-camp
  - assign:
      en: Research Loom
      tr: Loom araştır
    note:
      en: Don't delay Loom — a Feudal Scout can snipe villagers
      tr: Loom'u geciktirme — Feudal bir Scout köylüleri avlayabilir
    icons:
      - loom
  - villagers: 27
    phase: feudal
    time: "12:35"
    assign:
      en: +4 → gold; click Feudal Age
      tr: +4 → altına; Feudal Age'e tıkla
    note:
      en: Eco split ~8 wood / 14 food / 4 gold
      tr: Ekonomi dağılımı ~8 odun / 14 yemek / 4 altın
    icons:
      - gold
  - assign:
      en: "Feudal: finish walling; keep harassing with Militia + Scout"
      tr: "Feudal: duvarı tamamla; Militia + Scout ile baskıyı sürdür"
    icons:
      - militia
      - scout-cavalry
  - villagers: 29
    assign:
      en: +2 → gold; build an Archery Range (2 vils) and a Blacksmith (1 vil)
      tr: +2 → altına; bir Archery Range (2 köylü) ve bir Blacksmith (1 köylü) kur
    icons:
      - gold
      - archery-range
      - blacksmith
  - phase: castle
    time: "16:05"
    assign:
      en: "Castle: mass Archers from 1 Range; research Double-Bit Axe, Horse Collar, Fletching"
      tr: "Castle: 1 Range'den Archer yığ; Double-Bit Axe, Horse Collar, Fletching araştır"
    note:
      en: Castle-first with an eco + tech lead
      tr: Ekonomi + teknoloji üstünlüğüyle Castle-first
    icons:
      - archer
      - double-bit-axe
