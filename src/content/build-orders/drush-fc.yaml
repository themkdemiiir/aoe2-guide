  - villagers: 6
    assign:
      en: 6 → sheep under the TC
      tr: 6 → TC altındaki koyunlara
    icons:
      - food
      - town-center
  - villagers: 10
    assign:
      en: +4 → wood (build a Lumber Camp)
      tr: +4 → oduna (bir Lumber Camp kur)
    icons:
      - wood
      - lumber-camp
  - villagers: 11
    assign:
      en: +1 → lure the first boar
      tr: +1 → ilk domuzu çek
    icons:
      - food
  - assign:
      en: +1 → 2 houses, then a Barracks; keep walling with palisades
      tr: +1 → 2 ev, ardından bir Barracks; palisade ile duvar örmeye devam et
    note:
      en: Front-place the Barracks for the Drush
      tr: Drush için Barracks'ı öne kur
    icons:
