slug: fc-crossbows
name:
  en: Fast Castle into Crossbows
  tr: Fast Castle into Crossbows
difficulty: intermediate
targetAge: castle
durationMin: 18
civsRecommended:
  - britons
  - ethiopians
  - vietnamese
  - mayans
  - chinese
steps:
  - villagers: 6
    assign:
      en: 6 → sheep under TC
      tr: 6 → TC altındaki koyunlara
    icons:
      - food
  - villagers: 9
    assign:
      en: +3 → wood, build lumber camp
      tr: +3 → oduna, Lumber Camp kur
    icons:
      - wood
      - lumber-camp
  - villagers: 12
    assign:
      en: +3 → berries, build mill
      tr: +3 → meyveye, Mill kur
    icons:
      - food
      - mill
  - villagers: 14
    assign:
      en: +2 → wood
      tr: +2 → oduna
    icons:
      - wood
  - villagers: 18
    assign:
      en: +4 → wood/sheep; click Feudal at 18 pop
      tr: +4 → odun/koyun; 18 nüfusta Feodal Çağ'a tıkla
    icons:
      - wood
  - villagers: 20
    assign:
      en: "Feudal: build Blacksmith + Market; 2 → gold (mining camp)"
      tr: "Feodal: Blacksmith + Market kur; 2 → altına (mining camp)"
    icons:
      - blacksmith
      - market
      - gold
  - villagers: 26
    assign:
      en: +6; click Castle Age at ~26 pop; add farms during
      tr: +6; ~26 nüfusta Kale Çağı'na tıkla; arada tarla aç
    icons:
      - farm
  - villagers: 28
    assign:
      en: "Castle: build 2 Archery Ranges; research Crossbow immediately"
      tr: "Kale: 2 Archery Range kur; hemen Crossbow araştır"
    icons:
      - archery-range
      - crossbowman
  - villagers: 30
    assign:
      en: +2 → gold; add farms continuously
      tr: +2 → altına; sürekli tarla açmaya devam et
    icons:
      - gold
      - farm
intro:
  en: >-
    **Goal:** Reach Castle Age with ~26 villagers, then mass Crossbowmen and Siege to dominate mid-game. **Recommended
    civs:** Britons (+1 range), Ethiopians (+2 pierce attack), Vietnamese (see opponent on start), Mayans (+25% archer
    HP), Chinese (extra starting resources)
  tr: >-
    **Hedef:** ~26 köylüyle Kale Çağı'na ulaş, ardından Crossbowmen ve Siege ile orta oyunu domine et. **Önerilen
    medeniyetler:** Britons (+1 menzil), Ethiopians (+2 delici saldırı), Vietnamese (oyun başında rakibi görme), Mayans
    (%25 ekstra okçu can), Chinese (ekstra başlangıç kaynakları)
strategy:
  en:
    - 6 villagers on sheep
    - 3 villagers on wood; Lumber Camp
    - 3 villagers to berries; Mill
    - 2 more villagers to wood (14 total)
    - 4 more villagers to wood/sheep (18 total)
    - No military — pure economy focus
    - Build Blacksmith + Market (Castle Age prerequisites)
    - 2 villagers to gold; Mining Camp
    - Continue TC production to 26 villagers
    - Add Farms; research Double-Bit Axe
    - Build 2 Archery Ranges immediately
    - Research Crossbow (high priority)
    - Produce Crossbowmen non-stop from both Ranges
    - Build Siege Workshop for Mangonel support
    - Add more gold villagers as queue grows
    - "**Weak against:** Knight rushes arriving before Mangonels are out; Skirmisher + cavalry mixes."
    - "**Strong against:** Infantry armies, other archer civs (out-ranges them with upgrades)."
  tr:
    - 6 köylü koyunlara
    - 3 köylü oduna; Lumber Camp
    - 3 köylü meyveye; Mill
    - 2 köylü daha oduna (toplam 14)
    - 4 köylü daha odun/koyuna (toplam 18)
    - Asker yok — yalnızca ekonomi odaklı
    - Blacksmith + Market kur (Kale Çağı ön koşulları)
    - 2 köylü altına; Mining Camp
    - TC üretimini 26 köylüye kadar sürdür
    - Tarla aç; Double-Bit Axe araştır
    - Hemen 2 Archery Range kur
    - Crossbow araştır (yüksek öncelik)
    - Her iki Range'den de sürekli Crossbowmen üret
    - Mangonel desteği için Siege Workshop kur
    - Kuyruk büyüdükçe daha fazla altın köylüsü ekle
    - "**Zayıf olduğu durum:** Mangonel çıkmadan önce gelen Knight rush'ları; Skirmisher + cavalry karışımları."
    - "**Güçlü olduğu durum:** Piyade orduları, diğer okçu medeniyetleri (yükseltmelerle onları menzilde geçer)."
