slug: fc-crossbows
name:
  en: Fast Castle into Crossbows
  tr: Fast Castle'dan Crossbows'a
difficulty: intermediate
targetAge: castle
durationMin: 16
civsRecommended:
  - britons
  - ethiopians
  - vietnamese
  - mayans
  - chinese
steps:
  - villagers: 6
    assign:
      en: 6 → sheep under the TC
      tr: 6 → TC altındaki koyunlara
    icons:
      - food
  - villagers: 10
    assign:
      en: +4 → wood; first builds a Lumber Camp
      tr: +4 → oduna; ilki Lumber Camp kurar
    icons:
      - wood
      - lumber-camp
  - villagers: 11
    assign:
      en: +1 → lure the first boar to the TC
      tr: +1 → ilk yaban domuzunu TC'ye çek
    icons:
      - food
  - villagers: 15
    assign:
      en: +4 → berries; first builds a Mill. Lure the second boar
      tr: +4 → meyveye; ilki Mill kurar. İkinci yaban domuzunu çek
    icons:
      - food
      - mill
  - villagers: 24
    assign:
      en: +9 → wood; build a second Lumber Camp. Add Farms as sheep run out
      tr: +9 → oduna; ikinci Lumber Camp kur. Koyun bitince Farm aç
    icons:
      - wood
      - farm
  - villagers: 27
    phase: feudal
    time: "11:00"
    assign:
      en: +3 → gold (Mining Camp); click Feudal at 27 pop
      tr: +3 → altına (Mining Camp); 27 nüfusta Feodal'a tıkla
    icons:
      - gold
      - mining-camp
  - villagers: 29
    time: "13:00"
    assign:
      en: "In Feudal: build Blacksmith + Market; +2 villagers; click Castle Age"
      tr: "Feodal'da: Blacksmith + Market kur; +2 köylü; Kale Çağı'na tıkla"
    icons:
      - blacksmith
      - market
  - villagers: 29
    phase: castle
    time: "15:30"
    assign:
      en: "Castle Age: build 2 Archery Ranges; research Crossbow immediately"
      tr: "Kale Çağı: 2 Archery Range kur; hemen Crossbow araştır"
    icons:
      - archery-range
      - crossbowman
  - villagers: 32
    assign:
      en: +3 → gold; keep adding Farms; mass Crossbowmen from both Ranges
      tr: +3 → altına; Farm açmaya devam; iki Range'den Crossbowmen yığ
    icons:
      - gold
      - farm
intro:
  en: >-
    **Goal:** Reach Castle Age at 27+2 villagers, then mass Crossbowmen to dominate the mid-game. A clean, generic Fast
    Castle economy — no military in Feudal, pure boom into Crossbows. **Recommended civs:** Britons (+1 range),
    Ethiopians (+2 pierce attack), Vietnamese (reveal opponent on start), Mayans (+25% archer HP), Chinese (extra
    starting resources).
  tr: >-
    **Hedef:** 27+2 köylüyle Kale Çağı'na ulaş, ardından Crossbowmen yığarak orta oyunu domine et. Tertemiz, jenerik bir
    Fast Castle ekonomisi — Feodal'da asker yok, saf boom ile Crossbows'a geç. **Önerilen medeniyetler:** Britons (+1
    menzil), Ethiopians (+2 delici saldırı), Vietnamese (oyun başında rakibi görme), Mayans (%25 ekstra okçu can),
    Chinese (ekstra başlangıç kaynakları).
strategy:
  en:
    - 6 villagers on sheep under the TC
    - 4 villagers to wood; build the first Lumber Camp
    - Lure the first boar with villager 11
    - 4 villagers to berries; build the Mill, then lure the second boar
    - 9 more villagers to wood; build a second Lumber Camp and add Farms
    - 3 villagers to gold (Mining Camp); click Feudal at 27 pop
    - In Feudal, build Blacksmith + Market and click Castle Age (29 pop)
    - In Castle Age, build 2 Archery Ranges and research Crossbow at once
    - Research Fletching, then Bodkin Arrow, for the range and attack edge
    - Produce Crossbowmen non-stop from both Ranges
    - Add a Siege Workshop for Mangonel support against Skirmishers
    - Add gold villagers and keep Farms up as the queue grows
    - "**Weak against:** Knights or Mangonels that arrive before your own Siege; heavy Skirmisher play."
    - "**Strong against:** Infantry armies and other archer civs (out-ranges them with upgrades)."
  tr:
    - 6 köylü TC altındaki koyunlara
    - 4 köylü oduna; ilk Lumber Camp'i kur
    - 11. köylüyle ilk yaban domuzunu çek
    - 4 köylü meyveye; Mill kur, sonra ikinci yaban domuzunu çek
    - 9 köylü daha oduna; ikinci Lumber Camp kur ve Farm aç
    - 3 köylü altına (Mining Camp); 27 nüfusta Feodal'a tıkla
    - Feodal'da Blacksmith + Market kur ve Kale Çağı'na tıkla (29 nüfus)
    - Kale Çağı'nda 2 Archery Range kur ve hemen Crossbow araştır
    - Menzil ve saldırı avantajı için Fletching, sonra Bodkin Arrow araştır
    - İki Range'den sürekli Crossbowmen üret
    - Skirmisher'lara karşı Mangonel desteği için Siege Workshop ekle
    - Kuyruk büyüdükçe altın köylüsü ekle ve Farm'ları ayakta tut
    - "**Zayıf olduğu durum:** Kendi Siege'inden önce gelen Knight ya da Mangonel'ler; yoğun Skirmisher oyunu."
    - "**Güçlü olduğu durum:** Piyade orduları ve diğer okçu medeniyetleri (yükseltmelerle menzilde geçer)."
source:
  author: AoE Companion
  url: https://aoecompanion.com/build-guides/fast-castle-boom
