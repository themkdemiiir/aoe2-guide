intro:
  en: >-
    **Goal:** Train 3 Militia in the Dark Age for early pressure, then transition into a two-range Archer push out of
    Feudal Age, attacking once you have 6–8 Archers backed by Fletching. **Recommended civs:** Britons, Mayans,
    Ethiopians, Vikings, Japanese
  tr: >-
    **Hedef:** Erken baskı için Karanlık Çağ'da 3 Militia eğit, ardından Feodal Çağ'dan iki ranged çıkışlı bir Archer
    atağına geç. Fletching destekli 6–8 Archer'ın hazır olduğu anda saldır. **Önerilen medeniyet'ler:** Britons, Mayans,
    Ethiopians, Vikings, Japanese
strategy:
  en:
    - 6 villagers on sheep (first villagers build 2 Houses first)
    - Villager 7 builds a Lumber Camp, then 4 villagers total on wood (through pop 10)
    - 1 villager lures the nearest Boar
    - 2 villagers build 2 Houses and a Mill by the berries, then gather berries
    - Lure the 2nd Boar around pop 16
    - 1 villager mines gold (3 Militia cost 60 gold total)
    - 1 villager builds a Barracks; train 3 Militia, then send the builder to sheep
    - New villagers to sheep through pop 21, then build Farms next to the TC / Mill (pop 22–24)
    - Villager 25 builds a Farm; research Loom
    - Send the 3 Militia toward the enemy base to harass villagers and scout
    - "When Feudal is clicked, reassign sheep gatherers: 7 villagers → wood, 4 villagers → gold at the Mining Camp"
    - Keep the Town Center producing villagers throughout the transition
    - Loom (before advancing)
    - (Optional) Double-Bit Axe for the wood economy
    - Build 2 Archery Ranges and a Blacksmith as Feudal lands
    - Send the next 4 villagers (pop 26–29) to gold to sustain Archer production
    - Begin producing Archers from both ranges immediately
    - Research Fletching at the Blacksmith before committing Archers to a fight
    - Send extra villagers to Farms as the wood/food balance allows
    - Once you have 6–8 Archers, attack the opponent's economy
    - >-
      This build layers Dark Age Militia harassment onto a greedier 25-pop Feudal timing, so the Archers arrive a little
      later than a pure 1-range rush but with two ranges producing at once. The early Militia buy time by forcing the
      opponent to react.
    - >-
      **Weak against:** Scout Cavalry, which beats Archers in the open before Fletching lands; massed Skirmishers (their
      high pierce armour hard-counters the archer line); opponents who wall early and ignore the Militia.
    - >-
      **Strong against:** Greedy fast-castle or boom openings; civs with no early military answer; opponents slow to
      wall who lose villagers to the Dark Age Militia.
  tr:
    - Koyuna 6 köylü (ilk köylüler önce 2 House kurar)
    - 7. köylü Lumber Camp kurar, ardından toplam 4 köylü oduna geçer (10. nüfusa kadar)
    - 1 köylü en yakın Boar'ı çeker
    - 2 köylü yemişlerin yanına 2 House ve Mill kurar, sonra yemiş toplar
    - 16. nüfus civarında 2. Boar'ı çek
    - 1 köylü Altın kazar (3 Militia toplam 60 Altın tutar)
    - 1 köylü Barracks kurar; 3 Militia eğit, sonra kurucu köylüyü koyuna gönder
    - 21. nüfusa kadar yeni köylüler koyuna, ardından TC / Mill yanına Farm kur (nüfus 22–24)
    - 25. köylü Farm kurar; Loom araştır
    - 3 Militia'yı düşman üssüne doğru gönder; köylüleri rahatsız et ve keşif yap
    - "Feodal'a tıklayınca koyun toplayıcıları yeniden ata: 7 köylü → odun, 4 köylü → Mining Camp'te Altın"
    - Geçiş süresince Town Center'dan köylü üretmeye devam et
    - Loom (çağ atlamadan önce)
    - (İsteğe bağlı) Odun ekonomisi için Double-Bit Axe
    - Feodal gelince 2 Archery Range ve 1 Blacksmith kur
    - Sonraki 4 köylüyü (nüfus 26–29) Archer üretimini sürdürmek için Altın'a gönder
    - Her iki range'dan hemen Archer üretmeye başla
    - Archer'ları savaşa sokmadan önce Blacksmith'te Fletching araştır
    - Odun/Yiyecek dengesi izin verince fazla köylüleri Farm'a gönder
    - 6–8 Archer'ın hazır olduğu anda rakibin ekonomisine saldır
    - >-
      Bu build, Karanlık Çağ Militia tacizini daha açgözlü bir 25-nüfus Feodal zamanlamasıyla birleştirir; Archer'lar
      saf 1-range rush'a göre biraz geç gelir ama iki range aynı anda üretir. Erken Militia, rakibi tepki vermeye
      zorlayarak zaman kazandırır.
    - >-
      **Zayıf olduğu durumlar:** Scout Cavalry, Fletching gelmeden açık alanda Archer'ı döver; yığın Skirmisher'lar
      (yüksek delici zırhları Archer hattını sert counter'lar); erken duvar kurup Militia'yı görmezden gelen rakipler.
    - >-
      **Güçlü olduğu durumlar:** Açgözlü fast-castle veya boom açılışları; erken asker yanıtı olmayan medeniyetler;
      Karanlık Çağ Militia'sına köylü kaybeden, duvarı geç kuran rakipler.
