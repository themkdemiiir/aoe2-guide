slug: maa-into-skirms
name:
  en: Man-at-Arms Into Skirms
  tr: Man-at-Arms Sonrası Skirmiş
difficulty: intermediate
targetAge: feudal
durationMin: 9
civsRecommended: []
steps:
  - villagers: 6
    assign:
      en: 6 → sheep under the Town Center
      tr: 6 → Şehir Merkezi'nin altındaki koyunlar
    icons:
      - food
      - town-center
  - villagers: 9
    assign:
      en: +3 → wood, drop a Lumber Camp
      tr: +3 → odun, bir Kereste Kampı kur
    icons:
      - wood
      - lumber-camp
  - villagers: 10
    assign:
      en: +1 → lure and eat the first boar
      tr: +1 → ilk yaban domuzunu çek ve ye
    icons:
      - food
  - villagers: 11
