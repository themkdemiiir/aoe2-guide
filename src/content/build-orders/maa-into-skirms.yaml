      tr: Scout'unla bir iki geyiği Değirmen menziline çek
    note:
      en: Free food that keeps your eco on hunt longer
      tr: Ekonomiyi daha uzun süre avda tutan bedava yiyecek
    icons:
      - scout-cavalry
      - food
  - villagers: 13
    assign:
      en: +2 → Mill (berries)
      tr: +2 → Değirmen (çalı meyveleri)
    icons:
      - mill
      - food
  - villagers: 14
    assign:
      en: +1 → lure and eat the second boar
      tr: +1 → ikinci yaban domuzunu çek ve ye
    note:
      en: Bring it in as the first boar runs low
      tr: İlk domuz azalmaya başlayınca ikincisini getir
    icons:
      - food
  - villagers: 16
    assign:
      en: +2 → hunt (boar and deer)
      tr: +2 → av (domuz ve geyik)
    icons:
      - food
  - assign:
      en: +1 → build a Barracks and a House at the front of your base
      tr: +1 → üssünün ön tarafına bir Kışla ve bir Ev kur
    icons:
