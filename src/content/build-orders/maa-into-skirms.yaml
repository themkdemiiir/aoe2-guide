      - house
  - villagers: 19
    phase: feudal
    time: "9:15"
    assign:
      en: +2 → hunt, research Loom, then click up to Feudal
      tr: +2 → av, Loom araştır, sonra Feudal'a tıkla
    note:
      en: Land with roughly 3 on wood and 15 on food
      tr: Çağ atladığında yaklaşık 3 odunda, 15 yiyecekte ol
    icons:
