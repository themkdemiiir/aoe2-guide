      - double-bit-axe
      - horse-collar
  - assign:
      en: Build an Archery Range at the front; send the straggler-tree Villager onto farms; start Skirmishers
      tr: >-
        Ön tarafa bir Okçuluk Menzili kur; üs çevresindeki tek tük ağaçtan kesen Köylü'yü tarlalara al; Skirmiş üretmeye
        başla
    icons:
      - archery-range
      - skirmisher
      - farm
  - assign:
      en: Build a Blacksmith, research Fletching, and keep adding Man-at-Arms
      tr: Bir Demirci kur, Fletching araştır ve Man-at-Arms eklemeye devam et
    icons:
      - blacksmith
      - fletching
      - man-at-arms
  - assign:
      en: Research Arson once you have 7-8 Man-at-Arms, then Infantry and Skirmisher armor; Wheelbarrow at 14-16 farms
      tr: 7-8 Man-at-Arms olunca Arson araştır, sonra Piyade ve Skirmiş zırhı; 14-16 tarlada Wheelbarrow al
    icons:
      - arson
      - wheelbarrow
      - farm
intro:
  en: >-
    Hit Feudal Age around 9:15 with Militia already walking out, upgrade to Man-at-Arms, and back them with Skirmishers
    for a full-Feudal composition that beats most early army mixes.
  tr: >-
    Feudal Çağı'na 9:15 civarında Milisler çıkmış halde gir, onları Man-at-Arms'a yükselt ve Skirmişlerle destekleyerek
    erken ordu karışımlarının çoğunu yenen tam Feudal bir kompozisyon kur.
strategy:
  en:
    - >-
      This is a pure Feudal Age power play: Man-at-Arms do the damage while Skirmishers shield them from enemy Archers,
      giving you an army that answers almost anything an opponent can field before Castle Age.
    - >-
      Get the first three Militia out the moment you age up and start poking at the enemy's Villagers and woodlines —
      early pressure forces them onto defense and buys time for your eco to rebound from the aggressive opener.
    - >-
      Lead with Man-at-Arms and Double-Bit Axe, then layer in Skirmishers as soon as you see Archers; the two units
      cover each other's weaknesses, so keep the front line of melee in front of your ranged support.
    - >-
      Tech up steadily at the Blacksmith — Fletching first, then Infantry and Skirmisher armor — and add Arson once you
      have seven or eight Man-at-Arms so they tear through buildings and snowball any push.
    - >-
      Do not forget the economy behind the fight: seed farms off the dwindling hunt, take Wheelbarrow at 14-16 farms,
      and keep walling so the constant unit production never stalls your food or wood.
    - >-
      From a winning Feudal position you can keep grinding in Feudal or transition smoothly to Castle Age, folding the
      army and farm economy into Crossbows, Pikemen, or a Knight switch depending on the matchup.
  tr:
    - >-
      Bu saf bir Feudal Çağı güç hamlesidir: Hasarı Man-at-Arms verir, Skirmişler ise onları düşman Okçularından korur;
      böylece elinde, rakibin Kale Çağı'ndan önce ortaya koyabileceği hemen her şeye cevap verebilen bir ordu olur.
    - >-
      Çağ atlar atlamaz ilk üç Milis'i çıkar ve rakibin Köylülerini ve odun hatlarını dürtmeye başla — erken baskı onu
      savunmaya iter ve agresif açılıştan sonra ekonominin toparlanması için zaman kazandırır.
    - >-
      Önce Man-at-Arms ve Double-Bit Axe ile başla, Okçu görür görmez Skirmiş ekle; iki birim birbirinin zayıf yönünü
      kapatır, bu yüzden yakın dövüş hattını menzilli desteğin önünde tut.
    - >-
      Demirci'de istikrarlı tech çek — önce Fletching, sonra Piyade ve Skirmiş zırhı — ve yedi sekiz Man-at-Arms'a
      ulaşınca Arson al ki binaları parçalasınlar ve her baskıyı çığ gibi büyütsünler.
    - >-
      Savaşın arkasındaki ekonomiyi unutma: Azalan avdan tarlalar kur, 14-16 tarlada Wheelbarrow al ve sürekli birim
      üretimi yiyecek ya da odununu tıkamasın diye duvar örmeye devam et.
    - >-
      Kazanan bir Feudal konumdan Feudal'da öğütmeye devam edebilir ya da orduyu ve tarla ekonomisini eşleşmeye göre
      Crossbow, Pikeman veya bir Knight geçişine katarak akıcı bir şekilde Kale Çağı'na geçebilirsin.
