  - villagers: 19
    assign:
      en: Move 2 off food → gold and drop a Mining Camp; get 3 Militia out
      tr: Yiyecekten 2 kişiyi → altına al, bir Maden Kampı kur; 3 Milis çıkar
    icons:
      - gold
      - mining-camp
      - militia
  - villagers: 19
    assign:
      en: Send 5 off the hunt → wood and 3 off the hunt → berries
      tr: Avdan 5 kişiyi → oduna, 3 kişiyi → çalılara gönder
    icons:
