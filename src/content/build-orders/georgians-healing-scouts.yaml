slug: georgians-healing-scouts
name:
  en: Georgians Healing Scout Rush
  tr: Georgians İyileştiren Scout Rush
difficulty: advanced
targetAge: feudal
durationMin: 8
civsRecommended:
  - georgians
steps:
  - villagers: 7
    assign:
      en: 7 → sheep under the TC
      tr: 7 → TC altında koyunlar
    icons:
      - food
      - town-center
  - villagers: 8
    assign:
      en: +1 → lure and kill the first boar
      tr: +1 → ilk yaban domuzunu çekip öldür
    note:
      en: Eat the boar before the sheep run dry
      tr: Koyunlar bitmeden domuzu ye
    icons:
      - food
  - villagers: 11
    assign:
      en: +3 → join the boar under the TC
      tr: +3 → TC altındaki domuza katıl
    icons:
      - food
      - town-center
  - assign:
      en: Lure deer with the scout while the Mule Cart keeps exploring
      tr: Scout ile geyikleri çek; Mule Cart keşfe devam etsin
    note:
      en: No new villager — the TC stays on food
      tr: Yeni köylü yok — TC yemekte kalsın
    icons:
      - food
  - villagers: 12
    assign:
      en: +1 → build a house, then a mill on berries
      tr: +1 → bir ev yap, sonra meyvelere değirmen kur
    icons:
      - house
      - mill
  - villagers: 13
    assign:
      en: +1 → lure and eat the second boar
      tr: +1 → ikinci domuzu çek ve ye
    icons:
      - food
  - villagers: 16
    assign:
      en: +3 → hunt under the TC
      tr: +3 → TC altında ava
    icons:
      - food
  - villagers: 16
    phase: feudal
    time: "8:00"
    assign:
      en: Research Loom (or add one more villager), then click up to Feudal
      tr: Loom araştır (ya da bir köylü daha ekle), sonra Feudal'e tıkla
    note:
      en: Land at 16 pop on a pure 0-wood / 16-food split
      tr: 16 nüfusta saf 0 odun / 16 yemek dağılımıyla geç
    icons:
      - loom
  - villagers: 16
    assign:
      en: "Feudal: send 8 off hunt to a woodline with the Mule Cart; move 3 to berries (4 total)"
      tr: "Feudal: avdan 8 köylüyü Mule Cart ile bir odun hattına gönder; 3 köylüyü meyvelere taşı (toplam 4)"
    icons:
      - wood
      - lumber-camp
      - food
  - assign:
      en: Send 2 to a barracks at ~50–60% age-up, build a stable, research Double-Bit Axe, then wall both sides of your base
      tr: Çağ atlamanın ~%50–60'ında 2 köylüyü kışlaya gönder, ahır yap, Double-Bit Axe araştır, sonra üssünün iki tarafını da duvarla
    icons:
      - barracks
      - stable
      - double-bit-axe
  - assign:
      en: Harass with 3 scouts, research Horse Collar, and seed farms with all new villagers
      tr: 3 scout ile taciz et, Horse Collar araştır ve tüm yeni köylülerle tarlalar ek
    icons:
      - scout-cavalry
      - horse-collar
      - farm
  - assign:
      en: At 13–14 farms move 7 villagers to gold with the Mule Cart; add a blacksmith
      tr: 13–14 tarlada 7 köylüyü Mule Cart ile altına geçir; bir demirci ekle
    icons:
      - gold
      - blacksmith
intro:
  en: >-
    Land in Feudal at 16 pop around 8:00 and abuse the Georgian self-healing cavalry — roughly 10 HP per minute near
    home — to harass relentlessly without ever paying for repairs.
  tr: >-
    Yaklaşık 8:00'de 16 nüfusla Feudal'e geç ve Georgians'ın kendini iyileştiren süvarisini — üs yakınında dakikada
    yaklaşık 10 HP — kullanarak hiç tamir maliyeti ödemeden durmak bilmeyen bir taciz uygula.
strategy:
  en:
    - >-
      The healing bonus rewards constant hit-and-run: dive a villager line, retreat your scouts toward your own
      territory to top them off, then dive again. Wounded scouts that would die in any other rush survive here, so you
      can press far more aggressively.
    - >-
      The Mule Cart is your tempo trick. It lets you drop "lumber camps" anywhere and relocate gathering points
      instantly, so move it with your villagers when you shift from hunt to wood, then again when you open gold.
    - >-
      Tech your cavalry as it rolls: a blacksmith with Forging and Scale Barding Armor plus Bloodlines makes each scout
      hit harder and survive longer, multiplying the healing edge.
    - >-
      Aim for Castle Age as soon as the economy allows. The two clean follow-ups are 2-stable Knights for sustained map
      control, or a Castle for Monaspa if you want a heavier unique-unit push.
    - >-
      Once stable, add Bow Saw and gold mining, build a Fortified Church, and run monks for relics while you plant a
      second TC — the healing cavalry keeps the map contested the whole time.
  tr:
    - >-
      İyileştirme bonusu sürekli vur-kaç taktiğini ödüllendirir: köylü hattına dal, scout'larını kendi bölgene çekip
      canlarını doldur, sonra tekrar dal. Başka her rush'ta ölecek yaralı scout'lar burada hayatta kalır, böylece çok
      daha agresif baskı yapabilirsin.
    - >-
      Mule Cart senin tempo hilen. İstediğin yere "odun kampı" bırakmanı ve toplama noktalarını anında taşımanı sağlar;
      bu yüzden avdan oduna geçerken köylülerinle birlikte taşı, altına açarken bir kez daha taşı.
    - >-
      Süvarin döndükçe teknolojini geliştir: Forging, Scale Barding Armor ve Bloodlines içeren bir demirci her scout'u
      daha sert vurdurur ve daha uzun yaşatır; bu da iyileştirme avantajını katlar.
    - >-
      Ekonomi izin verir vermez Castle çağını hedefle. İki temiz devam yolu var: sürekli harita kontrolü için 2 ahırdan
      Knight, ya da daha ağır bir benzersiz birim baskısı istiyorsan Monaspa için bir Castle.
    - >-
      İşler oturunca Bow Saw ve altın madenciliğini ekle, bir Fortified Church kur ve relic toplamak için keşişler
      çıkar; bu sırada ikinci bir TC dik — iyileştiren süvari bu süre boyunca haritanın kontrolünü sürekli çekişmeli
      tutar.
source:
  author: Hera
