intro:
  en: >-
    Land in Feudal at 19 pop, throw down a single Archery Range, and pump Fletching-backed Archers before your opponent
    has a counter ready.
  tr: >-
    19 köylüde Feudal'a çık, tek bir Archery Range kur ve rakip karşılığını hazırlayamadan Fletching destekli
    Archer'ları üretmeye başla.
strategy:
  en:
    - >-
      This is the bread-and-butter ranged opening: one range, Double-Bit Axe to feed wood into Archers, and an early
      Blacksmith so Fletching is done before your first volley connects. Skip Horse Collar in Feudal — you want the wood
      and food going into military, not farm upgrades yet.
    - >-
      Keep gold healthy. Two miners go down on the click-up, two more follow shortly after; four on gold is enough to
      sustain steady Archer production without starving your wood line.
    - >-
      React to what you see. If the enemy commits to Scouts, a handful of Spearmen from the barracks plugs the hole
      cheaply; if they go Skirmishers, do not over-invest in Archers — bank resources and lean on the Castle transition
      instead.
    - >-
      Default follow-up is Castle Age with 10-15 Archers, then Crossbow plus Bodkin Arrow for a hard timing attack. Add
      a second Archery Range or a Stable depending on the matchup.
    - >-
      Britons can lean hardest into this: extra range from the civ bonus means a third range and Thumb Ring in Castle
      Age turn the Archer mass into a snowball.
  tr:
    - >-
      Bu, menzilli açılışın temel kalıbıdır: tek range, oduna akan üretimi besleyen Double-Bit Axe ve ilk yaylım ateşin
      hedefe varmadan Fletching'i bitirecek kadar erken bir Blacksmith. Feudal'da Horse Collar'ı atla — odun ve yiyecek
      tarla yükseltmesine değil askere gitsin.
    - >-
      Altını sağlam tut. İki madenci tıklamada, iki madenci hemen ardından iner; oduncuları aç bırakmadan sürekli Archer
      üretimini sürdürmek için altında dört köylü yeterli.
    - >-
      Gördüğüne göre tepki ver. Rakip Scout'a yüklenirse barracks'tan birkaç Spearman açığı ucuza kapatır; Skirmisher'a
      giderse Archer'a fazla yatırım yapma — kaynak biriktir ve Castle geçişine yaslan.
    - >-
      Varsayılan devamı, 10-15 Archer'la Castle Age'e çıkmak, ardından sert bir timing saldırısı için Crossbow ve Bodkin
      Arrow'dur. Eşleşmeye göre ikinci bir Archery Range veya Stable ekle.
    - >-
      Britons buna en çok yaslanabilir: medeniyet bonusundan gelen ekstra menzille Castle Age'de üçüncü range ve Thumb
      Ring, Archer kütlesini çığ gibi büyütür.
