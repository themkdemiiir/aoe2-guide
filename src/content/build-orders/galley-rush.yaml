intro:
  en: >-
    **Goal:** Reach Feudal Age around 10:00 and flood Galleys from two Docks to sink enemy Fishing Ships and
    deny the water. A few Dark-Age Fishing Ships fund the wood-and-gold economy that keeps Galleys coming.
    **Recommended civs:** Vikings (+10% wood from Docks), Portuguese (ships die slower), Italians (cheaper
    Docks + ships), Byzantines (Greek Fire in Castle Age), Malay (cheaper ships overall).
  tr: >-
    **Hedef:** 10:00 civarında Feodal Çağ'a ulaş ve iki Dock'tan Galley göndererek düşmanın Fishing Ship'lerini
    batır, suyu ele geçir. Karanlık Çağ'daki birkaç Fishing Ship, Galley üretimini sürdüren odun-altın
    ekonomisini fonlar. **Önerilen uygarlıklar:** Vikings (Dock'lardan %10 fazla odun), Portuguese (gemiler daha
    yavaş ölür), Italians (daha ucuz Dock + gemi), Byzantines (Kale Çağı'nda Greek Fire), Malay (gemiler genel
    olarak daha ucuz).
strategy:
  en:
    - 6 villagers on sheep under the TC
    - 4 villagers to wood; Lumber Camp near the shore
    - 1 villager builds a Dock on the shore; 1 lures the boar
    - Queue 4 Fishing Ships from the Dock onto deep-sea fish
    - 4 more villagers to food under the TC
    - 5 villagers to wood; research Loom
    - Click Feudal Age at 21 villagers (~8:45)
    - While advancing, send 3 villagers to gold and build a 2nd Dock
    - In Feudal (~10:00), pump Galleys non-stop from both Docks
    - Research Fletching for +1 Galley range
    - New TC villagers go to wood to sustain ship production
    - Use the Galley group to kill enemy Fishing Ships and deny their Dock
    - >-
      **Weak against:** Opponents who also double-Dock and match Galley count; Fire Ships hard-counter Galleys
      in Castle Age.
    - >-
      **Strong against:** Land civs forced onto water; opponents who skip a Dock; Fishing-Ship-dependent
      economies.
  tr:
    - TC altında 6 köylü koyunlarda
    - 4 köylü oduna; sahile yakın Lumber Camp
    - 1 köylü sahile Dock kurar; 1 köylü yaban domuzunu çeker
    - Dock'tan derin deniz balığına 4 Fishing Ship sıraya al
    - 4 köylü daha TC altında yiyeceğe
    - 5 köylü oduna; Loom araştır
    - 21 köylüde Feodal Çağ'a tıkla (~8:45)
    - Çağ atlarken 3 köylüyü altına gönder ve 2. Dock'u kur
    - Feodal'de (~10:00) iki Dock'tan durmadan Galley üret
    - +1 Galley menzili için Fletching araştır
    - Yeni TC köylüleri gemi üretimini sürdürmek için oduna gider
    - Galley grubuyla düşman Fishing Ship'lerini öldür ve Dock'larını engelle
    - >-
      **Zayıf yönü:** Rakip de çift Dock açar ve Galley sayısını tutturur; Fire Ship'ler Kale Çağı'nda Galley'lere
      karşı sert counter'dır.
    - "**Güçlü yönü:** Suya zorla sürülen kara uygarlıkları; Dock kurmayan rakipler; Fishing Ship'e bağımlı ekonomiler."
source:
  author: Sitaux AoE2 — Galley & Fire Rush
