intro:
  en: >-
    Reach Castle Age fast on the cheap Portuguese economy, flood the map center with Monks, and seize every relic before
    your opponent can react.
  tr: >-
    Ucuz Portekiz ekonomisiyle hızlıca Castle Çağı'na çık, harita merkezini Keşişlerle doldur ve rakibin tepki vermesine
    fırsat kalmadan tüm kalıntıları ele geçir.
strategy:
  en:
    - >-
      The whole plan hinges on relic control: two Monasteries near the center let you produce Monks in parallel and
      snatch relics first, turning the map into a permanent gold faucet.
    - >-
      Use the spearmen, scout, and a couple of escort villagers to screen your Monks while they walk relics home — an
      unguarded Monk is free food for enemy cavalry.
    - >-
      The 200-stone market sale is intentional: you trade unused stone for the food that buys your fast Castle click, so
      do not bank stone for towers here.
    - >-
      Once relics are secured, the gold income comfortably funds a Fast Imperial push; Portuguese Feitoria and
      discounted gold-cost units let you transition without ever mining out.
    - >-
      Weak against early Feudal pressure (archers or scout rushes) that arrives before your Monks and spears are ready —
      wall key approaches and keep your Town Center garrisoned if scouted.
    - >-
      Strong against greedy boom openings and knight-heavy plans, since Monks convert expensive cavalry and the relic
      lead snowballs.
  tr:
    - >-
      Planın tamamı kalıntı kontrolüne dayanır: merkeze yakın iki Manastır, Keşişleri paralel üretmeni ve kalıntıları
      önce kapmanı sağlar; bu da haritayı kalıcı bir altın çeşmesine çevirir.
    - >-
      Mızrakçıları, atlıyı ve birkaç refakatçi köylüyü, Keşişler kalıntıları eve taşırken onları korumak için kullan —
      korumasız bir Keşiş, düşman süvarisine bedava yem olur.
    - >-
      200 taş satışı bilinçlidir: kullanılmayan taşı, hızlı Castle tıklamasını finanse eden yiyeceğe dönüştürürsün; bu
      yüzden burada kule için taş biriktirme.
    - >-
      Kalıntılar güvenceye alındıktan sonra gelen altın geliri rahatça bir Fast Imperial atağını finanse eder;
      Portekiz'in Feitoria'sı ve indirimli altın maliyetli birimleri, altının asla tükenmediği bir geçiş sunar.
    - >-
      Keşişlerin ve mızrakçıların hazır olmasından önce gelen erken Feudal baskısına (okçu ya da atlı baskınları) karşı
      zayıftır — kritik geçişleri duvarla kapat ve keşfedilirsen TC'ni köylülerle doldur.
    - >-
      Açgözlü boom açılışlarına ve şövalye ağırlıklı planlara karşı güçlüdür; çünkü Keşişler pahalı süvarileri kendi
      tarafına çevirir ve kalıntı üstünlüğü çığ gibi büyür.
