intro:
  en: >-
    **Goal:** Reach Castle Age as fast as possible with enough resources to boom on extra Town Centers and
    economy upgrades. Only run this when you are safe from early pressure (Arena, Hideout, walls).
    **Recommended civs:** Burgundians, Poles, Bohemians, Portuguese, Bengalis
  tr: >-
    **Amaç:** Mümkün olan en hızlı şekilde Castle Age'e ulaşıp ek Town Center'lar ve ekonomi
    yükseltmeleriyle boom yapacak kadar kaynak biriktirmek. Bunu yalnızca erken baskıdan güvendeysen
    oyna (Arena, Hideout, duvarlar). **Önerilen medeniyetler:** Burgundians, Poles, Bohemians, Portuguese, Bengalis
strategy:
  en:
    - 6 villagers on sheep under the TC
    - 3 villagers on wood — the first builds the lumber camp, then all gather wood
    - 1 villager lures the first boar
    - 1 villager builds a house, then a Mill on the berries
    - Lure 3 deer into the TC with your scout (highly recommended)
    - 2 villagers hunt under the TC; re-task one to lure the second boar
    - 4 villagers on berries
    - Seed 4 farms with the sheep villagers as the boars run out
    - 4 more villagers on wood — keep a single lumber camp
    - 2 villagers on gold — build the gold mining camp
    - Click Feudal Age at 23 pop (perfect landing ~10:30)
    - When food under the TC runs out, send spare vils to straggler trees
    - 1 villager builds the Blacksmith, 2 villagers build the Market (no military)
    - 2 more villagers on wood, then click Castle Age at 25 pop (perfect landing ~14:00)
    - Research Double-Bit Axe and Horse Collar
    - Build a 2nd TC on a woodline away from the lumber camp
    - Research Bow Saw
    - Build a 3rd TC on the secondary gold or main stone if possible
    - Use the Market to buy food or wood whenever you can afford it
    - Keep booming a few minutes — get Wheelbarrow around 18 farms, then Handcart
    - Mine stone and add a 4th TC whenever you want, then head to Imperial Age
  tr:
    - 6 köylü TC altındaki koyunlara
    - 3 köylü odunda — ilki Lumber Camp kurar, sonra hepsi odun toplar
    - 1 köylü ilk domuzu çeker
    - 1 köylü House kurar, sonra meyvelerin üstüne Mill
    - Scout ile TC'ye 3 geyik çek (şiddetle önerilir)
    - 2 köylü TC altında avlanır; birini ikinci domuzu çekmeye gönder
    - 4 köylü meyvede
    - Domuzlar bitince koyun köylüleriyle 4 Farm ek
    - 4 köylü daha odunda — tek Lumber Camp'te kal
    - 2 köylü altında — altın Mining Camp'i kur
    - 23 nüfusta Feudal Age'e tıkla (ideal varış ~10:30)
    - TC altındaki yiyecek bitince fazla köylüleri tek tük ağaçlara gönder
    - 1 köylü Blacksmith, 2 köylü Market kurar (asker yok)
    - 2 köylü daha odunda, sonra 25 nüfusta Castle Age'e tıkla (ideal varış ~14:00)
    - Double-Bit Axe ve Horse Collar araştır
    - Lumber Camp'ten uzakta bir odun hattına 2. TC kur
    - Bow Saw araştır
    - Mümkünse ikincil altına veya ana taşa 3. TC kur
    - Gücün yettikçe Market'ten food veya wood almak için kullan
    - Birkaç dakika daha boom yap — ~18 Farm'da Wheelbarrow, sonra Handcart al
    - İstediğin zaman taş çıkarıp 4. TC ekle, ardından Imperial Age'e geç
