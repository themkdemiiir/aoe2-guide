intro:
  en: >-
    **Goal:** Reach Castle Age as quickly as possible, then immediately deploy additional Town Centers to multiply
    villager production. **Recommended civs:** Chinese, Britons, Franks, Teutons, Vikings
  tr: >-
    **Amaç:** Mümkün olan en hızlı şekilde Castle Age'e ulaşmak, ardından hemen ek Town Center'lar kurarak köylü
    üretimini katlamak. **Önerilen medeniyetler:** Chinese, Britons, Franks, Teutons, Vikings
strategy:
  en:
    - 6 villagers on sheep (vils 4–6 join the starting three)
    - 4 villagers on wood (vil 7 builds the lumber camp, then all gather wood)
    - 1 villager lures the first boar (vil 11)
    - 5 villagers on berries — build 2 houses and a Mill next to the berries first, then gather (vils 12–16)
    - Re-task one of the boar villagers to lure the second boar
    - 2 villagers seed farms next to the TC or Mill (vils 17–18)
    - 5 villagers on wood — build a 2nd lumber camp and a house, then gather wood (vils 19–23)
    - 3 villagers on gold — build the gold mining camp, then mine (vils 24–26)
    - Take 1 villager from wood to build the Blacksmith
    - Take 2 villagers from wood to build the Market
    - Sell excess stone at the Market if short on food or gold
    - No military buildings in Feudal Age
    - Research Double-Bit Axe in the Lumber Camp during Feudal Age
    - Click Castle Age as soon as the Blacksmith and Market are placed
    - No military production in Feudal Age
    - Pour every resource into the age-up
    - Buy 100 stone at the Market if you intend to build a fourth Town Center
    - Immediately build 2 additional Town Centers next to resources, pulling 4 villagers from each woodline
    - An optional fourth Town Center requires purchasing 100 stone via the Market
    - Research Horse Collar in the Mill to boost farming
    - Transition sheep villagers onto Farms as the sheep deplete
    - By 20 minutes you should have 40+ villagers producing continuously
    - >-
      Fast Castle Boom is the canonical defensive/economic strategy. The entire early game is dedicated to reaching
      Castle Age as quickly as possible, then exploding the economy with extra Town Centers.
    - >-
      **Weak against:** Feudal all-in rushes that breach walls before Castle Age; Scout Rush that forces premature
      military spending.
    - "**Strong against:** Slow boom strategies; opponents also going for Castle Age without military pressure."
  tr:
    - 6 köylü koyunda (4–6. köylüler başlangıçtaki üçe katılır)
    - 4 köylü odunda (7. köylü Lumber Camp'i kurar, sonra hepsi odun toplar)
    - 1 köylü ilk domuzu çeker (11. köylü)
    - 5 köylü meyvede — önce meyvelerin yanına 2 House ve bir Mill kur, sonra topla (12–16. köylüler)
    - Mevcut bir domuz köylüsünü ikinci domuzu çekmesi için yeniden görevlendir
    - 2 köylü TC veya Mill yanına Farm eker (17–18. köylüler)
    - 5 köylü odunda — 2. Lumber Camp ve bir House kur, sonra odun topla (19–23. köylüler)
    - 3 köylü altında — altın Mining Camp'i kur, sonra çıkar (24–26. köylüler)
    - Blacksmith'i kurmak için odundan 1 köylü al
    - Market'i kurmak için odundan 2 köylü al
    - Yiyecek veya altın sıkıntısı varsa Market'te fazla taşı sat
    - Feudal Age'de asker binası yok
    - Feudal Age sırasında Lumber Camp'te Double-Bit Axe araştır
    - Blacksmith ve Market yerleştirilir yerleştirilmez Castle Age'e tıkla
    - Feudal Age'de asker üretimi yok
    - Her kaynağı yaş geçişine yönlendir
    - Dördüncü bir Town Center kurmayı planlıyorsan Market'ten 100 taş al
    - Her odun hattından 4 köylü çekerek hemen kaynakların yanına 2 ek Town Center kur
    - İsteğe bağlı dördüncü Town Center için Market'ten 100 taş satın almak gerekir
    - Çiftçiliği güçlendirmek için Mill'de Horse Collar araştır
    - Koyunlar tükendikçe koyun köylülerini Farm'lara geçir
    - 20. dakikaya kadar 40+ köylünün sürekli üretim yapması gerekir
    - >-
      Fast Castle Boom, kanonik savunmacı/ekonomik stratejidir. Oyunun tüm erken evresi mümkün olan en hızlı şekilde
      Castle Age'e ulaşmaya, ardından ek Town Center'larla ekonomiyi patlatmaya adanmıştır.
    - >-
      **Zayıf olduğu:** Castle Age'den önce duvarları aşan Feudal all-in baskınları; erken askeri harcamayı zorlayan
      Scout Rush.
    - "**Güçlü olduğu:** Yavaş boom stratejileri; askeri baskı yapmadan Castle Age'e geçmeye çalışan rakipler."
