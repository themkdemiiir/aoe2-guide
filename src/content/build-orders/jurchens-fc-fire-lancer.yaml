intro:
  en: >-
    A greedy Fast Castle that skips Feudal military and lands on the Jurchens' food-free Fire Lancers and siege for a
    relentless mid-game push.
  tr: >-
    Feudal askerini atlayıp Jurchens'in yemek gerektirmeyen Fire Lancer ve kuşatmasına inen, açgözlü bir Fast Castle ile
    durdurulamaz bir orta oyun baskısı.
strategy:
  en:
    - >-
      Play the Dark and Feudal Age safe and economic — small-wall your wood and gold lines and add a defensive Tower if
      pressured rather than committing to military before Castle Age.
    - >-
      The whole plan hinges on the ~14:00 Castle timing. Hold your stone instead of selling it, because a Tower can buy
      the time you need against an aggressive opponent.
    - >-
      After aging up, double down on wood: pull villagers off the Town Center, add a 2nd Lumber Camp, and put up 2
      Barracks so both can produce Fire Lancers at once.
    - >-
      Research infantry armor and skip the economy upgrades — Fire Lancers and siege both cost no food, so wood and gold
      are what actually power your army.
    - >-
      Push out with a forward Siege Workshop alongside the Fire Lancers; the combination melts buildings and clusters
      while keeping your food banked for a follow-up.
    - >-
      This is aggressive but not a full all-in — keep around 5 villagers on food so you can recover and transition if
      the rush stalls.
  tr:
    - >-
      Karanlık ve Feudal Çağı güvenli ve ekonomik oyna — odun ve altın hatlarını kısmen duvarla, baskı görürsen Kale
      Çağı'ndan önce askere yatırım yapmak yerine savunma Kulesi dik.
    - >-
      Tüm plan ~14:00 Castle zamanlamasına bağlı. Taşını satmak yerine elinde tut, çünkü bir Kule agresif bir rakibe
      karşı ihtiyacın olan zamanı kazandırabilir.
    - >-
      Çağ atladıktan sonra oduna yüklen: köylüleri Şehir Merkezi'nden çek, 2. Kereste Kampı kur ve 2 Kışla dik ki ikisi
      de aynı anda Fire Lancer üretsin.
    - >-
      Piyade zırhını araştır ve ekonomi yükseltmelerini atla — Fire Lancer ve kuşatma yemek gerektirmediği için ordunu
      asıl besleyen şey odun ve altındır.
    - >-
      Fire Lancer'larla birlikte öne bir Kuşatma Atölyesi çıkar; bu kombinasyon binaları ve yığılmış birlikleri
      eritirken yemeğini bir sonraki hamle için bankada tutar.
    - >-
      Bu agresif ama tam bir all-in değil — yaklaşık 5 köylüyü yemekte tut ki rush takılırsa toparlanıp geçiş
      yapabilesin.
