intro:
  en: >-
    Poke with early Spearmen to deny the enemy opening, then Fast Castle into a Fortified Church that floods the map
    with Warrior Priests and locks down the relics.
  tr: >-
    Erken Spearman'lerle dürterek düşmanın açılışını engelle, ardından Fast Castle yaparak haritayı Warrior Priest'lerle
    dolduran ve kalıntıları (relic) kilitleyen bir Fortified Church'e geç.
strategy:
  en:
    - >-
      The two or three early Spearmen plus your Scout are a low-cost insurance package: they shut down an opponent's
      Scout opening and buy the time your Fast Castle needs, without bleeding real resources off the climb.
    - >-
      Wall as you go. A slow palisade with three villagers around the boar and hunt keeps the build safe so the Spear
      pressure never has to convert into a full defensive stand.
    - >-
      Out of Castle Age, drop a Fortified Church in a defensible spot and immediately spam Warrior Priests — their job
      is to grab relics, not to fight. Aim to lock down as many as six relics for a long gold trickle that funds
      everything that follows.
    - >-
      Take Bow Saw early so the wood economy keeps up with non-stop Warrior Priest and building production, on top of
      the Double-Bit Axe and Horse Collar you queued on the way up.
    - >-
      This is an Armenian-only plan: their Fortified Church and Warrior Priests are what make the relic lockdown
      possible, so the build does not transfer to other civilizations.
    - >-
      Relic income is a slow burn — protect the Church and the priests with walls and a few Spearmen, and convert the
      steady gold into whatever Castle Age army your matchup demands.
  tr:
    - >-
      İki-üç erken Spearman ve Scout, düşük maliyetli bir sigorta paketi oluşturur: rakibin Scout açılışını durdurur ve
      Fast Castle'ın ihtiyaç duyduğu zamanı kazandırırlar, üstelik yükselişten gerçek kaynak çekmeden.
    - >-
      İlerledikçe duvar ör. Domuz ve avlanma hattı çevresinde üç köylüyle örülen yavaş bir palisade build'i güvende
      tutar, böylece Spear baskısı asla tam bir savunma duruşuna dönüşmek zorunda kalmaz.
    - >-
      Castle Age'e geçince savunmaya uygun bir noktaya bir Fortified Church kur ve hemen Warrior Priest yığ — görevleri
      savaşmak değil, kalıntı toplamaktır. Uzun bir altın akışı için altıya kadar kalıntıyı kilitlemeyi hedefle; bu,
      sonrasında gelen her şeyi finanse eder.
    - >-
      Bow Saw'u erken al ki odun ekonomisi durmaksızın süren Warrior Priest ve bina üretimine yetişsin; bunun üstüne
      yükselirken sıraya aldığın Double-Bit Axe ve Horse Collar da gelir.
    - >-
      Bu yalnızca Armenian'a özel bir plandır: kalıntı kilidini mümkün kılan şey onların Fortified Church'ü ve Warrior
      Priest'leridir, dolayısıyla build başka medeniyetlere aktarılamaz.
    - >-
      Kalıntı geliri yavaş yanan bir ateş gibidir — Church'ü ve rahipleri duvarlar ve birkaç Spearman ile koru,
      istikrarlı altını matchup'ının gerektirdiği Castle Age ordusuna çevir.
