intro:
  en: >-
    **Goal:** Control the water with Fire Galleys while applying land pressure with Archers, using a Fishing Ship
    economy to fund a smooth two-front push into Castle Age. **Recommended civs:** Italians (cheaper Docks + ships,
    cheaper Fire Galleys), Japanese (faster-training warships, strong archers), Vikings (cheaper, tankier navy),
    Byzantines (cheap counter-units, strong Fire Ship line), Portuguese (+HP ships, gold discount)
  tr: >-
    **Hedef:** Fire Galley'lerle suyu kontrol ederken Archer'larla karada baskı kur; iki cepheli bu hamleyi Kale Çağı'na
    kadar finanse etmek için Fishing Ship ekonomisini kullan. **Önerilen uygarlıklar:** Italians (daha ucuz Dock + gemi,
    daha ucuz Fire Galley), Japanese (daha hızlı üretilen savaş gemileri, güçlü okçular), Vikings (daha ucuz ve
    dayanıklı deniz kuvvetleri), Byzantines (ucuz counter birimleri, güçlü Fire Ship hattı), Portuguese (+can gemiler,
    altın indirimi)
strategy:
  en:
    - 3 villagers build 2 houses, then to sheep; queue villagers non-stop at the Town Center
    - 4 villagers to wood with a Lumber Camp
    - Lure the first boar around 11–12; build a Dock near deep fish plus a second house
    - Queue 4 Fishing Ships from the Dock onto the deep fish
    - More villagers to wood; lure the second boar; spread spare villagers across sheep and boar
    - Research Loom, then click Feudal Age at 21 population
    - >-
      While advancing: pull a second Lumber Camp from straggler trees, build a Gold Mining Camp (4 villagers), and place
      a Barracks toward your front
    - Research Double-Bit Axe in the Lumber Camp
    - Train Fire Galleys from the Dock to take water control
    - Build a house and 2 Archery Ranges near your front; train Archers non-stop
    - New villagers to gold (toward 24); add a Mill on berries
    - Build a Blacksmith and research Fletching for archer range
    - Research Wheelbarrow; transition wood villagers onto Farms as fish/boar deplete
    - Add a final villager to gold and click Castle Age at ~35 population
    - >-
      **Weak against:** Dedicated Galley floods that out-mass your Fire Galleys before they tech up; heavy Skirmisher
      civs that shut down the Archer half on land; opponents who out-boom on a closed map where your navy adds little.
    - >-
      **Strong against:** Greedy Fast Castle players who skip Feudal military; pure-water builds caught without Fire
      Ship counters; land-focused civs forced to split attention between shore and front.
  tr:
    - 3 köylü 2 ev inşa eder, ardından koyunlara geçer; Town Center'da köylü üretimini hiç kesme
    - 4 köylü Lumber Camp kurarak oduna gider
    - 11–12. köylüde ilk domuzu çek; derin balığın yanına Dock ve ikinci evi kur
    - Dock'tan 4 Fishing Ship üretip derin balıklara gönder
    - Daha fazla köylüyü oduna yönlendir; ikinci domuzu çek; artık köylüleri koyun ve domuz arasında dağıt
    - Loom araştır, ardından 21 nüfusta Feodal Çağ'a tıkla
    - >-
      Çağ atlarken: ıssız ağaçlardan ikinci bir Lumber Camp çek, 4 köylüyle Gold Mining Camp kur ve cephe hattına
      Barracks yerleştir
    - Lumber Camp'te Double-Bit Axe araştır
    - Dock'tan Fire Galley üretip su kontrolünü ele geçir
    - Cephe hattına yakın bir ev ve 2 Archery Range kur; Archer üretimini hiç kesme
    - Yeni köylüleri altına yönlendir (24'e doğru); çileklere Mill ekle
    - Blacksmith kur ve okçu menzili için Fletching araştır
    - Wheelbarrow araştır; balık ve domuz azaldıkça odun köylülerini Tarlalara aktar
    - Son bir köylüyü altına ekle ve yaklaşık 35 nüfusta Kale Çağı'na tıkla
    - >-
      **Zayıf olduğu durumlar:** Galley seli ile Fire Galley'lerini teknik geliştirme yapamadan bastıran rakipler;
      karadaki Archer yarısını kapatan ağır Skirmisher medeniyetleri; deniz kuvvetlerinin pek katkı sunmadığı kapalı
      haritalarda daha hızlı boom yapan rakipler.
    - >-
      **Güçlü olduğu durumlar:** Feodal askeri atlayan açgözlü Fast Castle oyuncuları; Fire Ship counter'ı olmadan
      yakalanan saf su yapıları; sahil ve cephe arasında dikkat bölmek zorunda kalan kara odaklı medeniyetler.
