intro:
  en: >-
    Race to Castle Age behind your walls, then flood the center with monks and a handful of Light Cavalry to scoop up
    every relic before your opponent reacts.
  tr: >-
    Surlarının arkasında Kale Çağı'na koş, ardından merkezi keşişler ve birkaç Light Cavalry ile doldurup rakip daha
    tepki veremeden tüm kalıntıları kap.
strategy:
  en:
    - >-
      This is an Arena build first and foremost: you skip all Feudal military, so wall your choke early and treat the
      open center as the only contested ground.
    - >-
      The Stable and Barracks in Feudal exist mainly to unlock Castle Age and give you a fast military option — don't
      over-invest, just keep clicking toward 14:50.
    - >-
      The instant Castle lands, get a Monastery down and start pumping monks. Relics are the whole point: each one is a
      slow trickle of gold that funds your late game while denying it to the enemy.
    - >-
      Build Light Cavalry only when the relic run is contested. A small pack escorts your monks and snipes enemy monks
      or scouts; if the center is quiet, skip them and pour resources into your economy instead.
    - >-
      Bow Saw and a fresh Town Center keep your wood and villager count climbing while the monks work, so you transition
      into a boom without missing a beat.
    - >-
      Aim to control four-plus relics, then choose your follow-up: a knight-and-siege push if you grabbed map control,
      or a straight boom into Imperial if the game has gone quiet.
  tr:
    - >-
      Bu her şeyden önce bir Arena build order'ıdır: tüm Feudal askerini atladığın için geçidini erken çevir ve açık
      merkezi tek çekişme alanı olarak gör.
    - >-
      Feudal'daki Ahır ve Kışla esas olarak Kale Çağı'nı açmak ve sana hızlı bir askeri seçenek sunmak için var — fazla
      yatırım yapma, sadece 14:50'ye doğru tıklamaya devam et.
    - >-
      Kale iner inmez hemen bir Manastır kur ve keşiş basmaya başla. Asıl mesele kalıntılar: her biri, geç oyununu
      finanse eden yavaş bir altın akışı sağlarken rakibi de bu gelirden mahrum bırakır.
    - >-
      Light Cavalry'yi yalnızca kalıntı yarışı çekişmeliyse üret. Küçük bir grup, keşişlerine eşlik eder ve düşman
      keşişlerini ya da kâşiflerini avlar; merkez sakinse onları atla ve kaynakları ekonomine yatır.
    - >-
      Bow Saw ve yeni bir Şehir Merkezi, keşişler çalışırken odununu ve köylü sayını artırmaya devam eder; böylece hiç
      aksamadan boom'a geçersin.
    - >-
      Dört veya daha fazla kalıntıyı kontrol etmeyi hedefle, sonra devamını seç: harita kontrolünü ele geçirdiysen
      şövalye-kuşatma baskısı ya da oyun sakinleştiyse doğrudan Imperial'e boom.
