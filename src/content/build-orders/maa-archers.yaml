slug: maa-archers
name:
  en: 18 Pop Generic Man-at-Arms Rush
  tr: 18 Köylü Genel Man-at-Arms Baskını
difficulty: intermediate
targetAge: feudal
durationMin: 9
civsRecommended: []
steps:
  - villagers: 6
    assign:
      en: 6 → sheep under the Town Center
      tr: 6 → Şehir Merkezi altındaki koyunlar
    icons:
      - food
      - town-center
  - villagers: 9
    assign:
      en: +3 → wood, drop a Lumber Camp; use Houses to start a wall
      tr: +3 → odun, bir Kereste Kampı kur; Evlerle duvar örmeye başla
    icons:
      - wood
      - lumber-camp
      - house
  - villagers: 10
    assign:
      en: +1 → lure the first boar, then lure at least 2 deer once both boars are found
      tr: +1 → ilk yaban domuzunu çek, ardından iki yaban domuzunu da bulunca en az 2 geyik çek
    note:
      en: The deer lure is mandatory — this build leans on the extra hunt food
      tr: Geyik çekmek zorunlu — bu açılış fazladan av etine dayanıyor
    icons:
      - food
  - villagers: 15
    assign:
      en: +5 → hunt under the Town Center (eat through the second boar when needed)
      tr: +5 → Şehir Merkezi altında av (gerektiğinde ikinci yaban domuzunu bitir)
    icons:
      - food
  - villagers: 18
    time: "8:50"
    assign:
      en: +2 → hunt; build a Barracks then a front House, find your sheep, scout the enemy, research Loom, then click up to Feudal
      tr: +2 → av; bir Kışla sonra cephede bir Ev kur, koyunlarını bul, rakibi keşfet, Loom araştır, sonra Feudal'a tıkla
    note:
      en: Click up around 8:50 with roughly 3 on wood and 14 on food
      tr: Yaklaşık 8:50'de, 3 köylü odunda ve 14 köylü yiyecekte iken Feudal'a tıkla
    icons:
      - food
      - barracks
      - loom
  - villagers: 18
    phase: feudal
    assign:
      en: "Feudal: move 5 from the hunt → wood (now 8 on wood, 9 on food)"
      tr: "Feudal: avdan 5 köylüyü → oduna kaydır (artık 8 odunda, 9 yiyecekte)"
    icons:
      - wood
      - lumber-camp
  - villagers: 18
    assign:
      en: 2 (hunt + Barracks builder) → gold, drop a Mining Camp (now 8 wood, 7 food, 2 gold); pump 3 Militia out and research Man-at-Arms
      tr: 2 köylü (av + Kışla inşaatçısı) → altın, bir Maden Kampı kur (artık 8 odun, 7 yiyecek, 2 altın); 3 Milis bas ve Man-at-Arms araştır
    icons:
      - gold
      - mining-camp
      - man-at-arms
  - villagers: 18
    assign:
      en: 1 → build a Mill at the berries; research Double-Bit Axe
      tr: 1 köylü → çilekte bir Değirmen kur; Double-Bit Axe araştır
    icons:
      - mill
      - double-bit-axe
  - villagers: 23
    assign:
      en: +5 → berries, then seed Farms as the hunt runs out
      tr: +5 → çilek, av bitince Tarla ek
    icons:
      - food
      - farm
  - villagers: 25
    assign:
      en: Build an Archery Range once you can afford it; +2 → gold
      tr: Gücün yetince bir Okçu Menzili kur; +2 → altın
    icons:
      - archery-range
      - gold
  - assign:
      en: Wall up while adding Archers, Spearmen, or a tower as needed; add a Blacksmith and research Fletching, then send Archers in to attack
      tr: Gerektiğinde Okçu, Mızrakçı veya kule ekleyerek duvar ör; bir Demirci ekle ve Fletching araştır, sonra Okçuları saldırıya gönder
    icons:
      - archer
      - blacksmith
      - fletching
intro:
  en: >-
    Hit Feudal Age around 8:50 on any civilization and open with 3 Militia upgraded into Man-at-Arms, then snowball the
    pressure into a wave of Archers.
  tr: >-
    Herhangi bir uygarlıkla yaklaşık 8:50'de Feudal Çağ'a çık; 3 Milis'i Man-at-Arms'a yükselterek aç, ardından baskıyı
    bir Okçu dalgasıyla büyüt.
strategy:
  en:
    - >-
      This is the all-purpose Man-at-Arms opening — it asks nothing special of your civ, so it works as a default
      whenever you are unsure what your opponent is doing.
    - >-
      The deer lure is the engine of the build: it banks the extra food that lets you click Feudal on time and still
      afford the Man-at-Arms upgrade plus the early Militia.
    - >-
      Send the 3 Militia out the instant you reach Feudal and upgrade them to Man-at-Arms; their job is to pin villagers
      and force a Spearman response while your economy rebuilds behind the wall.
    - >-
      The Archery Range comes online once Double-Bit Axe and the gold are flowing — Archers with Fletching are the real
      damage source, with Man-at-Arms acting as the shield in front of them.
    - >-
      Wall as you go and add Spearmen or a tower if Scouts show up; the early aggression buys time; it is not meant to
      win on its own.
    - >-
      The clean continuation is Castle Age Crossbows: once the Feudal fight settles, take your Archers into Crossbowman
      and Bodkin Arrow rather than overcommitting Militia.
  tr:
    - >-
      Bu, her duruma uygun Man-at-Arms açılışıdır — uygarlığından özel bir şey istemez, bu yüzden rakibinin ne
      yaptığından emin değilken varsayılan seçenek olarak işe yarar.
    - >-
      Geyik çekme bu açılışın motorudur: Feudal'a zamanında tıklamanı sağlayan ve hâlâ hem Man-at-Arms yükseltmesine hem
      de erken Milis'e gücün yetmesini sağlayan fazladan yiyeceği biriktirir.
    - >-
      Feudal'a ulaşır ulaşmaz 3 Milis'i dışarı gönder ve Man-at-Arms'a yükselt; görevleri köylüleri köşeye sıkıştırmak
      ve ekonomin duvarın arkasında toparlanırken rakibi Mızrakçı yapmaya zorlamaktır.
    - >-
      Okçu Menzili, Double-Bit Axe ve altın akmaya başladığında devreye girer — Fletching'li Okçular asıl hasar
      kaynağıdır; Man-at-Arms ise önlerinde kalkan görevi görür.
    - >-
      İlerledikçe duvar ör; Hızlı Süvari (Scout) görürsen Mızrakçı veya kule ekle; erken baskı sana zaman kazandırır;
      tek başına kazanmak için değildir.
    - >-
      Temiz devam Castle Çağ Crossbow'larıdır: Feudal kavgası yatıştığında, Milis'e fazla yüklenmek yerine Okçularını
      Crossbowman ve Bodkin Arrow'a taşı.
