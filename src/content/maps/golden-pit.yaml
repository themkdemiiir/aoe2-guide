body:
  en: >-
    Golden Pit is a competitive map with a large concentrated gold deposit in the center. Unlike Arabia where gold is
    near each player's base, the central pit requires actively fighting for it. Players must balance mining their own
    near-gold patches versus racing to control the pit with cavalry. The map is otherwise open — pure military
    efficiency decides who holds the center.


    ## Opening


    Fast Feudal with heavy scout scouting to locate the central pit. Early Knights or Scout Cavalry are used to contest
    the gold long before either player can settle a Mining Camp there. Players often produce minimal Feudal economy
    investment and invest heavily in early Stable units to reach the pit first.


    ## Mid game


    Castle Age is centered entirely on controlling the pit. Both players typically arrive simultaneously with Knight or
    Cavalry Archer forces. Whoever fortifies the pit — typically a forward Castle near the gold — wins the economic
    battle. Siege Workshops near the pit allow Mangonel + Knight combinations to hold it against multiple attack waves.


    ## Watch out for


    - **Pit timing** — the player who reaches the central pit first and drops a forward Castle is in a near-winning
    position. Every minute of delayed Castle Age costs valuable gold mining time.

    - **Permanent cutoff** — if you cannot dislodge the opponent's forward castle near the pit, you are gold-starved for
    the rest of the game. Prioritize stone for a counter-castle.

    - **Neglecting near-gold** — some players over-focus on the pit and neglect their own starting gold patches, which
    are still accessible for the first 15–20 minutes.
  tr: >-
    Golden Pit, merkezde büyük ve yoğun bir Altın yatağı bulunan rekabetçi bir haritadır. Altın'ın her oyuncunun üssüne
    yakın olduğu Arabia'nın aksine, merkezdeki pit için aktif biçimde savaşmak gerekir. Oyuncular kendi yakın Altın
    kaynaklarını işletmek ile cavalry ile pit'i kontrol etmek için yarışmak arasında denge kurmak zorundadır. Harita
    bunun dışında açıktır — merkezi kimin tutacağını yalnızca saf askeri verimlilik belirler.


    ## Açılış


    Merkezdeki pit'i tespit etmek için yoğun Scout keşifleriyle hızlı Feodal Çağ. Herhangi bir oyuncu orada bir Mining
    Camp kurabilmeden çok önce, Altın'ı çekişmek için erken Knight'lar veya Scout Cavalry kullanılır. Oyuncular
    genellikle Feodal Çağ ekonomisine minimum yatırım yapar ve pit'e ilk ulaşmak için erken Stable birimlerine ağırlık
    verir.


    ## Orta Oyun


    Kale Çağı tamamen pit'i kontrol etmeye odaklanır. Her iki oyuncu da genellikle Knight veya Cavalry Archer
    kuvvetleriyle aynı anda gelir. Pit'i kim tahkim ederse — genellikle Altın'ın yanına kurulan ileri bir Castle —
    ekonomik savaşı o kazanır. Pit yakınındaki Siege Workshop'lar, birden fazla saldırı dalgasına karşı pit'i tutmak
    için Mangonel + Knight kombinasyonuna olanak tanır.


    ## Dikkat Edilecekler


    - **Pit zamanlaması** — merkezdeki pit'e ilk ulaşan ve ileri bir Castle kuran oyuncu neredeyse kazanan konumdadır.
    Her dakikalık Kale Çağı gecikmesi değerli Altın madenciliği zamanına mal olur.

    - **Kalıcı kesim** — rakibinin pit yakınındaki ileri Castle'ını sökemediysen, oyunun geri kalanında Altın'sız
    kalırsın. Counter-castle için Taş'a öncelik ver.

    - **Yakın Altın'ı ihmal etmek** — bazı oyuncular pit'e aşırı odaklanarak ilk 15–20 dakika boyunca erişilebilir olan
    kendi başlangıç Altın kaynaklarını ihmal eder.
