        - italians
        - byzantines
      strategy:
        en: >-
          Water combat flanks. Each flank must control their portion of the ocean; coordinated Galleon + Fire Ship
          pushes destroy enemy navy.
        tr: >-
          Su savaşı flankları. Her flank kendi okyanus bölgesini kontrol etmek zorundadır; koordineli Galleon + Fire
          Ship atakları düşman filosunu imha eder.
    pocket:
      civs:
