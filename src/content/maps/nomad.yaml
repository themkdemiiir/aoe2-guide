  - cumans
teamComps:
  2v2:
    flank:
      civs:
        - huns
        - cumans
        - mongols
        - berbers
      strategy:
        en: >-
          Cavalry civs who don't need houses (Huns) or build fast (Cumans, Mongols). Secure your starting area and raid
          before the opponent can settle safely.
        tr: >-
          Ev inşa etmesi gerekmeyen (Huns) ya da hızlı kurulan (Cumans, Mongols) süvari uygarlıkları. Başlangıç alanını
          güvence altına al ve rakip rahatça yerleşmeden önce baskı uygula.
    pocket:
      civs:
        - chinese
        - aztecs
        - slavs
        - byzantines
      strategy:
        en: >-
          Settle your TC in the most defensible spot and boom. Chinese extra starting resources are extremely powerful
          in Nomad where every resource matters in the first 2 minutes.
        tr: >-
          Town Center'ı en savunulabilir noktaya kur ve boom yap. Chinese'nin ekstra başlangıç kaynakları, her kaynağın
          kritik olduğu ilk 2 dakikada Nomad'da son derece güçlüdür.
  4v4:
    flank:
      civs:
        - huns
        - mongols
        - cumans
        - tatars
      strategy:
        en: >-
          Cavalry flanks settle fast and immediately harass. Huns skip house building completely; Tatars have sheep that
          produce extra food.
        tr: >-
          Süvari flank'lar hızla yerleşir ve hemen baskı başlatır. Huns ev inşaatını tamamen atlar; Tatars'ın koyunları
          ekstra Yiyecek üretir.
    pocket:
      civs:
        - chinese
        - slavs
        - persians
        - byzantines
      strategy:
        en: >-
          Pocket settles in the most secure location and booms. Persians get extra TC work rate; Slavs farm faster for
          sustained eco.
        tr: >-
          Pocket en güvenli konuma yerleşir ve boom yapar. Persians Town Center çalışma hızı bonusu alır; Slavs daha
          hızlı çiftçilik yaparak ekonomiyi sürdürür.
body:
  en: >-
    Nomad is defined by its no-Town-Center start. You begin with 3–4 scattered villagers — Chinese get 6, Mayans get 4 —
    and must find wood, build a Lumber Camp, and construct a Town Center before producing any new villagers. Extreme
    early vulnerability makes TC placement the single most important decision of the game. Matches can be chaotic in the
    opening minutes but extend to normal Castle or Imperial Age play once TCs are established.


    ## Opening


    Scout aggressively to find safe locations offering nearby wood, food, and accessible gold. Wood comes first — you
    need 275 wood for the TC. Chinese and Mayans have the strongest starts since extra villagers gather wood faster.
    Malians benefit from free wood upgrades, Persians from faster TC build time. Build the TC in a defensible location
    not too close to the enemy, with water access on hybrid variants. If opponents are nearby, a Tower Rush in Dark Age
    is viable to disrupt their TC construction. Vietnamese have a unique advantage: their team bonus reveals each
    enemy's first TC location the moment it is placed.


    ## Mid game


    Once TCs are built, the game roughly normalizes to a standard Feudal-to-Castle transition on a compressed timeline.
    A late TC placement creates a permanent villager-count deficit that is very difficult to overcome. The common arc is
    Fast Castle into Knights if the start was clean, or Feudal aggression (Scouts + Spears, or Towers) if the start was
    contested. Cumans can build a second TC in Feudal Age, accelerating their Nomad economy dramatically and often
    reaching Castle Age with a significant villager lead.


    ## Watch out for


    - **Bad TC placement** — too close to the enemy invites a Dark Age Tower Rush before your first new villager is
    produced.

    - **Not prioritizing wood** — delaying the TC by 30 seconds puts you a full villager behind for the entire game.

    - **Isolated resource pockets** — wood without nearby food or gold forces costly long-distance trekking and wastes
    villager time.

    - **Not scouting for enemy TC location** — lets the opponent optimize aggression timing around your production gap.

    - **Over-committing to navy on hybrid variants** — building fishing ships while the enemy land-rushes can lose the
    land game entirely.
  tr: >-
    Nomad, Town Center'sız başlangıcıyla tanımlanır. 3–4 dağınık köylüyle başlarsın — Chinese 6, Mayans 4 tane alır — ve
    yeni köylü üretebilmek için odun bulman, bir Lumber Camp kurman ve bir Town Center inşa etmen gerekir. İlk dönemdeki
    aşırı kırılganlık, Town Center yerleşimini oyunun en kritik kararı haline getirir. Açılış dakikaları kaotik
    olabilir; ancak Town Center'lar kurulduktan sonra oyun normal Kale Çağı ya da İmparatorluk Çağı akışına döner.


    ## Açılış


    Yakınında odun, yiyecek ve erişilebilir altın bulunan güvenli konumlar bulmak için agresif keşif yap. Önce odun
    gelir — Town Center için 275 Odun'a ihtiyacın var. Chinese ve Mayans, ekstra köylüler odunu daha hızlı toplayacağı
    için en güçlü başlangıca sahiptir. Malians ücretsiz odun yükseltmelerinden, Persians ise daha hızlı Town Center inşa
    süresinden yararlanır. Town Center'ı düşmana çok yakın olmayan, savunulabilir bir konuma ve hibrit haritalarda su
    erişimi olan bir yere inşa et. Rakipler yakınsa, onların Town Center inşaatını aksatmak için Karanlık Çağ'da Tower
    Rush uygulanabilir. Vietnamese'nin benzersiz bir avantajı vardır: takım bonusları, her düşmanın ilk Town Center'ının
    konumunu yerleştirildiği anda ortaya çıkarır.


    ## Orta Oyun


    Town Center'lar kurulunca oyun, kısalmış bir zaman çizelgesinde standart Feodal Çağ'dan Kale Çağı'na geçişe
    yaklaşır. Geç kurulan bir Town Center, üstesinden gelinmesi çok zor kalıcı bir köylü sayısı açığı oluşturur. Yaygın
    akış, başlangıç temiz geçtiyse Knight rush'a giden Fast Castle; başlangıç zorlu geçtiyse Feodal saldırı (Scout'lar +
    mızrakçılar ya da Tower'lar) şeklindedir. Cumans, Feodal Çağ'da ikinci bir Town Center kurarak Nomad ekonomisini
    dramatik biçimde hızlandırır ve genellikle Kale Çağı'na belirgin bir köylü üstünlüğüyle ulaşır.


    ## Dikkat Et


    - **Kötü Town Center yerleşimi** — düşmana çok yakın olmak, ilk yeni köylün üretilmeden önce Karanlık Çağ Tower
    Rush'ına davetiye çıkarır.

    - **Odunu önceliklendirmemek** — Town Center'ı 30 saniye geciktirmek seni tüm oyun boyunca tam bir köylü gerisinde
    bırakır.

    - **Yalıtılmış kaynak cepleri** — yakınında yiyecek veya altın olmayan odun, maliyetli uzak mesafe yürüyüşlerine ve
    köylü kaybına yol açar.

    - **Düşman Town Center konumunu keşfetmemek** — rakibin saldırı zamanlamasını senin üretim açığına göre optimize
    etmesine izin verir.

    - **Hibrit haritalarda deniz kuvvetlerine aşırı kaynak aktarmak** — düşman kara saldırısı yaparken balıkçı gemisi
    inşa etmek, kara oyununu tamamen kaybettirabilir.
