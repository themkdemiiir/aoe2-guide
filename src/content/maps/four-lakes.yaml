body:
  en: >-
    Four Lakes is a large team game map with four distinct lake clusters, each holding rich gold, stone, and fish
    deposits. Players start on land near a lake — controlling your lake and denying the opponent theirs is the primary
    objective. Games have two phases: Feudal Age Galley skirmishes for dock control, and Castle Age land wars decided by
    who accumulated more water-economy resources.


    ## Opening


    Two viable openers: **Water opener** (build a Dock, produce Fishing Ships for economy + War Galleys for lake
    control) and **Land rush** (ignore water, fast Feudal or Castle Age, raid opponent's shore economy). In 4v4,
    typically one flank opens water while the other secures land. Pocket positions should Fast Castle for economic boom.


    ## Mid game


    Whichever team controls 3 of the 4 lakes controls the majority of the map's gold. Castle Age is decided by land
    military — Knights, Crossbow, and Siege. Pocket positions push toward the center; flanks push toward enemy flank
    lakes. Water units can become less relevant in late Castle Age as siege pushes dominate.


    ## Watch out for


    - **Losing your Dock** — if the opponent destroys your Dock in Feudal and builds their own on your lake, you lose
    access to that gold permanently.

    - **Over-committing to water** — a heavy naval open in 4v4 can be countered by a land push directly on your shore
    villagers.

    - **Failure to coordinate** — the best teams have one player opening water and one opening land per pair of flanks
    simultaneously.
  tr: >-
    Four Lakes, her birinde zengin Altın, Taş ve balık yatakları bulunan dört ayrı göl kümesine sahip büyük bir takım
    haritasıdır. Oyuncular göl yakınındaki karada başlar — kendi gölünü kontrol etmek ve düşmanın gölünü engellemek
    birincil hedeftir. Oyunlar iki aşamada geçer: Feodal Çağ'da dock kontrolü için Galley çatışmaları, Kale Çağı'nda ise
    su ekonomisinden kim daha fazla kaynak biriktirdiyse onun kazandığı kara savaşları.


    ## Açılış


    İki geçerli açılış seçeneği var: **Su açılışı** (Dock kur, ekonomi için Fishing Ship üret ve göl kontrolü için War
    Galley çıkar) ve **Kara rush** (suyu yok say, hızlıca Feodal Çağ veya Kale Çağı'na geç, düşmanın kıyı ekonomisini
    vur). 4v4'te genellikle bir flank suya açılırken diğeri karayı güvence altına alır. Pocket pozisyonları ekonomik
    boom için Fast Castle yapmalıdır.


    ## Orta Oyun


    4 gölden 3'ünü kontrol eden takım haritanın Altın çoğunluğunu kontrol eder. Kale Çağı kara ordularıyla belirlenir —
    Knight'lar, Crossbow ve Siege. Pocket pozisyonları merkeze doğru iter; flanklar düşman flank göllerine doğru iter.
    Su birimleri, Siege baskılarının belirleyici olduğu geç Kale Çağı'nda giderek önemsizleşebilir.


    ## Dikkat Edilmesi Gerekenler


    - **Dock'unu kaybetmek** — düşman Feodal'da Dock'unu yıkıp kendi gölüne Dock kurarsa o Altın'a kalıcı olarak
    erişimini yitirirsin.

    - **Suya gereğinden fazla yatırım yapmak** — 4v4'te ağır bir denizci açılışı, kıyı köylülerine doğrudan kara
    ataklarıyla counter'lanabilir.

    - **Koordinasyon eksikliği** — en iyi takımlarda her flank çiftinde bir oyuncu suya, diğeri karaya aynı anda açılır.
