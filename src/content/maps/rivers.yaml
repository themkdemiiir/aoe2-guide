slug: rivers
name:
  en: Rivers
  tr: Rivers
type: hybrid
recommendedCivs:
  - franks
  - magyars
  - lithuanians
  - celts
  - malians
teamComps:
  2v2:
    flank:
      civs:
        - britons
        - mayans
        - ethiopians
        - celts
      strategy:
        en: >-
          Archer civs garrison behind bridge palisades for a devastating chokepoint defense, then push across with
          Crossbow + Mangonel once the bridge is secured.
        tr: >-
          Archer medeniyetleri, köprü palisade'larının arkasında garnizon kurarak ezici bir boğaz savunması oluşturur;
          ardından köprüyü ele geçirdikten sonra Crossbow + Mangonel ile karşıya geçer.
    pocket:
      civs:
        - franks
        - magyars
        - lithuanians
        - berbers
      strategy:
        en: >-
          Cavalry pocket exploits multiple crossings — fast Knights raid around the flanks while the team holds the main
          bridge.
        tr: >-
          Süvari pocket, birden fazla geçidi kullanır — hızlı Knight'lar flanklardan baskın yaparken takım ana köprüyü
          tutar.
  4v4:
    flank:
      civs:
        - britons
        - mayans
        - ethiopians
        - koreans
      strategy:
        en: >-
          Flanks lock down bridges with massed archers and towers; Koreans' cheaper towers make chokepoint walls
          trivial.
        tr: >-
          Flanklar, kitlesel archer'lar ve kulelerle köprüleri kilitler; Koreans'ın daha ucuz kuleleri boğaz duvarlarını
          kolaylaştırır.
    pocket:
      civs:
        - franks
        - lithuanians
        - magyars
        - cumans
      strategy:
        en: >-
          Pockets boom and flood Knights across the least-defended crossing. Cumans' Feudal 2TC boom outpaces the enemy
          economy before the bridge fights even start.
        tr: >-
          Pocket'lar boom yapar ve en az savunulan geçitten Knight'larla karşıya geçer. Cumans'ın Feodal 2TC boom'u,
          köprü savaşları başlamadan önce düşman ekonomisini geride bırakır.
body:
  en: >-
    Rivers is a competitive map bisected by one or more river channels. Players start on one side and must cross via
    bridge chokepoints to engage the enemy. Some variants include shallow fords usable by cavalry. The map rewards
    cavalry civs that can rapidly cross and raid, and penalizes siege-heavy builds that struggle through chokepoints.


    ## Opening


    Standard opener is an aggressive Feudal push: fast Feudal (18–21 pop) with Scouts or Men-at-Arms to threaten bridge
    control. Building palisades at bridges to funnel enemy units through a single chokepoint buys critical time. Archery
    civs can garrison Archers behind bridge palisades for devastating chokepoint defense.


    ## Mid game


    Castle Age is decided by who controls the bridges. A large Knight force crossing a bridge is extremely dangerous —
    there is minimal room to maneuver on the opposite side, and Mangonels at bridge exits are devastating. Siege Rams
    are essential for pushing through defended bridges. High-mobility cavalry can exploit multiple crossing points
    simultaneously.


    ## Watch out for


    - **Undefended bridge crossing** — crossing a defended bridge with unsupported cavalry is nearly always fatal. Send
    Rams or Trebs first.

    - **Ford scouting** — some Rivers variants have shallow crossings invisible on the minimap. Scout thoroughly in Dark
    Age.

    - **River flank attack** — while armies fight at bridges, light cavalry or a fishing boat can push around the edge
    and attack the economy from behind.
  tr: >-
    Rivers, bir veya birden fazla nehir kanalıyla ikiye bölünmüş rekabetçi bir haritadır. Oyuncular bir tarafta başlar
    ve düşmanla karşılaşmak için köprü boğazlarından geçmek zorunda kalır. Bazı varyantlarda süvarinin kullanabileceği
    sığ geçitler de bulunur. Harita, hızlıca karşıya geçip baskın yapabilen süvari medeniyetlerini ödüllendirir;
    boğazlarda zorlanan ağır kuşatma odaklı build'leri ise dezavantajlı bırakır.


    ## Açılış


    Standart açılış, agresif bir Feodal Çağ baskısıdır: köprü kontrolünü tehdit etmek için Scout'lar ya da Men-at-Arms
    ile hızlı Feodal Çağ (18–21 nüfus). Köprülere palisade dikerek düşman birimlerini tek bir boğazdan geçmeye zorlamak
    kritik zaman kazandırır. Archer medeniyetleri, ezici bir boğaz savunması için Archer'larını köprü palisade'larının
    arkasında garnizon yapabilir.


    ## Orta Oyun


    Kale Çağı, köprüleri kimin kontrol ettiğiyle belirlenir. Köprüden geçen büyük bir Knight kuvveti son derece
    tehlikelidir — karşı tarafta manevra alanı çok kısıtlıdır ve köprü çıkışlarındaki Mangonel'ler yıkıcı olur.
    Savunulan köprülerden geçmek için Siege Ram'ler şarttır. Yüksek hareketlilikli süvari, birden fazla geçit noktasını
    aynı anda sömürebilir.


    ## Dikkat Edilecekler


    - **Savunmasız köprü geçişi** — desteksiz süvariyle savunulan bir köprüden geçmek neredeyse her zaman ölümcüldür.
    Önce Ram ya da Treb gönder.

    - **Geçit keşfi** — bazı Rivers varyantlarında minimapte görünmeyen sığ geçitler bulunur. Karanlık Çağ'da iyice
    keşfet.

    - **Nehir flank saldırısı** — ordular köprülerde çarpışırken, hafif süvari veya bir balıkçı teknesi kenarda dolaşıp
    ekonomiye arkadan saldırabilir.
