slug: fortress
name:
  en: Fortress
  tr: Fortress
type: closed
recommendedCivs:
  - teutons
  - chinese
  - burgundians
  - bohemians
  - turks
teamComps:
  2v2:
    flank:
      civs:
        - franks
        - celts
        - slavs
        - chinese
      strategy:
        en: >-
          Flank Fast Castles and pushes with Knights or Battering Rams against the enemy fortification. Celts produce
          siege faster; Franks' Knights survive the long grind to break walls.
        tr: >-
          Flank, Knight veya Battering Ram ile hızlı Kale Çağı'na atlar ve düşman tahkimatına baskı yapar. Celts kuşatma
          araçlarını daha hızlı üretir; Franks'ın Knight'ları duvarları kırmak için gereken uzun çatışmada hayatta
          kalır.
    pocket:
      civs:
        - teutons
        - burgundians
        - bohemians
        - turks
      strategy:
        en: >-
          Pocket booms behind the towers and masses unique units + gunpowder. Teutonic Knights and Bohemian Hand
          Cannoneers are devastating once the economy is safe.
        tr: >-
          Pocket, kuleler arkasında boom yapar, özgün birimler ve ateşli silahlar yığar. Ekonomi güvende olduğunda
          Teutonic Knight'lar ve Bohemian Hand Cannoneers yıkıcı hale gelir.
  4v4:
    flank:
      civs:
        - franks
        - slavs
        - celts
        - chinese
      strategy:
        en: >-
          Flanks coordinate siege pushes — Rams and Trebuchets to crack neighboring fortresses while Knights clean up
          villagers.
        tr: >-
          Flank'lar kuşatma baskısını koordine eder — komşu kaleleri kırmak için Ram ve Trebuchet kullanırken Knight'lar
          köylüleri temizler.
    pocket:
      civs:
        - teutons
        - turks
        - bohemians
        - burgundians
      strategy:
        en: >-
          Pocket goes deep boom into Imperial gunpowder. Turks fast-imp Janissaries and Bohemian Houfnice are nearly
          unstoppable behind a fortified position.
        tr: >-
          Pocket, İmparatorluk Çağı ateşli silahlarına kadar derin boom yapar. Turks hızla Janissary'lere ulaşır;
          Bohemian Houfnice tahkimatlı bir mevzinin arkasında durdurulamaz hale gelir.
body:
  en: >-
    Fortress is a closed map similar to Arena but with pre-built towers along the stone wall ring — giving each player
    stronger starting defenses. The heavier fortification makes Fast Castle near-universal; players race to Castle Age,
    boom their economy, then assault with siege. Unique units, siege, and monk-and-siege armies dominate. Relics outside
    the walls are the first contested resource.


    ## Opening


    Standard opener is a 23-villager Fast Castle — identical to Arena. No Feudal military is produced since walls and
    towers protect against early aggression. Send the scout out the Fortress gate immediately to capture relics outside.
    First player to scout relics and send Monks wins the gold war. A 2nd Town Center is typically the first Castle Age
    build.


    ## Mid game


    Siege production is critical. Trebuchets and Rams are needed to breach enemy Fortress walls, which have higher HP
    than Arena's plain walls due to the towers. Unique units perform well — Teutonic Knights, Janissaries, Huskarls, and
    Coustilliers all excel. Monks + Siege is the go-to combination. Bohemians, Turks, and Spanish shine especially in
    Imperial Age with gunpowder.


    ## Watch out for


    - **Pre-built tower blind spots** — starting towers create dead zones where enemies can sneak a Ram without entering
    tower range.

    - **Forgetting Masonry + Architecture** — walls and towers fall quickly without these upgrades; research them early
    in Castle Age.

    - **False sense of security** — a well-timed forward Castle near your wall can collapse the position even on
    Fortress.

    - **Stone drain** — Trebuchets and Castle drops consume stone rapidly; manage your stone economy carefully.
  tr: >-
    Fortress, Arena'ya benzer kapalı bir haritadır; ancak taş duvar halkası boyunca önceden inşa edilmiş kuleler
    sayesinde her oyuncuya daha güçlü başlangıç savunmaları sunar. Daha ağır tahkimat, Fast Castle'ı neredeyse evrensel
    kılar; oyuncular Kale Çağı'na yarışır, ekonomilerini boom yapar, ardından kuşatmayla saldırır. Özgün birimler,
    kuşatma araçları ve keşiş-kuşatma orduları belirleyicidir. Duvarların dışındaki Relic'ler ilk tartışmalı kaynaktır.


    ## Açılış


    Standart açılış, Arena ile aynı olan 23 köylülü Fast Castle'dır. Duvarlar ve kuleler erken saldırılara karşı koruma
    sağladığından Feodal Çağ askeri üretilmez. Scout'u hemen Fortress kapısından dışarı gönder ve dışarıdaki Relic'leri
    kap. Relic'leri keşfedip Monk gönderen ilk oyuncu altın savaşını kazanır. 2. Town Center genellikle Kale Çağı'ndaki
    ilk inşaattır.


    ## Orta Oyun


    Kuşatma üretimi kritik öneme sahiptir. Trebuchet ve Ram, kuleler nedeniyle Arena'nın düz duvarlarından daha yüksek
    can puanına sahip düşman Fortress duvarlarını delmek için gereklidir. Özgün birimler iyi performans gösterir —
    Teutonic Knight'lar, Janissary'ler, Huskarl'lar ve Coustillier'lar öne çıkar. Keşiş ve Kuşatma en yaygın
    kombinasyondur. Bohemians, Turks ve Spanish, İmparatorluk Çağı'nda ateşli silahlarıyla özellikle parlar.


    ## Dikkat Et


    - **Önceden inşa edilmiş kule kör noktaları** — başlangıç kuleleri, düşmanların kule menzili dışında Ram
    sokabileceği ölü bölgeler oluşturur.

    - **Masonry ve Architecture'ı unutmak** — bu yükseltmeler yapılmadan duvarlar ve kuleler hızla çöker; Kale Çağı'nın
    başında araştır.

    - **Sahte güvenlik hissi** — duvarına yakın zamanlanmış ileri bir Castle, Fortress'ta bile mevziini çökertebilir.

    - **Taş tükenmesi** — Trebuchet ve Castle inşaatları taşı hızla tüketir; taş ekonomini dikkatli yönet.
