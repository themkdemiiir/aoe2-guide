slug: hideout
name:
  en: Hideout
  tr: Hideout
type: closed
recommendedCivs:
  - britons
  - ethiopians
  - mayans
  - bohemians
  - burgundians
teamComps:
  2v2:
    flank:
      civs:
        - britons
        - ethiopians
        - mayans
        - koreans
      strategy:
        en: >-
          Archer civs defend the narrow entrances and snipe units as they funnel in. Britons out-range everything;
          Koreans add cheap defensive towers at the chokepoints.
        tr: >-
          Archer medeniyetleri dar girişleri savunur ve içeri süzülen birimleri ayıklar (sniping). Britons her şeyden
          daha uzun menzile sahiptir; Koreans boğaz noktalarına ucuz savunma Tower'ı ekler.
    pocket:
      civs:
        - aztecs
        - bohemians
        - burgundians
        - byzantines
      strategy:
        en: >-
          Pocket booms behind the protected entrance and masses unique units or gunpowder. Burgundian Coustilliers and
          Bohemian Hand Cannoneers excel once the eco is safe.
        tr: >-
          Pocket, korumalı giriş arkasında boom yapar ve özgün birimler ya da barut ağırlıklı güç toplar. Burgundian
          Coustillier'lar ve Bohemian Hand Cannoneers, ekonomi güvende olunca çok etkilidir.
  4v4:
    flank:
      civs:
        - britons
        - ethiopians
        - mayans
        - koreans
      strategy:
        en: >-
          Flanks lock the entrances with massed archers + towers; coordinated Crossbow + Mangonel lines hold against any
          push.
        tr: >-
          Flank'lar girişleri toplu Archer'lar ve Tower'larla kilitler; koordineli Crossbow + Mangonel hatları her
          saldırıyı püskürtür.
    pocket:
      civs:
        - aztecs
        - bohemians
        - burgundians
        - turks
      strategy:
        en: >-
          Pockets deep-boom into Imperial gunpowder and unique units, then break out through one entrance with a siege +
          gunpowder ball.
        tr: >-
          Pocket'lar İmparatorluk Çağı'nda barut ve özgün birimlere derinlemesine boom yapar, ardından bir girişten
          siege + barut topuyla çıkış yapar.
body:
  en: >-
    Hideout is a semi-closed map where players begin inside a palisade wall ring enclosing their base. Unlike Arena's
    stone walls, these palisades are more vulnerable and can be breached in Feudal Age with a focused archer or
    Men-at-Arms push. Games trend toward Castle Age Fast Castle strategies, but Feudal aggression remains viable and
    traps passive opponents. Relic control matters significantly in the late game — all relics spawn outside the
    starting walls.


    ## Opening


    The default strategy is a Fast Castle (23-villager approach), leveraging palisade protection. Higher-level players
    often apply early pressure instead: a Feudal Age Tower plus Archers push can crack the enemy palisade and force
    heavy defensive spending. An alternative is Fast Castle into Light Cavalry for a relic dash — send cavalry out the
    gate immediately on reaching Castle Age to secure relics before the opponent reacts. The scout should identify relic
    locations during Dark Age. Wood lines are concentrated in the map's center, giving map control significance similar
    to gold on Arabia.


    ## Mid game


    Hideout rewards archers and archer upgrades. The walled nature combined with center-wood concentration favors unit
    compositions that fight well in chokepoints — archers, crossbows, and skirmishers. Siege — particularly Rams and
    Onagers — is required to break enemy walls and flood the base. Relic income can become decisive in extended games,
    making the monk-and-cavalry relic race on Castle Age arrival a high-stakes moment.


    ## Watch out for


    - **Palisade complacency** — a Feudal archer rush with 6–8 archers plus a ram can break the starting wall and raid
    your economy.

    - **Not adding an extra wall layer** — a single palisade wall is brittle; a second ring just inside the first buys
    critical extra defense time.

    - **Losing the relic race** — all relics are outside your walls; failing to scout and grab them hands the opponent a
    sustained gold advantage.

    - **Neglecting villager production during army micro** — late-game multitasking failures compound quickly on this
    map.

    - **No Castle before Imperial Age** — leaves you without Unique Unit production and without a defensive anchor for
    wall breach points.
  tr: >-
    Hideout, oyuncuların üslerini çevreleyen bir palisade duvar halkasının içinde başladığı yarı kapalı bir haritadır.
    Arena'nın taş duvarlarının aksine bu palisade'ler daha kırılgandır; odaklı bir Archer veya Men-at-Arms saldırısıyla
    Feodal Çağ'da yıkılabilir. Oyunlar genellikle Kale Çağı Fast Castle stratejilerine yönelir, ancak Feodal
    saldırganlık hâlâ geçerlidir ve pasif rakipleri tuzağa düşürür. Geç oyunda Relic kontrolü önemlidir — tüm Relic'ler
    başlangıç duvarlarının dışında doğar.


    ## Açılış


    Varsayılan strateji, palisade korumasından yararlanan bir Fast Castle'dır (23 köylü yaklaşımı). Üst düzey oyuncular
    bunun yerine erken baskı uygular: Feodal Çağ'da Tower ve Archer push'u düşmanın palisade'ini kırabilir ve onu ağır
    savunma harcamasına zorlayabilir. Alternatif olarak Fast Castle sonrası Light Cavalry ile Relic koşusu yapabilirsin
    — Kale Çağı'na ulaşır ulaşmaz Light Cavalry'yi kapıdan dışarı gönder ve rakip tepki vermeden Relic'leri al. Scout,
    Karanlık Çağ'da Relic konumlarını belirlemelidir. Odun hatları haritanın merkezinde yoğunlaşır; bu durum harita
    kontrolüne Arabia'daki Altın'a benzer bir önem kazandırır.


    ## Orta Oyun


    Hideout, Archer'ları ve Archer yükseltmelerini ödüllendirir. Duvarla çevrili yapı ile merkez-odun yoğunluğu, boğaz
    noktalarında iyi savaşan birim kompozisyonlarını destekler: Archer'lar, Crossbow'lar ve Skirmisher'lar. Düşmanın
    duvarlarını yıkıp üsse girmek için siege — özellikle Ram'ler ve Onager'lar — zorunludur. Uzun oyunlarda Relic geliri
    belirleyici olabilir; bu yüzden Kale Çağı'na gelişte Monk ve Light Cavalry ile yapılan Relic yarışı yüksek riskli
    bir an haline gelir.


    ## Dikkat Et


    - **Palisade özgüveni** — 6–8 Archer ve bir Ram ile yapılan Feodal rush başlangıç duvarını yıkabilir ve ekonomine
    baskın yapabilir.

    - **İkinci duvar katmanı eklememek** — tek bir palisade duvarı kırılgandır; birincisinin hemen içine ikinci bir
    halka eklemek kritik savunma süresi kazandırır.

    - **Relic yarışını kaybetmek** — tüm Relic'ler duvarlarının dışındadır; keşfedip almazsan rakibine sürekli bir Altın
    avantajı bırakmış olursun.

    - **Ordu micro'su sırasında köylü üretimini ihmal etmek** — geç oyunda çoklu görev hatası bu haritada hızla büyür.

    - **İmparatorluk Çağı'ndan önce Castle olmaması** — Özgün Birim üretimini ve duvar yarığı noktaları için savunma
    çapasını kaybedersin.
