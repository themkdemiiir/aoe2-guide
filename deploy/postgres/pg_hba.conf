# pg_hba for the aoe2 PG — LAN-only (defense-in-depth; the DB is offline, behind NAT).
# Mounted into the container; postgresql.conf points hba_file here.
# TYPE  DATABASE  USER  ADDRESS             METHOD
local   all       all                       trust
host    all       all   127.0.0.1/32        trust
host    all       all   ::1/128             trust
# only the home LAN may connect (with password); everything else is denied (no catch-all).
host    all       all   192.168.111.0/24    scram-sha-256
