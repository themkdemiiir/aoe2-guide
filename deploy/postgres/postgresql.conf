# PostgreSQL 18 — aoe2 pipeline (offline analytical batch; 12 GB LXC; NVMe).
# Mounted read-only into the postgres:18.4 container via docker-compose.
# Tune shared_buffers/effective_cache_size up as the DuckDB VM retires and the CT gains RAM.

listen_addresses = '*'
max_connections = 50

# --- memory ---
shared_buffers = 3GB
effective_cache_size = 8GB
work_mem = 256MB
maintenance_work_mem = 1GB

# --- WAL / checkpoints (bulk COPY-heavy ingest) ---
wal_level = replica
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# --- planner: NVMe ---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- parallelism (big GROUP BY / matview refresh over 100M+ events) ---
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# --- PG 18 async I/O (new). 'worker' is LXC-safe (io_uring may be blocked in a container) ---
io_method = worker

# --- logging ---
log_min_duration_statement = 2000   # log slow (>2s) statements
log_checkpoints = on
