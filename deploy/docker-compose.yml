# aoe2-guide self-hosted data stack — all versions PINNED (no `latest`).
# Runs in the privileged Docker LXC `aoe2-stack` (192.168.111.8) on botanera's NVMe.
# Postgres now; Dagster + dbt join with the orchestration milestone (M5/M6).
name: aoe2-stack

services:
  postgres:
    # digest-pinned (immutable) — not just the :18.4 tag
    image: postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20
    container_name: aoe2-postgres
    restart: unless-stopped
    shm_size: "1gb" # parallel workers / big sorts
    environment:
      POSTGRES_USER: aoe2
      POSTGRES_DB: aoe2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      # PG18 image: VOLUME=/var/lib/postgresql (PGDATA=/var/lib/postgresql/18/docker inside).
      # Bind the NVMe mount to the WHOLE dir, not /data.
      - /opt/pgdata:/var/lib/postgresql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "5432:5432" # LAN (offline); reached by ingest/export + Dagster
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aoe2 -d aoe2"]
      interval: 10s
      timeout: 5s
      retries: 6
    stop_grace_period: 30s
