[package]
name = "replay-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen wrapper over replay_rs::analyze — in-browser AoE2 replay coaching for aoe2guide.com"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The pure analysis lib (no CLI deps — see replay-rs [features]).
replay-rs = { path = "../replay-rs", default-features = false }
# Same vendored parser instance the lib uses (path-dep — one crate, one version).
aoe2rec = { path = "../replay-rs/vendor/aoe2rec/crates/aoe2rec" }
bytes = "1"
serde_json = "1"
wasm-bindgen = "0.2"
# Panics surface as readable JS console errors instead of "unreachable executed".
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
