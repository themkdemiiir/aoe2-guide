[package]
name = "analyzer"
version = "0.1.0"
edition = "2021"
description = "Pure AoE2 replay-analysis lib (analyze/config/postgame) — no CLI/network/DB deps, compiles native + wasm32. Task 4a code-move of scripts/data-pipeline/replay-rs's pure lib subset."
license = "MIT"

[lib]
name = "analyzer"
path = "src/lib.rs"

[dependencies]
# In-process replay parser, vendored + committed at ../../vendor/aoe2rec (Task 4a).
aoe2rec = { path = "../../vendor/aoe2rec" }

# Row (de)serialisation for Report/Costs/Benchmark + generic action-variant tagging.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Ergonomic error handling in `analyze::analyze`/`resolve_you`.
anyhow = "1"

[dev-dependencies]
# Only the `analyze_cli` parity example needs this (Savegame::from_bytes takes
# bytes::Bytes) — kept out of [dependencies] so the compiled lib stays CLI-free.
bytes = "1"

# NOTE: no [profile.release] here — this crate is a workspace member now, and
# Cargo only reads profiles from the workspace root (../../Cargo.toml). See the
# comment there for why the release profile is unified across both crates.
